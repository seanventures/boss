<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 8px 10px; color: #1f2328; background: transparent; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 4px 0; border-bottom: 1px solid #e5e7eb; }
  .src { color: #6b7280; font-size: 11px; margin-left: 6px; }
  .empty { color: #6b7280; }
  @media (prefers-color-scheme: dark) { body { color: #e6edf3; } li { border-color: #30363d; } }
</style>
</head>
<body>
<ul id="notes"><li class="empty">Loading…</li></ul>
<script>
  window.bossExt.getContext().then(function (ctx) {
    var list = document.getElementById("notes");
    var notes = (ctx && ctx.data && ctx.data.notes) || [];
    list.textContent = "";
    if (!notes.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No notes yet. Agents add them with the add_note tool; deploys add them on their own.";
      list.appendChild(li);
    }
    notes.slice().reverse().forEach(function (n) {
      var li = document.createElement("li");
      li.textContent = n.text;
      var s = document.createElement("span");
      s.className = "src";
      s.textContent = n.source + ", " + n.at;
      li.appendChild(s);
      list.appendChild(li);
    });
    window.bossExt.resize(document.documentElement.scrollHeight);
  });
</script>
</body>
</html>
