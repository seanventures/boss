apiVersion: boss.plugin/v1
kind: Plugin
metadata:
  id: official.minio-s3
  name: S3-compatible object storage (MinIO)
  version: 0.1.0
  owner: BOSS maintainers
  license: Apache-2.0
  description: >-
    MinIO on the app's private network: one bucket and an access key scoped to it. Endpoint, bucket
    and key reach the app as vault references.
spec:
  supportLevel: experimental
  capabilities: [object-storage, object-storage.s3]
  features: [bucket, scoped-credentials]
  engines: [minio, s3]
  engineVersions: ["RELEASE.2026-09-22T19-25-18Z (cgr.dev/chainguard/minio)"]
  runtime: {type: python, entrypoint: "plugin:MinioS3Plugin"}
  permissions: {secrets: [read-scoped, write-scoped], network: [declared-services], docker: true}
  configSchema:
    type: object
    additionalProperties: false
    properties:
      bucket: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"}
      image: {type: string, description: "Your own MinIO image, pinned by digest (name@sha256:...); must provide sh and mc"}
  hooks: [validate, plan, provision, configure, verify, observe, destroy]
  bindings: [S3_ENDPOINT_URL, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY]
  ports: [9000]
  limitations:
    - "S3 API compatibility as MinIO implements it; AWS IAM, lifecycle and replication semantics are not certified."
    - "No backup hook in P0: mirror the bucket with mc mirror if the objects matter."
    - "MinIO no longer publishes community images anonymously. The default is Chainguard's signed, multi-arch MinIO (cgr.dev/chainguard/minio, cosign-verifiable), pinned by digest; an operator may supply their own MinIO image as config.image, pinned by digest (it must provide sh and mc)."
    - "No published port: only services on the app's compose network reach it."
    - "The root password is generated in the container and kept in its own volume; it never leaves the host."
