<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jump to anything</title>
<link rel="stylesheet" href="../console.css"><link rel="stylesheet" href="../project.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
</head>
<body data-active="projects" data-project="1" data-tab="overview" data-crumb="Projects|HelpDesk AI Demo">
<div id="content"><section class="card" style="height:400px;opacity:.5"></section></div>
<div id="overlay">
<div class="scrim"></div>
<div class="pal" role="dialog" aria-label="Jump to">
  <div class="pal-in"><i class="ph ph-magnifying-glass"></i><span>pr 3</span><span class="wf-spacer"></span><span class="tag"><i class="ph ph-folders"></i>HelpDesk AI Demo</span><span class="wf-kbd">esc</span></div>
  <div class="pal-g"><span class="lbl">Work</span>
    <div class="pal-i" aria-selected="true"><span class="ico" data-c="amber" style="width:24px;height:24px"><i class="ph ph-git-pull-request"></i></span>PR #3 · Visual refresh finish<span class="tag" data-tone="amber">needs you</span><span class="k">↵ drawer · ⌘↵ GitHub</span></div>
    <div class="pal-i"><span class="ico" data-c="teal" style="width:24px;height:24px"><i class="ph ph-flow-arrow"></i></span>Run #43 · workflow run<span class="k">Workflows</span></div>
    <div class="pal-i"><span class="ico" style="width:24px;height:24px"><i class="ph ph-code"></i></span>Build · Visual refresh finish<span class="k">Code Tasks</span></div></div>
  <div class="pal-g"><span class="lbl">Deploys &amp; agents</span>
    <div class="pal-i"><span class="ico" data-c="green" style="width:24px;height:24px"><i class="ph ph-globe"></i></span>Staging · 2.29.2.202:8004<span class="k">open ↗</span></div>
    <div class="pal-i"><span class="face" data-a="helm" data-size="s"></span>Ask Helm about "pr 3"<span class="k">captain</span></div></div>
  <div class="pal-g" style="border-top:1px solid var(--border)"><span class="lbl">Do</span>
    <div class="pal-i"><span class="ico" style="width:24px;height:24px"><i class="ph ph-plus"></i></span>New work in this project<span class="k">N</span></div>
    <div class="pal-i"><span class="ico" style="width:24px;height:24px"><i class="ph ph-folders"></i></span>Switch project…<span class="k">P</span></div></div>
</div>
</div>
<script src="../shell.js"></script>
</body></html>
