name: boss

x-boss-common: &boss-common
  env_file:
    - ${BOSS_ENV_FILE:-./app.env}
  restart: unless-stopped
  networks:
    - boss

services:
  api:
    <<: *boss-common
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: boss-api:${BOSS_IMAGE_TAG:-goldeneye}
    environment:
      BOSS_ARTIFACTS_DIR: /var/lib/boss/artifacts
      BOSS_CONTROL_PLANE_URL: http://api:8000
      BOSS_REQUIRE_API_AUTH: ${BOSS_REQUIRE_API_AUTH:-true}
      BOSS_BOOTSTRAP_SEED_API_ENABLED: ${BOSS_BOOTSTRAP_SEED_API_ENABLED:-false}
    expose:
      - "8000"
    volumes:
      - boss-artifacts:/var/lib/boss/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.http.routers.boss-api.rule=Host(`${BOSS_API_HOSTNAME:-boss-api.local.sean.network}`)
      - traefik.http.routers.boss-api.entrypoints=websecure
      - traefik.http.routers.boss-api.tls=true
      - traefik.http.services.boss-api.loadbalancer.server.port=8000

  worker:
    <<: *boss-common
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: boss-worker:${BOSS_IMAGE_TAG:-goldeneye}
    environment:
      BOSS_ARTIFACTS_DIR: /var/lib/boss/artifacts
      BOSS_CONTROL_PLANE_URL: http://api:8000
      BOSS_WORKER_ID: ${BOSS_WORKER_ID:-goldeneye-worker-1}
    volumes:
      - boss-artifacts:/var/lib/boss/artifacts
    depends_on:
      api:
        condition: service_healthy

  web:
    <<: *boss-common
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: boss-web:${BOSS_IMAGE_TAG:-goldeneye}
    environment:
      NEXT_PUBLIC_BOSS_API_URL: ${NEXT_PUBLIC_BOSS_API_URL:-https://${BOSS_API_HOSTNAME:-boss-api.local.sean.network}}
      # THE ONE THAT WORKS AT RUNTIME. NEXT_PUBLIC_* is inlined at BUILD time, so setting
      # it here does nothing for an image built without the matching --build-arg. The
      # browser now calls its own origin and app/v1/[...path] proxies to this address,
      # so an unset BOSS_API_URL means every client feed answers 503 — see
      # deploy/goldeneye.compose.yaml, which already sets it.
      BOSS_API_URL: ${BOSS_API_URL:-https://${BOSS_API_HOSTNAME:-boss-api.local.sean.network}}
      NEXT_PUBLIC_BOSS_PROJECT_ID: ${NEXT_PUBLIC_BOSS_PROJECT_ID:-boss-dogfood}
      BOSS_API_KEY: ${BOSS_API_KEY:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.boss-web.rule=Host(`${BOSS_ADMIN_HOSTNAME:-boss.local.sean.network}`)
      - traefik.http.routers.boss-web.entrypoints=websecure
      - traefik.http.routers.boss-web.tls=true
      - traefik.http.services.boss-web.loadbalancer.server.port=3000

  # Optional Cloud side of Easy Connect. Enable with:
  #   docker compose --profile cloud up -d account-connect
  #   docker compose --profile account-connect up -d account-connect
  # Control plane must set BOSS_ACCOUNT_CONNECT_URL / BOSS_ACCOUNT_CONNECT_TOKEN
  # to match AC_PUBLIC_BASE_URL / AC_SERVICE_TOKEN (see apps/account_connect/README.md).
  account-connect:
    <<: *boss-common
    profiles:
      - account-connect
      - cloud
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: account-connect
    image: boss-account-connect:${BOSS_IMAGE_TAG:-goldeneye}
    environment:
      AC_DATABASE_URL: ${AC_DATABASE_URL:-${DATABASE_URL}}
      AC_SERVICE_TOKEN: ${AC_SERVICE_TOKEN:-}
      AC_PUBLIC_BASE_URL: ${AC_PUBLIC_BASE_URL:-http://account-connect:8010}
      AC_DEFAULT_ORG_ID: ${AC_DEFAULT_ORG_ID:-org_boss_cloud}
      AC_DEFAULT_ORG_NAME: ${AC_DEFAULT_ORG_NAME:-BOSS Cloud}
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/v1/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  boss:
    driver: bridge

volumes:
  boss-artifacts:
