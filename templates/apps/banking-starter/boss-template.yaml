schema: boss.template/v1
id: banking-starter
name: Banking starter
version: 1.0.0
summary: Accounts with a ledger-derived balance, deposits, withdrawals and transfers; a secure reference (Argon2id, expiring tokens, ownership checks)
adds: [routes, db_tables, auth]
stacks:
  java: {frameworks: [dropwizard], min_toolchain: jdk21}
requires: []
works_with: []
secrets: []
env:
  - {name: APP_ENV, default: development}
  - {name: BANK_DB_PATH, default: bank.db}
  - {name: BANK_TOKEN_TTL_SECONDS, default: 1800}
egress: []
webhooks: []
routes:
  - POST /api/register
  - POST /api/login
  - POST /api/logout
  - POST /api/password
  - POST /api/accounts
  - GET /api/accounts
  - GET /api/accounts/{id}/balance
  - GET /api/accounts/{id}/entries
  - POST /api/accounts/{id}/deposit
  - POST /api/accounts/{id}/withdraw
  - POST /api/transfers
  - GET /openapi.json
  - GET /health
tests:
  java: {command: mvn -B -ntp verify, report: junit, min_tests: 14}
security_note: SECURITY.md
guide: guide.md
labels: []
kind: idea
license: Apache-2.0
min_boss: 1.0.0
