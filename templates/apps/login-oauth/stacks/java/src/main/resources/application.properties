# login-oauth. Client ids and secrets come from the environment (BOSS's vault), never from here.
server.port=${PORT:3000}
server.servlet.session.cookie.name=sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
# Behind the preview/deploy proxy: believe its X-Forwarded-* (only the proxy can reach the app).
server.forward-headers-strategy=native
spring.main.banner-mode=off
