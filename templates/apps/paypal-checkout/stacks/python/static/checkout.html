<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 40rem; }
    .banner { background: #fff4d6; border: 1px solid #e0b84a; padding: 8px 12px; border-radius: 6px; }
    [role=alert] { color: #a40000; }
  </style>
</head>
<body>
  <!-- Reference UI for `paypal-checkout`: adapt it to the app's design. The page sends only a
       product id and a quantity (or a cart id); the server sets every price and captures. -->
  <p class="banner" id="sandbox-banner" hidden>PayPal sandbox: sign in with a sandbox buyer account. No real money moves.</p>
  <h1>Starter pack</h1>
  <div id="paypal-buttons"></div>
  <p role="alert" id="error"></p>
  <p id="done" hidden>Thank you: your order is confirmed.</p>
  <script>
    const showError = (m) => { document.getElementById("error").textContent = m; };
    fetch("/api/paypal/config").then((r) => r.json()).then((c) => {
      document.getElementById("sandbox-banner").hidden = c.env !== "sandbox";
      const s = document.createElement("script");
      // The JS SDK loads from PayPal in the BROWSER; the client id is public.
      s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(c.client_id)}&currency=${encodeURIComponent(c.currency)}&intent=capture`;
      s.onload = () => {
        window.paypal.Buttons({
          async createOrder() {
            const r = await fetch("/api/paypal/orders", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ items: [{ product_id: "starter-pack", quantity: 1 }] }),
            });
            const body = await r.json();
            if (!r.ok) throw new Error(body.error || "checkout failed");
            return body.paypal_order_id;
          },
          async onApprove(data, actions) {
            const r = await fetch(`/api/paypal/orders/${encodeURIComponent(data.orderID)}/capture`, { method: "POST" });
            const body = await r.json();
            if (r.status === 402 && body.restart) return actions.restart(); // declined: choose another way to pay
            if (!r.ok) return showError(body.error || "payment failed");
            document.getElementById("done").hidden = body.status !== "paid";
          },
          onError(err) { showError(err.message || "payment failed"); },
        }).render("#paypal-buttons");
      };
      document.head.appendChild(s);
    }).catch(() => showError("payments are unavailable"));
  </script>
</body>
</html>
