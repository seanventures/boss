kind: WorkflowSpec
id: governed_coding_pipeline
version: 0.1.0
purpose: >
  The default steps every coding task follows. Plain steps, run by different agents — the agent
  that writes something never judges it. The project standards bind every step, checks fail
  closed (missing evidence = fail), loops are bounded, and how many steps run scales with risk.
governed_by: governed_coding_pipeline_policy_v0
phases:
  - id: standards
    owner_role: cao
    inputs: [Task]
    outputs: [Standards]
    gates:
      - standards_ready          # the project's coding rules, from the repo + org rules
      - risk_tier_assigned

  - id: spec
    owner_role: pm
    inputs: [Task, Standards]
    outputs: [Spec, AcceptanceCriteria, ChangeList]
    gates:
      - acceptance_criteria_present
      - change_list_present       # what is added / changed / removed vs. today

  - id: refine
    owner_role: pm
    skill: coding_pipeline.refine
    inputs: [Spec, Standards]
    outputs: [ClearSpec, OpenQuestions]
    gates:
      - no_vague_requirements      # clear, testable criteria before any code
    run_when: risk_tier >= 1

  - id: plan
    owner_role: cao
    inputs: [ClearSpec]
    outputs: [Plan]
    gates:
      - plan_covers_acceptance_criteria
    run_when: risk_tier >= 1

  - id: review_plan
    owner_role: design_critic        # reviewer is not the planner
    skill: coding_pipeline.review_plan
    inputs: [Plan, AcceptanceCriteria]
    outputs: [PlanReview]
    gates:
      - plan_clean_or_max_loops
    on_failure:
      route_findings_to: plan
    run_when: risk_tier >= 1

  - id: approve_plan
    owner_role: release_manager
    inputs: [Plan, PlanReview]
    outputs: [Decision]
    gates:
      - human_plan_approval          # human sign-off before any code
    run_when: risk_tier >= 2

  - id: tasks
    owner_role: program_manager
    skill: coding_pipeline.tasks
    inputs: [ClearSpec, Plan]
    outputs: [Tasks]
    gates:
      - tasks_have_order_and_focused_context
    run_when: risk_tier >= 1

  - id: write_tests
    owner_role: qa                   # tester is not the coder
    skill: coding_pipeline.write_tests
    inputs: [ClearSpec, AcceptanceCriteria]
    outputs: [TestArtifact]
    gates:
      - tests_written_first
      - tests_match_acceptance_criteria
    run_when: risk_tier >= 1

  - id: implement
    owner_role: software_engineer    # codes against tests it did NOT write
    skill: coding_pipeline.implement
    inputs: [ClearSpec, TestArtifact]
    outputs: [DiffArtifact, TestReport]
    gates:
      - written_tests_pass
      - change_is_small

  - id: review_code
    owner_role: adversarial_reviewer # reviewer is not the coder, fresh context
    skill: coding_pipeline.review_code
    inputs: [DiffArtifact, ClearSpec]
    outputs: [CodeReview]
    gates:
      - code_safe_or_fixed
    on_failure:
      route_findings_to: implement
    run_when: risk_tier >= 2

  - id: security_check
    owner_role: security_reviewer    # separate from the code review
    skill: coding_pipeline.security_check
    inputs: [DiffArtifact]
    outputs: [SecurityReview]
    gates:
      - security_clean_or_fixed
    on_failure:
      route_findings_to: implement
    run_when: risk_tier >= 2

  - id: check_tests
    owner_role: qa
    skill: coding_pipeline.check_tests
    inputs: [DiffArtifact, TestArtifact]
    outputs: [TestStrength]
    gates:
      - tests_strong_enough          # the tests actually catch bugs
    run_when: risk_tier >= 2

  - id: run_all_tests
    owner_role: integration_validator
    skill: coding_pipeline.run_all_tests
    inputs: [DiffArtifact]
    outputs: [FullTestRun]
    gates:
      - whole_suite_passes_nothing_broke
    on_failure:
      route_findings_to: implement
    run_when: risk_tier >= 2

  - id: consistency_check
    owner_role: qa
    skill: coding_pipeline.consistency_check
    inputs: [Standards, Spec, TestArtifact, DiffArtifact]
    outputs: [ConsistencyReport]
    gates:
      - standards_spec_tests_code_agree
    run_when: risk_tier >= 2

  - id: final_gate
    owner_role: deterministic_final_gate
    skill: coding_pipeline.final_gate
    inputs: [TestReport, CodeReview, SecurityReview, TestStrength, FullTestRun, ConsistencyReport]
    outputs: [FinalGate]
    gates:
      - final_gate_passes             # fail closed: missing evidence = fail

  - id: approve
    owner_role: release_manager
    inputs: [FinalGate, DiffArtifact]
    outputs: [Decision]
    gates:
      - decision_card_complete
      - approval_matches_risk_tier    # human sign-off; two approvers at the top tier

completion:
  emits_events: true
  artifacts_required: [Standards, ClearSpec, TestArtifact, DiffArtifact, FinalGate, Decision]
  bounded_execution:
    max_loops_per_step: 3
    on_exhaustion: create_decision
