kind: WorkflowSpec
id: adversarial_verification_execute
version: 0.1.0
name: Adversarial verification execution
description: >
  Challenge one claim with independent evidence, preserve passed, refuted, and
  inconclusive outcomes, settle budget, and escalate any loss of authority.
entry_step: acquire_run_lease
input_schema:
  required: [project_id, verification_run_id, claim_id, claim_version, policy_version, dedupe_key]
output_schema:
  required: [claim_verification_id, outcome, evidence_refs, event_ref]
steps:
  - id: acquire_run_lease
    kind: task
    input: { operation: assurance.verification.acquire_lease_with_heartbeat }
    next: [load_claim_and_evidence]
  - id: load_claim_and_evidence
    kind: task
    input: { operation: assurance.verification.load_exact_claim_and_evidence }
    next: [verifier_independent]
  - id: verifier_independent
    kind: condition
    expression: { path: context.verifier_independent, op: eq, value: true }
    on_true: execute_adversarial_challenge
    on_false: record_inconclusive
  - id: execute_adversarial_challenge
    kind: task
    input: { operation: assurance.verification.execute_reproducible_challenge }
    next: [classify_outcome]
  - id: classify_outcome
    kind: task
    input: { operation: assurance.verification.classify_passed_refuted_or_inconclusive }
    next: [claim_refuted]
  - id: claim_refuted
    kind: condition
    expression: { path: context.verification_outcome, op: eq, value: refuted }
    on_true: revoke_claim_authority
    on_false: record_verification
  - id: revoke_claim_authority
    kind: task
    input: { operation: assurance.claim.revoke_authority_and_open_regression_signal }
    next: [record_verification]
  - id: record_inconclusive
    kind: task
    input: { operation: assurance.verification.record_inconclusive_independence_failure }
    next: [record_verification]
  - id: record_verification
    kind: task
    input: { operation: assurance.verification.persist_idempotently }
    next: [settle_budget]
  - id: settle_budget
    kind: task
    input: { operation: budget.consume_or_release_verification_reservation }
    next: [emit_verification_event]
  - id: emit_verification_event
    kind: task
    input: { operation: audit.emit_adversarial_verification }
rules:
  exact_claim_policy_and_evidence_versions_required: true
  verifier_must_be_independent_under_policy: true
  outcome_enum_is_passed_refuted_or_inconclusive: true
  refuted_claim_loses_authority_before_publication: true
  inconclusive_is_never_coerced_to_passed: true
  spend_is_settled_against_reservation: true
  retry_reuses_dedupe_key_and_existing_receipts: true
completion:
  artifacts_required: [ClaimVerification, Evidence, BudgetReservation, Event]
  failure: retry_deadletter_or_decision
