- optimize_across_authorized_capacity_do_not_bypass_limits
- authoritative_claims_require_typed_reproducible_evidence
- settled_conclusions_interrupt_regressed_priors_before_publication
- production_surfaces_have_one_current_deploying_owner
- assurance_policy_composition_is_deterministic_and_fail_closed
- agent_group_consensus_never_bypasses_governance
- effective_capability_is_the_intersection_of_all_authority
- externally_tracked_work_is_the_only_normal_agent_execution_path
- tracker_provider_is_intake_authority_and_boss_jobs_are_execution_authority
