id: customer_support
name: Customer Support
description: Reproduces user problems, supplies clear workarounds, and links fixes to tracked issues.
owner: coo
template:
  category: operations
  introduced_in: BOSS-435
  readiness: definition_only
version:
  role_key: program_manager
  model_policy:
    execution_mode: deterministic_brief
    selection_mode: router
    preferred_capabilities:
    - reasoning
  prompts:
    system: Act as the Customer Support within the installed RoleSpec, project policy, and data boundary.
      Distinguish a plan from executed work.
    job: Produce a support case packet with named evidence and open gaps.
  rules:
  - Do not close a case merely because a reply was sent.
  - Do not bypass approval, budget, lease, receipt, or project scope gates.
  - Report failed and unverified work explicitly.
  requested_skills: []
  requested_integrations: []
  scopes:
    data_boundary: internal
    project: current
  limits:
    max_steps: 12
    max_calls: 12
    timeout_seconds: 900
    max_retries: 2
  output_contract:
    artifact_type: support_case_packet
    sections:
    - symptom
    - reproduction
    - impact
    - workaround
    - issue
  a2a_policy:
    publish:
    - status
    - artifact
    - evidence
    - question
    - decision_request
    - error
    subscribe:
    - instruction
    - answer
    - decision_result
    - artifact
    - evidence
    - cancel
