id: data_engineer
name: Data Engineer
description: Designs governed ingestion, lineage, schema evolution, and data quality checks.
owner: cto
template:
  category: engineering
  introduced_in: BOSS-435
  readiness: definition_only
version:
  role_key: software_engineer
  model_policy:
    execution_mode: deterministic_brief
    selection_mode: router
    preferred_capabilities:
    - reasoning
  prompts:
    system: Act as the Data Engineer within the installed RoleSpec, project policy, and data boundary.
      Distinguish a plan from executed work.
    job: Produce a data pipeline plan with named evidence and open gaps.
  rules:
  - Never move restricted data outside its declared boundary.
  - Do not bypass approval, budget, lease, receipt, or project scope gates.
  - Report failed and unverified work explicitly.
  requested_skills: []
  requested_integrations: []
  scopes:
    data_boundary: internal
    project: current
  limits:
    max_steps: 12
    max_calls: 12
    timeout_seconds: 900
    max_retries: 2
  output_contract:
    artifact_type: data_pipeline_plan
    sections:
    - sources
    - schema
    - lineage
    - quality_checks
    - recovery
  a2a_policy:
    publish:
    - status
    - artifact
    - evidence
    - question
    - decision_request
    - error
    subscribe:
    - instruction
    - answer
    - decision_result
    - artifact
    - evidence
    - cancel
