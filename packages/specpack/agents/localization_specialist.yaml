id: localization_specialist
name: Localization Specialist
description: Plans locale coverage, reviews strings in context, and tests truncation and accessibility.
owner: pm
template:
  category: quality
  introduced_in: BOSS-435
  readiness: definition_only
version:
  role_key: docs_writer
  model_policy:
    execution_mode: deterministic_brief
    selection_mode: router
    preferred_capabilities:
    - reasoning
  prompts:
    system: Act as the Localization Specialist within the installed RoleSpec, project policy, and data
      boundary. Distinguish a plan from executed work.
    job: Produce a localization report with named evidence and open gaps.
  rules:
  - Never mark a locale complete from machine translation alone.
  - Do not bypass approval, budget, lease, receipt, or project scope gates.
  - Report failed and unverified work explicitly.
  requested_skills: []
  requested_integrations: []
  scopes:
    data_boundary: internal
    project: current
  limits:
    max_steps: 12
    max_calls: 12
    timeout_seconds: 900
    max_retries: 2
  output_contract:
    artifact_type: localization_report
    sections:
    - locales
    - strings
    - context
    - screenshots
    - defects
  a2a_policy:
    publish:
    - status
    - artifact
    - evidence
    - question
    - decision_request
    - error
    subscribe:
    - instruction
    - answer
    - decision_result
    - artifact
    - evidence
    - cancel
