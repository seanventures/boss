id: community_edition
version: 2.0.0
description: >
  Self-hosted Community edition capability pack. Full local BOSS product without
  hosted Account Connect. Includes self-hosted SSO (OIDC/SAML/SCIM). Optional
  Easy Connect (/v1/cloud/*) links to BOSS Cloud.
edition: community
license_candidate: Apache-2.0
legal_review_required: false
hosted_account_connect_required: false
includes:
  - local_auth
  - self_hosted_sso
  - saml_sp
  - scim_provisioning
  - identity_provider_registry
  - single_org_workspace
  - local_control_plane
  - local_runner
  - core_canonical_objects
  - basic_metatron
  - basic_mission_control
  - decision_inbox
  - receipts_dedupe
  - basic_budget_governor
  - basic_software_factory
  - basic_model_entitlement_broker
  - providerops_kernel
  - providerops_readonly_inventory
  - local_model_routing
  - role_skill_pack_formats
  - import_export
  - cloud_easy_connect_opt_in
requires:
  - default_safety
  - budget_governor_policy
  - model_entitlement_policy
  - work_orchestration_policy
installs:
  # The Agent World cast (agent-world spec §0.1) rides with the edition too.
  roles: [metatron, coo, cto, pm, qa, release_manager, chief_architect, engineering_captain,
          backend_engineer, frontend_engineer, operations_engineer, sre, archivist]
  workflows: [ceo_command_to_pr, decision_inbox, budget_gated_job, model_entitlement_routing]
  policies: [default_safety, budget_governor_policy, model_entitlement_policy, work_orchestration_policy]
  # `youtube` and `video` are the media pipeline. In COMMUNITY deliberately: enterprise
  # and cloud both require this pack, so listing them here is what makes publishing
  # available in every edition rather than only the paid ones.
  # `meeting_ops` turns a transcript into tickets through whichever tracker `work_tracker`
  # adapts — same reasoning as the media pair: in COMMUNITY so every edition has it.
  # `email` joined them when its executor was written. The skills and the SMTP adapter had both
  # existed for a long time with nothing binding them, so the bundle sat in no pack and no
  # edition's catalogue offered it — a sending step could be declared in a workflow and never
  # enabled. Sending is still off until BOSS_EMAIL_REAL_SEND_ALLOWED says otherwise; being in
  # the catalogue is not being switched on.
  # `agent_code` is what stops the product needing a release per use case: an agent that holds it
  # can write a program for work no skill covers, and keep it for the next run. In COMMUNITY for
  # the same reason as the media pair — a framework whose extension mechanism is a paid tier is
  # not a framework. Nobody holds it by default: `allowed_callers` is empty, so it is reachable
  # only by being given to an agent on purpose, and it refuses to run at all without a real
  # container boundary.
  # The mobile device skill is on-demand and still requires a leased job plus an explicitly
  # enabled trusted device host. Listing it makes that opt-in capability visible in the catalog.
  # `kit`, `slack` and `deployment` joined with Skills & MCP's Kit (skills-mcp spec E5, E12): an
  # ability on the Kit is only real if every skill it names is in this catalogue AND has an
  # executor — Read the repo (repo.read), Tests & CI (ci.status), Render docs (docs.draft),
  # Team chat (slack.post_real_guarded) and Deploy / Watch health (deployment.*).
  # test_every_kit_skill_has_an_executor enforces both halves.
  # `agent_conversation` and `agent_voice` are the model calls behind an agent's conversation
  # turn and its voice test/draft (conversation_spend, voice_spend): the same durable
  # model-job shape as model_gateway's typed_decision and architecture.draft, and every edition
  # can talk to its agents.
  skills: [model_gateway, github, software_factory, model_providers, work_tracker,
           mattermost, youtube, video, meeting_ops, email, agent_code, mobile,
           kit, slack, deployment, agent_conversation, agent_voice]
status: active  # Independent product; Cloud is opt-in via Easy Connect
