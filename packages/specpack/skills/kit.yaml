# Skills the Kit's abilities need that no other bundle ships (skills-mcp spec E5, E11, E12).
#
# Each has an executor (skill_executors.py) — an ability whose skill cannot run is not an
# ability, and test_every_kit_skill_has_an_executor fails on one.
skills:
  # READ THE REPO, as one grantable skill (E11). A workflow step's agent got no native tools at
  # all, so it could not read the code it was asked to review. Holding this offers it the engine's
  # own read tools — read_code, search_code, list_source, git_history, read_pull_request — scoped
  # to the project's bound repositories, each call going through the skill runtime (permission,
  # budget, invocation record) like any other skill.
  - id: repo.read
    kind: repository
    risk_tier: 0
    mock_mode: false
    load: eager
    description: Read the project's repository — files, search, history and pull requests.
    data_boundary: internal
    input_schema:
      tool: string
      path: string?
      query: string?
      ref: string?
      number: integer?
    output_schema: { result: object }
    cost: { estimator: fixed, category: tool }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      # Nobody by default but the Kit's own Try: the grant (role_skills) is the way in.
      allowed_callers: [kit_try]
      required_permissions: [repo_read]
    policy:
      requires_receipt: false
      tools: [read_code, search_code, list_source, git_history, read_pull_request]

  # BOSS FUNDAMENTALS: every agent holds this (services/agent_baseline.py, BASELINE_SKILLS).
  # BOSS's own read tools, offered by their own names like repo.read's: run logs and activity,
  # diagnosis of a run, infra and health, the schema and a project-fenced row read, what BOSS
  # can do, the pre-check, memory. Reads only; every result redacted before a model sees it.
  - id: boss.fundamentals
    kind: engine_read
    risk_tier: 0
    mock_mode: false
    load: eager
    description: Read BOSS itself — run logs and history, why a run failed, infra and health, the schema and this project's rows, skills and workflows, memory — and file a gap in BOSS itself for BOSS to fix (it only queues for a person).
    data_boundary: internal
    input_schema:
      bundle_tool: string
    output_schema: { result: object }
    cost: { estimator: fixed, category: tool }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      # Nobody by default but the Kit's own Try: the grant (role_skills) is the way in, and
      # sync_role_skills gives it to every agent.
      allowed_callers: [kit_try]
      required_permissions: [system_read]
    policy:
      requires_receipt: false
      tools: [read_logs, get_run_activity, read_preview_log, list_code_tasks, get_code_task,
              describe_workflow_run, diagnose_run, explain_run, read_run_turns, inspect_self,
              install_restarts,
              system_health, diagnose_setup, list_running_work,
              consistency_report, project_status, list_projects, describe_project,
              code_graph_status, index_repository_code, knowledge_project_setup, wait_for,
              list_org_repositories,
              list_deployments, describe_deployment_target,
              list_deployment_hosts, describe_deployment_host, describe_schema,
              query_project_data, list_capabilities, list_skills, list_harnesses,
              describe_workflow, describe_role, list_decisions, precheck_workflow, recall,
              recall_role_experience, file_platform_gap]

  # KNOWLEDGE: every agent holds this (services/agent_baseline.py, BASELINE_SKILLS). The knowledge
  # graph's read tools, offered by their own names: where a symbol is, who calls it, what a change
  # can break, and the PRs, specs, decisions and facts behind it (BOSSAPP-622). What a stage may
  # read of it is that stage's knowledge scope (services/knowledge/scopes.py).
  - id: knowledge.read
    kind: engine_read
    risk_tier: 0
    mock_mode: false
    load: eager
    description: Ask the knowledge graph — where code is defined, who calls it, what a change can break, and why it is the way it is.
    data_boundary: internal
    input_schema:
      bundle_tool: string
    output_schema: { result: object }
    cost: { estimator: fixed, category: tool }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      allowed_callers: [kit_try]
      required_permissions: [repo_read]
    policy:
      requires_receipt: false
      tools: [kg_symbol, kg_callers, kg_blast_radius, kg_why, kg_search, kg_precedent, kg_cypher, kg_schema, kg_rules, kg_neighbors, wiki_read]

  # PROPOSE A FACT: every agent holds this (the baseline). It was granted to six named roles
  # (2026-10-21); every shipped agent has the same base (operator, 2026-10-23). What it writes is
  # always `inferred`: quarantined, scrubbed, forgettable, never above governed facts.
  - id: knowledge.propose
    kind: engine_read
    risk_tier: 0
    mock_mode: false
    load: eager
    description: Propose a fact you learned, or a business rule you found in the code, and record what you learned while working (what you ruled out, a failure and its fix, a workaround, a decision), and propose a change to the project wiki — stored as inferred/proposed until a person approves it.
    data_boundary: internal
    input_schema:
      bundle_tool: string
    output_schema: { result: object }
    cost: { estimator: fixed, category: tool }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      allowed_callers: [kit_try]
      required_permissions: [repo_read]
    policy:
      requires_receipt: false
      tools: [kg_propose_fact, kg_propose_rule, record_learning, wiki_propose]

  # PROPOSE A FIX: every agent holds this too. The agent proposes a BOSS action with exact
  # arguments; a person approves it (a hold-default decision in a run, a button in chat) and it
  # runs under THEIR authority. Proposing runs nothing, so it is tier 0; the decision it raises
  # carries the action's own tier (2, or 3 for anything irreversible).
  - id: boss.propose_fix
    kind: governance
    risk_tier: 0
    mock_mode: false
    load: eager
    description: Propose a BOSS action that fixes what you found — a person approves it before it runs.
    data_boundary: internal
    input_schema:
      tool: string
      args: object?
      label: string
      why: string?
    output_schema: { proposed: boolean, decision_id: string }
    cost: { estimator: fixed, category: tool }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      allowed_callers: [kit_try]
      required_permissions: [decision_read]
    policy:
      requires_receipt: false
      tools: [propose_action]

  # TESTS & CI: the repo's CI results, read-only (GitHub check runs).
  - id: ci.status
    kind: repository
    risk_tier: 0
    mock_mode: false
    load: eager
    description: Read CI results for a branch or commit of the project's repository.
    data_boundary: internal
    input_schema:
      ref: string?
    output_schema: { ref: string, total: integer, failing: array, checks: array }
    cost: { estimator: fixed, category: tool }
    retry: { max_attempts: 2, backoff: exponential }
    permissions:
      allowed_callers: []
      required_permissions: [repo_read]
    policy:
      requires_receipt: false

  # RENDER DOCS: draft a document with the project's model, in a document's shape.
  - id: docs.draft
    kind: model_call
    risk_tier: 0
    mock_mode: false
    load: eager
    description: Draft a document in Markdown from a brief — headings, sections, no preamble.
    data_boundary: internal
    input_schema:
      brief: string
      audience: string?
      length: string?
    output_schema: { markdown: string }
    cost: { estimator: token_usage_estimate, category: model }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      allowed_callers: []
      required_permissions: [model_call]
    policy:
      requires_receipt: false
