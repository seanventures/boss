# Read and propose knowledge inside this project.
#
# knowledge.read is fundamental: every role holds it. knowledge.propose is the
# builder and reviewer grant. Neither skill calls a model. A requested trust
# tier on a proposal is ignored; the stored tier is inferred.
skills:
  - id: knowledge.read
    kind: knowledge
    risk_tier: 0
    mock_mode: false
    system: true
    load: eager
    description: >-
      Search this project's knowledge, look up a symbol, and read why a node
      is the way it is. Writes nothing.
    data_boundary: internal
    input_schema:
      action: string
      query: string?
      name: string?
      node_id: string?
    output_schema:
      hits: array
      found: boolean
    cost: { estimator: fixed, category: knowledge }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      allowed_callers: []
      required_permissions: [knowledge:read]
    policy:
      requires_receipt: false

  - id: knowledge.propose
    kind: knowledge
    risk_tier: 1
    mock_mode: false
    system: true
    load: eager
    description: >-
      Propose one inferred fact. Governed and approved tiers cannot be written
      by this skill.
    data_boundary: internal
    input_schema:
      statement: string
      subject: string
      predicate: string
      object: string
      kind: string?
    output_schema:
      trust_tier: string
      fact_ids: array
    cost: { estimator: fixed, category: knowledge }
    retry: { max_attempts: 1, backoff: none }
    permissions:
      allowed_callers: []
      required_permissions: [knowledge:read]
    policy:
      requires_receipt: false
