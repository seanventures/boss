skills:
  - id: ssh_host.workload.deploy
    kind: deployment
    risk_tier: 3
    mock_mode: false
    description: Deploy a Docker workload (Neo4j, ingestion worker, chatbot) onto a customer-provided host over SSH.
    data_boundary: external
    input_schema:
      host: string
      workload: string
      image: string
      user: string?
      port: integer?
      env: object?
      ports: array?
      volumes: array?
      command: string?
    output_schema:
      container_id: string
      status: string
      receipt_id: string
    cost:
      estimator: fixed
      category: tool
    retry:
      max_attempts: 1
      backoff: none
    permissions:
      allowed_callers: [deployment_manager, release_manager, worker]
      required_permissions: [infra_deploy]
    policy:
      requires_receipt: true
      requires_change_set: true
      requires_budget_reservation: true
      requires_approval: [ceo, cto]
      forbid_raw_provider_secrets_in_agent_context: true
      dedupe_key_template: "ssh_host.deploy:{host}:{workload}:{image}"

  - id: ssh_host.workload.health_check
    kind: deployment
    risk_tier: 1
    mock_mode: false
    description: Check whether a deployed workload container is running on the host.
    data_boundary: external
    input_schema:
      host: string
      workload: string
      user: string?
      port: integer?
    output_schema:
      running: boolean
      status: string
    cost:
      estimator: fixed
      category: tool
    retry:
      max_attempts: 2
      backoff: exponential
    permissions:
      allowed_callers: [deployment_manager, release_manager, worker]
      required_permissions: [infra_read]
    policy:
      requires_receipt: false

  - id: ssh_host.workload.teardown
    kind: deployment
    risk_tier: 3
    mock_mode: false
    description: Remove a deployed workload container from the host.
    data_boundary: external
    input_schema:
      host: string
      workload: string
      user: string?
      port: integer?
    output_schema:
      removed: boolean
      receipt_id: string
    cost:
      estimator: fixed
      category: tool
    retry:
      max_attempts: 1
      backoff: none
    permissions:
      allowed_callers: [deployment_manager, release_manager, resource_janitor]
      required_permissions: [infra_deploy]
    policy:
      requires_receipt: true
      requires_change_set: true
      requires_approval: [ceo, cto]
      dedupe_key_template: "ssh_host.teardown:{host}:{workload}"
