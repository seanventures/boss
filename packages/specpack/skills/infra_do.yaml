skills:
  - id: infra.do.create_droplet_real
    kind: infra
    risk_tier: 3
    mock_mode: false
    description: Provision a real DigitalOcean droplet only after budget, TTL, and approval checks pass.
    data_boundary: confidential
    input_schema:
      size: string
      region: string
      ttl_minutes: integer
      tags: array
    output_schema:
      droplet_id: string
      commitment_id: string
      receipt_id: string
    cost:
      estimator: hourly_commitment
      category: infra
    retry:
      max_attempts: 1
      backoff: none
    permissions:
      allowed_callers: [infra_worker, release_manager]
      required_permissions: [infra_provision]
    policy:
      requires_budget_reservation: true
      requires_receipt: true
      requires_ttl: true
      real_provisioning_allowed: true
      requires_approval: [ceo, cto]
