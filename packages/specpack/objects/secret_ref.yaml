kind: ObjectSpec
id: SecretRef
version: 0.1.0
description: Pointer to provider secret material stored outside prompts and artifacts.
fields:
  - name: id
    type: string
  - name: scope_type
    type: enum
    values: [org, workspace, project, local_runner]
  - name: scope_id
    type: string
  - name: provider
    type: string
  - name: secret_kind
    type: string
  - name: storage_backend
    type: enum
    values: [environment, vault, local_runner, platform_secret_store]
  - name: storage_ref
    type: string
  - name: rotation_due_at
    type: datetime
  - name: last_verified_at
    type: datetime
  - name: status
    type: enum
    values: [active, rotation_due, disabled, missing, invalid]
rules:
  raw_secret_value_forbidden: true
