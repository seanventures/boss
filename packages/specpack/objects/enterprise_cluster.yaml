kind: ObjectSpec
id: EnterpriseCluster
version: 0.1.0
description: Enterprise deployment, clustering, HA, and private worker boundary.
fields:
  - name: id
    type: string
  - name: org_id
    type: string
  - name: project_id
    type: string
  - name: deployment_mode
    type: enum
    values: [enterprise_cloud, self_hosted, private_cloud, air_gapped]
  - name: account_connect_mode
    type: enum
    values: [attached, detached]
  - name: worker_pool_strategy
    type: string
  - name: ha_profile
    type: string
  - name: data_residency
    type: string
  - name: identity_controls
    type: object
  - name: governance_controls
    type: object
  - name: audit_controls
    type: object
  - name: private_worker_pools
    type: array
  - name: compliance_packs
    type: array
  - name: support_tier
    type: string
  - name: support_sla
    type: object
  - name: status
    type: enum
    values: [planned, active, blocked, disabled]
  - name: blocking_gaps
    type: array
  - name: metadata
    type: object
rules:
  private_workers_preserve_secret_boundaries: true
  budget_governor_still_applies: true
  agents_receive_raw_provider_secrets: false
  incomplete_controls_surface_blocking_gaps: true
