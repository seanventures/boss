kind: ObjectSchema
object: RoleSpec
version: 0.1.0
fields:
  role_id: string
  display_name: string
  # WHICH TEAM THE AGENT SITS IN on Agents › Live and Organization, and the row group of the
  # Skills "Who can" matrix. Optional. One of the shipped keys below, or free text for a team
  # the operator made; absent means `yours`. Read only through agent_identity.team_of.
  # leadership | architecture | engineering | quality | operations | cost | media | thinkers
  team: { type: string, optional: true }
  mission: string
  primary_outcomes: { array: string }
  boundaries:
    type: object
    fields:
      must: { array: string }
      must_not: { array: string }
  decision_rights:
    type: object
    fields:
      can_decide: { array: string }
      must_escalate: { array: string }
  cadence: object
  permissions:
    type: object
    fields:
      allowed_skills: { array: string }
      forbidden_skills: { array: string }
      # The MCP servers the agent holds (role_mcp_servers), by server NAME, optionally limited
      # to some tools (empty = every tool). Granted by the seed like allowed_skills; a grant an
      # operator takes away stays away (seed_exclusions).
      mcp_servers: { array: object, optional: true, item_fields: { server: string, tools: { array: string } } }
      # The Kit's abilities (packages/specpack/kits/*.yaml), by key: `abilities` are granted on
      # install (expanded into skills and MCP grants by services/kit.py), `recommended_abilities`
      # are offered in Skills & MCP as Recommended and granted only when a person applies them.
      abilities: { array: string, optional: true }
      recommended_abilities: { array: string, optional: true }
  comms_contract: object
  output_contracts: { array: string }
  eval_rubric: object
  autonomy:
    type: object
    fields:
      level: integer
      upgrade_requires: { array: string }
      downgrade_triggers: { array: string }
  # WHO THE AGENT IS, separate from what it may do (agent-world spec §4.2). Optional. Compiled
  # into every prompt the agent gets (services/agent_persona.py), and it shapes HOW the agent
  # speaks, never WHAT it may do: a persona mentioning a tool or skill, or saying "you may",
  # "allowed to", "ignore previous" or "system prompt", is refused (422).
  persona:
    type: object
    optional: true
    fields:
      version: integer                # 1
      archetype: string               # first_principles_researcher | visionary_founder | relentless_operator | teacher_who_simplifies | null
      callsign: string                # <=16; an invented word, never a real person's name
      tagline: string                 # <=60
      about_me: string                # <=280, first person
      voice:                          # each 0-4
        type: object
        fields: { blunt: integer, thorough: integer, bold: integer, casual: integer }
      phrases: { array: string }      # <=3
      never: { array: string }        # <=5, appended to boundaries.must_not
      avatar:
        type: object
        fields: { kit: string, seed: string, hat: string, emblem: string, palette: string, visor: string }
