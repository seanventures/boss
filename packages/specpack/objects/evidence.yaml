kind: ObjectSpec
id: Evidence
version: 0.1.0
description: >
  Immutable or content-addressed proof artifact with enough provenance and
  reproduction context to challenge or support a claim.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - name: evidence_kind
    type: enum
    values: [test_run, metric_query, isolation_experiment, artifact, receipt, observation, external_attestation]
    required: true
  - { name: content_hash, type: string, required: true }
  - { name: uri, type: string, required: false }
  - { name: producer_ref, type: string, required: true }
  - { name: provenance, type: object, required: true }
  - { name: reproduction_instructions, type: object, required: true }
  - { name: metric_query, type: object, required: false }
  - { name: input_hash, type: string, required: false }
  - { name: output_hash, type: string, required: false }
  - { name: receipt_refs, type: array, required: true }
  - { name: observed_at, type: datetime, required: true }
  - { name: captured_at, type: datetime, required: true }
  - { name: valid_until, type: datetime, required: false }
  - { name: invalidated_at, type: datetime, required: false }
  - { name: invalidation_reason, type: string, required: false }
  - name: sensitivity
    type: enum
    values: [public, internal, confidential, restricted]
    required: true
  - { name: immutable, type: boolean, required: true }
rules:
  raw_secrets_never_embedded: true
  content_hash_required_for_authoritative_use: true
  expired_or_invalidated_evidence_cannot_satisfy_gate: true
  provenance_and_reproduction_are_required: true
constraints:
  unique:
    - [project_id, content_hash]
