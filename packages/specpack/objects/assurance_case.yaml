kind: ObjectSpec
id: AssuranceCase
version: 0.1.0
description: >
  Durable relationship graph explaining why BOSS accepted, blocked, reopened,
  or refuted a subject-level claim.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: subject_ref, type: string, required: true }
  - { name: subject_type, type: string, required: true }
  - name: status
    type: enum
    values: [draft, open, blocked, accepted, refuted, reopened, closed]
    required: true
  - { name: policy_snapshot_ref, type: string, required: true }
  - { name: observation_refs, type: array, required: true }
  - { name: regression_signal_refs, type: array, required: true }
  - { name: settled_conclusion_refs, type: array, required: true }
  - { name: claim_refs, type: array, required: true }
  - { name: evidence_refs, type: array, required: true }
  - { name: surface_ownership_refs, type: array, required: true }
  - { name: verification_run_refs, type: array, required: true }
  - { name: decision_refs, type: array, required: true }
  - { name: override_refs, type: array, required: true }
  - { name: agent_group_run_refs, type: array, required: true }
  - { name: workflow_run_refs, type: array, required: true }
  - { name: skill_invocation_refs, type: array, required: true }
  - { name: integration_connection_refs, type: array, required: true }
  - { name: disposition_reason, type: string, required: false }
  - { name: graph_version, type: integer, required: true }
  - { name: dedupe_key, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
  - { name: updated_at, type: datetime, required: true }
rules:
  references_are_versioned_not_copied_prose: true
  status_is_derived_from_snapshot_and_linked_results: true
  conflicting_mandatory_rules_fail_closed_to_decision: true
  cross_tenant_references_are_forbidden: true
  concurrent_update_requires_expected_graph_version: true
constraints:
  unique:
    - [project_id, dedupe_key]
