kind: ObjectSpec
id: AgentGroupSpec
version: 0.1.0
description: >
  Reusable, governed definition of who collaborates, how they interact, and
  what deterministically completes or escalates the group.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: group_key, type: string, required: true }
  - { name: purpose, type: string, required: true }
  - { name: member_role_specs, type: array, required: true }
  - name: topology
    type: enum
    values: [panel, producer_reviewer, bounded_debate, swarm_fan_out, sequential_handoff]
    required: true
  - { name: collaboration_protocol, type: object, required: true }
  - { name: allowed_capabilities, type: array, required: true }
  - { name: context_sharing_policy, type: object, required: true }
  - { name: independence_requirements, type: object, required: true }
  - { name: budget_limit_micros, type: integer, required: true }
  - { name: call_limit, type: integer, required: true }
  - { name: timeout_seconds, type: integer, required: true }
  - { name: completion_rule, type: object, required: true }
  - { name: escalation_target, type: string, required: true }
  - { name: version, type: integer, required: true }
  - { name: spec_hash, type: string, required: true }
  - name: status
    type: enum
    values: [draft, active, retired]
    required: true
  - { name: created_by, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
rules:
  consensus_cannot_bypass_policy_or_evidence_gate: true
  capabilities_are_resolved_not_raw_executor_access: true
  bounded_debate_reuses_existing_protocol: true
  completion_and_escalation_are_deterministic: true
constraints:
  unique:
    - [project_id, group_key, version]
