kind: ObjectSpec
id: Claim
version: 0.1.0
description: >
  Typed assertion whose authoritative state is controlled by an explicit
  evidence contract and verification result.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: assurance_case_id, type: string, required: false }
  - { name: subject_ref, type: string, required: true }
  - name: claim_type
    type: enum
    values: [healthy, solved, fixed, regressed, caused_by, compliant, custom]
    required: true
  - { name: statement, type: string, required: true }
  - name: state
    type: enum
    values: [proposed, blocked, inconclusive, authoritative, refuted, invalidated]
    required: true
  - { name: evidence_contract_ref, type: string, required: true }
  - { name: evidence_refs, type: array, required: true }
  - { name: prior_baseline_ref, type: string, required: false }
  - { name: claimed_variable, type: string, required: false }
  - { name: producer_ref, type: string, required: true }
  - { name: provenance, type: object, required: true }
  - { name: version, type: integer, required: true }
  - { name: authority_version, type: integer, required: false }
  - { name: dedupe_key, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
  - { name: updated_at, type: datetime, required: true }
rules:
  authoritative_requires_passing_claim_verification: true
  fixed_or_solved_requires_red_to_green: true
  caused_by_requires_isolation_or_remains_inconclusive: true
  regressed_requires_comparable_prior_pass_and_current_failure: true
  terminal_or_public_status_cannot_bypass_gate: true
constraints:
  unique:
    - [project_id, dedupe_key]
