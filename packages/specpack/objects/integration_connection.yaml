kind: ObjectSpec
id: IntegrationConnection
version: 0.1.0
description: >
  Tenant- or project-scoped installation of an IntegrationDefinition using
  SecretRefs and explicit grants.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: false }
  - { name: integration_definition_id, type: string, required: true }
  - { name: integration_definition_version, type: integer, required: true }
  - { name: owner_ref, type: string, required: true }
  - { name: secret_refs, type: array, required: true }
  - { name: granted_capabilities, type: array, required: true }
  - { name: configuration_hash, type: string, required: true }
  - name: health_status
    type: enum
    values: [unknown, healthy, degraded, stale, unavailable, unauthorized]
    required: true
  - { name: health_checked_at, type: datetime, required: false }
  - { name: health_fresh_until, type: datetime, required: false }
  - { name: rate_limits, type: object, required: true }
  - { name: provenance, type: object, required: true }
  - { name: enabled, type: boolean, required: true }
  - { name: revoked_at, type: datetime, required: false }
  - { name: revocation_reason, type: string, required: false }
  - { name: version, type: integer, required: true }
  - { name: created_at, type: datetime, required: true }
  - { name: updated_at, type: datetime, required: true }
rules:
  raw_credentials_never_enter_agent_context: true
  secret_refs_are_metadata_only: true
  unhealthy_stale_disabled_or_revoked_connection_fails_closed: true
  permission_change_creates_new_version_and_event: true
constraints:
  unique:
    - [org_id, workspace_id, project_id, id, version]
