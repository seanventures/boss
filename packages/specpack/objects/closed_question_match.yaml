kind: ObjectSpec
id: ClosedQuestionMatch
version: 0.1.0
description: >
  Auditable result of scanning a plan, proposal, or output for a regressed prior
  governed by a settled conclusion.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: settled_conclusion_id, type: string, required: true }
  - { name: settled_conclusion_version, type: integer, required: true }
  - { name: session_ref, type: string, required: true }
  - { name: run_ref, type: string, required: false }
  - name: publication_boundary
    type: enum
    values: [plan, tool_proposal, output, external_dispatch]
    required: true
  - { name: content_hash, type: string, required: true }
  - { name: matched_pattern, type: string, required: true }
  - name: match_kind
    type: enum
    values: [exact, normalized, semantic]
    required: true
  - name: context_class
    type: enum
    values: [direct_recommendation, quotation, historical, negated, hypothetical]
    required: true
  - name: outcome
    type: enum
    values: [blocked, allowed_nonrecommendation, overridden, reopened]
    required: true
  - { name: stop_payload, type: object, required: false }
  - { name: cause_menu, type: array, required: true }
  - { name: evidence_refs, type: array, required: true }
  - { name: override_decision_id, type: string, required: false }
  - { name: audit_event_ref, type: string, required: true }
  - { name: dedupe_key, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
rules:
  direct_recommendation_match_blocks_before_publication: true
  quotation_history_negation_and_hypothetical_are_classified: true
  block_returns_conclusion_cause_menu_and_evidence: true
  override_or_reopen_requires_decision: true
constraints:
  unique:
    - [project_id, dedupe_key]
