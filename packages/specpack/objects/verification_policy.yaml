kind: ObjectSpec
id: VerificationPolicy
version: 0.1.0
description: >
  Versioned policy selecting which critical claims and subjects receive
  automatic adversarial verification and how those runs are governed.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: subject_selectors, type: array, required: true }
  - { name: claim_types, type: array, required: true }
  - { name: risk_tiers, type: array, required: true }
  - { name: cadence_seconds, type: integer, required: true }
  - { name: sample_rate, type: number, required: true }
  - name: verification_method
    type: enum
    values: [metric_recheck, deterministic_test, isolation_experiment, vag_refute, agent_group_review]
    required: true
  - { name: evidence_contract_ref, type: string, required: true }
  - { name: escalation_target, type: string, required: true }
  - { name: require_independent_verifier, type: boolean, required: true }
  - { name: independence_policy, type: object, required: true }
  - { name: budget_policy_ref, type: string, required: true }
  - { name: retry_policy, type: object, required: true }
  - { name: version, type: integer, required: true }
  - name: status
    type: enum
    values: [draft, active, suspended, retired]
    required: true
  - { name: effective_at, type: datetime, required: true }
  - { name: created_by, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
rules:
  sample_rate_between_zero_and_one: true
  critical_policy_cannot_select_producer_as_verifier: true
  scheduled_spend_requires_budget_policy: true
  lower_scope_cannot_disable_mandatory_verification: true
constraints:
  unique:
    - [project_id, id, version]
