kind: ObjectSpec
id: SettledConclusion
version: 0.1.0
description: >
  Versioned ledger entry for a scoped question whose current conclusion is
  mechanically enforced at publication and effect boundaries.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: conclusion_key, type: string, required: true }
  - { name: scope, type: object, required: true }
  - { name: conclusion, type: string, required: true }
  - { name: owner_ref, type: string, required: true }
  - { name: tell_patterns, type: array, required: true }
  - { name: cause_menu, type: array, required: true }
  - { name: evidence_refs, type: array, required: true }
  - { name: reopen_conditions, type: array, required: true }
  - { name: version, type: integer, required: true }
  - name: status
    type: enum
    values: [current, superseded, expired, reopened]
    required: true
  - { name: effective_at, type: datetime, required: true }
  - { name: review_at, type: datetime, required: true }
  - { name: expires_at, type: datetime, required: false }
  - { name: supersedes_id, type: string, required: false }
  - { name: policy_snapshot_ref, type: string, required: true }
  - { name: created_by, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
rules:
  only_current_unexpired_version_blocks: true
  conclusion_requires_evidence_and_cause_menu: true
  update_creates_new_version: true
  reopen_requires_permission_reason_evidence_and_decision: true
constraints:
  unique:
    - [project_id, conclusion_key, version]
