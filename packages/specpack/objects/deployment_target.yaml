kind: ObjectSpec
id: DeploymentTarget
version: 0.1.0
description: Application environment target governed by ProviderOps.
fields:
  - name: id
    type: string
  - name: app_id
    type: string
  - name: repo
    type: string
  - name: environment
    type: enum
    values: [local, preview, staging, production]
  - name: provider_account_ids
    type: array
  - name: required_resource_ids
    type: array
  - name: domains
    type: array
  - name: secret_refs
    type: array
  - name: health_checks
    type: array
  - name: rollback_points
    type: array
  - name: state
    type: enum
    values: [created, building, deploying, deployed, healthy, unhealthy, rollback_pending, rolling_back, rolled_back, failed]
state_machine:
  created: [building, deploying, failed]
  building: [deploying, failed]
  deploying: [deployed, failed]
  deployed: [healthy, unhealthy, rollback_pending]
  healthy: [deploying, rollback_pending, unhealthy]
  unhealthy: [rollback_pending, deploying, failed]
  rollback_pending: [rolling_back, failed]
  rolling_back: [rolled_back, failed]
  rolled_back: [deploying]
  failed: [building, deploying, rollback_pending]
