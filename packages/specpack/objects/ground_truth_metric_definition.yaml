kind: ObjectSpec
id: GroundTruthMetricDefinition
version: 0.1.0
description: >
  Versioned, tenant-scoped definition of a measurement that represents external
  ground truth for a producer, collector, service, or production surface.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: producer_ref, type: string, required: true }
  - { name: name, type: string, required: true }
  - name: metric_kind
    type: enum
    values: [coverage, freshness, correctness, completeness, availability, custom]
    required: true
  - { name: unit, type: string, required: true }
  - { name: baseline_value, type: number, required: true }
  - name: threshold_operator
    type: enum
    values: [lt, lte, gt, gte, outside_band]
    required: true
  - { name: threshold_value, type: object, required: true }
  - { name: breach_after_consecutive, type: integer, required: true }
  - { name: evaluation_cadence_seconds, type: integer, required: true }
  - { name: owner_ref, type: string, required: true }
  - { name: evidence_query, type: object, required: true }
  - { name: version, type: integer, required: true }
  - { name: effective_at, type: datetime, required: true }
  - { name: review_at, type: datetime, required: false }
  - { name: enabled, type: boolean, required: true }
  - { name: created_by, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
rules:
  observations_bind_exact_metric_version: true
  baseline_change_requires_permission_reason_and_event: true
  degraded_observations_cannot_rewrite_baseline: true
  cadence_and_threshold_must_be_positive: true
constraints:
  unique:
    - [project_id, id, version]
