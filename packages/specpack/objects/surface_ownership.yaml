kind: ObjectSpec
id: SurfaceOwnership
version: 0.1.0
description: >
  Versioned single-deployer authority for a tenant-scoped production surface
  and environment.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: surface_key, type: string, required: true }
  - name: surface_kind
    type: enum
    values: [collector, deployment, site, service, mcu, account, dns_zone, data_pipeline, custom]
    required: true
  - { name: environment, type: string, required: true }
  - { name: owner_actor_ref, type: string, required: false }
  - { name: owner_session_ref, type: string, required: false }
  - { name: coordination_route, type: object, required: true }
  - { name: ownership_version, type: integer, required: true }
  - name: status
    type: enum
    values: [unowned, owned, transfer_pending, expired, suspended]
    required: true
  - { name: acquired_at, type: datetime, required: false }
  - { name: expires_at, type: datetime, required: false }
  - { name: last_verified_at, type: datetime, required: true }
  - { name: last_event_ref, type: string, required: true }
rules:
  exactly_one_active_owner_per_surface_environment: true
  provider_boundary_revalidates_ownership_version: true
  registry_unavailable_fails_closed: true
  non_owner_receives_owner_and_coordination_route: true
constraints:
  unique:
    - [project_id, surface_key, environment]
