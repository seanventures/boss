kind: ObjectSpec
id: AccountConnectOrg
version: 0.1.0
description: Hosted BOSS Account Connect organization identity for Cloud and attached Enterprise.
fields:
  - name: id
    type: string
  - name: hosted_org_id
    type: string
  - name: local_org_id
    type: string
  - name: connection_mode
    type: enum
    values: [cloud_required, attached, detached, disabled]
  - name: marketplace_identity
    type: object
  - name: billing_portal_ref
    type: string
  - name: connector_authorization_refs
    type: array
  - name: optional_telemetry_enabled
    type: boolean
  - name: connection_ref
    type: string
  - name: status
    type: enum
    values: [linked, unlinked, disabled]
  - name: metadata
    type: object
rules:
  community_may_disable: true
  cloud_requires_account_connect: true
  enterprise_can_run_detached: true
  hosted_entitlement_sync_requires_configured_endpoint: true
  missing_hosted_endpoint_fails_closed_with_event: true
