kind: ObjectSpec
id: CapabilityResolution
version: 0.1.0
description: >
  Auditable snapshot of the deterministic capability intersection applied
  before an agent, group, or workflow can invoke an integration.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: request_ref, type: string, required: true }
  - { name: role_spec_ref, type: string, required: false }
  - { name: agent_group_spec_ref, type: string, required: false }
  - { name: workflow_step_ref, type: string, required: false }
  - { name: requested_skill_spec_ref, type: string, required: true }
  - { name: integration_connection_ref, type: string, required: true }
  - { name: executor_binding_ref, type: string, required: true }
  - { name: requested_capabilities, type: array, required: true }
  - { name: effective_capabilities, type: array, required: true }
  - { name: scope_grants_snapshot, type: object, required: true }
  - { name: connection_health_snapshot, type: object, required: true }
  - { name: policy_snapshot, type: object, required: true }
  - { name: risk_check, type: object, required: true }
  - { name: data_boundary_check, type: object, required: true }
  - name: result
    type: enum
    values: [allowed, denied]
    required: true
  - { name: denial_reasons, type: array, required: true }
  - { name: resolution_hash, type: string, required: true }
  - { name: dedupe_key, type: string, required: true }
  - { name: resolved_at, type: datetime, required: true }
rules:
  effective_is_intersection_not_union: true
  revoked_or_stale_connection_denies: true
  no_role_group_or_workflow_can_expand_connection_grants: true
  resolution_is_rechecked_before_external_effect: true
constraints:
  unique:
    - [project_id, dedupe_key]
