kind: ObjectSpec
id: RegressionSignal
version: 0.1.0
description: >
  Deduplicated, actionable record of a ground-truth threshold breach and its
  recovery lifecycle.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: metric_definition_id, type: string, required: true }
  - { name: metric_definition_version, type: integer, required: true }
  - { name: owner_ref, type: string, required: true }
  - name: status
    type: enum
    values: [open, acknowledged, recovered, invalidated]
    required: true
  - { name: first_breach_observation_id, type: string, required: true }
  - { name: latest_observation_id, type: string, required: true }
  - { name: last_good_observation_id, type: string, required: false }
  - { name: current_value, type: number, required: false }
  - { name: baseline_value, type: number, required: true }
  - { name: trend, type: object, required: true }
  - { name: breach_started_at, type: datetime, required: true }
  - { name: breach_duration_seconds, type: integer, required: true }
  - { name: recovered_at, type: datetime, required: false }
  - { name: incident_ref, type: string, required: false }
  - { name: decision_id, type: string, required: false }
  - { name: event_ref, type: string, required: true }
  - { name: evidence_refs, type: array, required: true }
  - { name: dedupe_key, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
  - { name: updated_at, type: datetime, required: true }
rules:
  one_open_signal_per_metric_version_and_breach_window: true
  breach_creates_actionable_incident_or_decision: true
  recovery_requires_passing_observation: true
  missed_evaluator_is_not_healthy: true
constraints:
  unique:
    - [project_id, dedupe_key]
