kind: ObjectSpec
id: OwnershipTransition
version: 0.1.0
description: >
  Permissioned compare-and-swap transition for production surface ownership.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: surface_ownership_id, type: string, required: true }
  - name: action
    type: enum
    values: [acquire, transfer, relinquish, expire, emergency_takeover]
    required: true
  - { name: expected_version, type: integer, required: true }
  - { name: resulting_version, type: integer, required: false }
  - { name: from_owner_ref, type: string, required: false }
  - { name: to_owner_ref, type: string, required: false }
  - { name: requested_by, type: string, required: true }
  - { name: reason, type: string, required: true }
  - { name: approval_decision_id, type: string, required: false }
  - { name: rollback_plan, type: object, required: false }
  - name: status
    type: enum
    values: [requested, approved, applied, rejected, stale_version]
    required: true
  - { name: event_ref, type: string, required: true }
  - { name: dedupe_key, type: string, required: true }
  - { name: requested_at, type: datetime, required: true }
  - { name: applied_at, type: datetime, required: false }
rules:
  transition_is_atomic_compare_and_swap: true
  stale_version_is_rejected: true
  transfer_and_emergency_takeover_require_approval: true
  every_transition_emits_audit_event: true
constraints:
  unique:
    - [project_id, dedupe_key]
