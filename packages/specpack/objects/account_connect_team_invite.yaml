kind: ObjectSpec
id: AccountConnectTeamInvite
version: 0.1.0
description: Auditable Account Connect team invitation request with hosted-delivery status and receipt linkage.
fields:
  - name: id
    type: string
  - name: project_id
    type: string
  - name: account_connect_org_id
    type: string
  - name: hosted_org_id
    type: string
  - name: email
    type: string
  - name: display_name
    type: string
  - name: role_keys
    type: array
  - name: permissions
    type: array
  - name: invite_url
    type: string
  - name: hosted_invite_ref
    type: string
  - name: status
    type: enum
    values:
      - pending_acceptance
      - blocked_configuration
      - failed
      - revoked
      - revoke_blocked_configuration
      - revoke_failed
  - name: delivery_status
    type: enum
    values: [pending, sent, blocked, failed, revoked]
  - name: receipt_id
    type: string
  - name: metadata
    type: object
rules:
  hosted_delivery_requires_account_connect_link: true
  hosted_delivery_requires_receipt: true
  missing_hosted_endpoint_creates_blocked_record: true
  no_email_delivery_without_comms_policy: true
