kind: ObjectSpec
id: GroundTruthObservation
version: 0.1.0
description: >
  Durable result of one leased, reproducible evaluation of a ground-truth
  metric definition.
fields:
  - { name: id, type: string, required: true }
  - { name: org_id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: project_id, type: string, required: true }
  - { name: metric_definition_id, type: string, required: true }
  - { name: metric_definition_version, type: integer, required: true }
  - { name: observed_value, type: number, required: false }
  - name: status
    type: enum
    values: [pass, breach, evaluator_error, missed_heartbeat]
    required: true
  - { name: baseline_snapshot, type: object, required: true }
  - { name: threshold_snapshot, type: object, required: true }
  - { name: evidence_ref, type: string, required: false }
  - { name: evaluator_job_id, type: string, required: true }
  - { name: lease_owner, type: string, required: true }
  - { name: lease_expires_at, type: datetime, required: true }
  - { name: heartbeat_at, type: datetime, required: true }
  - { name: scheduled_at, type: datetime, required: true }
  - { name: evaluated_at, type: datetime, required: true }
  - { name: error_ref, type: string, required: false }
  - { name: dedupe_key, type: string, required: true }
  - { name: created_at, type: datetime, required: true }
rules:
  pass_or_breach_requires_value_and_evidence: true
  evaluator_failure_is_visible: true
  lease_and_heartbeat_required: true
  replay_returns_existing_observation: true
constraints:
  unique:
    - [project_id, dedupe_key]
