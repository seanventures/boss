kind: ObjectSpec
id: EnterpriseSupportCase
version: 0.1.0
description: Enterprise support and SLA case with optional receipt-backed hosted escalation.
fields:
  - name: id
    type: string
  - name: org_id
    type: string
  - name: project_id
    type: string
  - name: enterprise_cluster_id
    type: string
  - name: account_connect_org_id
    type: string
  - name: hosted_org_id
    type: string
  - name: title
    type: string
  - name: severity
    type: enum
    values: [critical, high, normal, low]
  - name: category
    type: string
  - name: description
    type: string
  - name: status
    type: enum
    values: [open, hosted_submitted, in_progress, blocked_configuration, failed, resolved, closed]
  - name: sla_due_at
    type: datetime
  - name: response_time_hours
    type: integer
  - name: hosted_case_ref
    type: string
  - name: receipt_id
    type: string
  - name: support_packet_artifact_id
    type: string
  - name: assigned_to
    type: string
  - name: metadata
    type: object
rules:
  local_case_tracking_works_without_account_connect: true
  hosted_escalation_requires_account_connect_link: true
  hosted_escalation_requires_receipt: true
  support_packet_artifact_required: true
  missing_hosted_endpoint_creates_blocked_case: true
  lifecycle_updates_emit_events: true
