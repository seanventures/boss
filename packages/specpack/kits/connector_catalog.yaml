      env_allowlist: []
      idle_ttl_seconds: 600
      reuse_key: template
    auth: {kind: none}
    risk: {default_tier: 1, data_boundary: internal, tool_tiers: {"read_*": 0, "list_*": 0, "search_*": 0, "get_*": 0, "directory_tree": 0, "write_file": 2, "edit_file": 2, "move_file": 2, "create_directory": 1}}
    setup: An Owner or Admin creates the stdio template once. It sees only its own container; no host folder is mounted.
    risk_notes: Nothing outside the container is reachable; files go when the instance is reaped.
    docs_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem"
