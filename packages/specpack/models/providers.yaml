routing_policy:
  data_boundaries:
    external_official_source_default: [public, internal, confidential]
    approved_local_model_default: [public, internal, confidential, restricted, local-only]
    enterprise_model_gateway_default: [public, internal, confidential, restricted]
    managed_cloud_model_gateway_default: [public, internal, confidential]
    restricted_requires_explicit_source_approval: true
    local_only_requires_approved_local_model: true
  workload_class_defaults:
    owner_sandbox:
      preferred_source_kinds: [official_cli, official_coding_agent, official_api, enterprise_model_gateway, managed_cloud_model_gateway, approved_local_model]
    single_tenant_customer:
      preferred_source_kinds: [official_api, enterprise_model_gateway, managed_cloud_model_gateway, approved_local_model, official_cli]
    multi_tenant_customer:
      preferred_source_kinds: [enterprise_model_gateway, managed_cloud_model_gateway, official_api]
    internal_batch:
      preferred_source_kinds: [approved_local_model, enterprise_model_gateway, managed_cloud_model_gateway, official_api]
  budget_states:
    green: { allowed_tiers: [cheap, mid] }
    yellow: { allowed_tiers: [cheap] }
    orange: { allowed_tiers: [cheap], defer_non_p0: true }
    red: { allowed_tiers: [], defer_non_p0: true }
  disallowed_combinations:
    - source_kind: official_cli
      workload_class: multi_tenant_customer
    - source_kind: official_coding_agent
      workload_class: multi_tenant_customer
  logging_required: true
  fallback_tests_required: true
  provider_rule_compliance_required: true
