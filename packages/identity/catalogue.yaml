# THE BOSS IDENTITY CATALOGUE: the one source of truth for every permission and built-in access role.
#
# Spec: docs/product/IDENTITY.md §6.2. Frozen in Phase 0 (docs/product/IDENTITY_BUILD.md): a change
# to this file is a code change, reviewed as one, and its regenerated outputs are committed with it.
#
# Regenerate after any edit:
#     python -m boss_engine.identity.codegen          (from the repo root, PYTHONPATH=engine)
# It writes, and engine/tests/test_identity_catalogue_is_generated.py fails when any is stale:
#     engine/boss_engine/identity/permissions_gen.py   Permission StrEnum + metadata + role sets
#     apps/web/lib/identity/permissions.gen.ts         the TypeScript literal union (no `${string}`)
#     db/identity_seed.sql                             identity_permissions + built-in access roles
#     docs/product/IDENTITY_CATALOGUE.md               the published role x permission table
#
# Rules (enforced by the generator; it refuses to write on any violation):
#   - key is `resource:action`, ^[a-z][a-z_]*:[a-z][a-z_]*$, unique. No wildcards anywhere.
#   - `roles` is the ONLY place built-in role membership is defined.
#   - flags are a closed set; a flag absent is false:
#       step_up      the session must have passed MFA in the last 10 minutes (spec §4.6)
#       delegable    may appear in a Passport ceiling, a delegation grant or a run token (§7)
#       critical     red in the role editor, typed confirmation to grant; implies step_up;
#                    never held by viewer or auditor; allows are always audited
#       system_only  held only by the fixed system roles; never by a human role
#       readonly_post  a POST that changes nothing (exempt from the read-only-GET test, §15.4 R5)
#   - scope: `org` means the permission only takes effect from an ORG binding. A role bound at a
#     project still carries it, inert there; a custom role made only of org permissions cannot be
#     bound at project scope (IDENTITY.md §6.7, amendment A3).
#   - critical permissions are never delegable; passport presets hold only delegable permissions.

version: 1

access_roles:
  - key: owner
    name: Owner
    description: Everything a human can hold. At least one active Owner always exists.
    bindable_scopes: [org]
    mfa_required: true
  - key: admin
    name: Admin
    description: "Runs the install: people, roles, agents, connections, infra, policy."
    bindable_scopes: [org, project]
    mfa_required: true
  - key: operator
    name: Operator
    description: "Does the work: builds, workflows, panels, research, approvals within their seat, previews, non-production deploys. Lets agents act for them."
    bindable_scopes: [org, project]
    mfa_required: false
  - key: viewer
    name: Viewer
    description: Reads every non-sensitive page.
    bindable_scopes: [org, project]
    mfa_required: false
  - key: auditor
    name: Auditor
    description: "Viewer plus the security audit log, identity configuration (read), sessions, keys and grants metadata."
    bindable_scopes: [org]
    mfa_required: true
  # Fixed system roles. Never editable, never bindable by a person, held only by system principals.
  - key: system_worker
    name: System worker
    description: "The worker protocol: lease, heartbeat and complete jobs; reserve spend; lease secrets for a running step."
    bindable_scopes: [org]
    system: true
  - key: system_collector
    name: System collector
    description: Collector machine telemetry ingest.
    bindable_scopes: [org]
    system: true
  - key: system_scim
    name: System SCIM
    description: SCIM 2.0 provisioning for one identity provider.
    bindable_scopes: [org]
    system: true

# Built-in system principals (IDENTITY.md §3). `access_role` is their fixed role; `none` holds nothing.
system_principals:
  - id: sys_worker
    access_role: system_worker
    replaces: "BOSS_WORKER_PRINCIPAL and the shared key on worker protocols"
  - id: sys_collector
    access_role: system_collector
    replaces: collector machine POSTs
  - id: sys_scim
    access_role: system_scim
    replaces: "BOSS_ENTERPRISE_SCIM_BEARER_TOKENS (one principal per provider: sys_scim_<provider>)"
  - id: sys_host_cli
    access_role: none
    replaces: "nothing; the actor of host-shell recovery (boss identity recover-owner)"
  - id: sys_egress
    access_role: none
    replaces: "BOSS_EGRESS_SERVICE_KEY (the egress proxy's shared key; it authenticates to /v1/identity/introspect with a boss_sak_ key of its own)"

# Agent Passport ceiling presets (IDENTITY_PERMISSIONS.md §4). Delegable permissions only.
passport_presets:
  - key: builder
    name: Builder
    agents: [forge, strata, prism, helm]
    permissions: [code_task:read, code_task:create, code_task:steer, code_task:retry, repository:read,
                  github:read, github:sync, preview:read, preview:manage, artifact:read, artifact:rebuild,
                  workflow:read, workflow_run:read, skill:read, skill:invoke, memory:read, memory:manage,
                  spend:reserve, secret:lease, sandbox:read]
    external_ceiling: {github: {contents: write, pull_requests: write, push_refs: "boss/*"}}
  - key: reviewer
    name: Reviewer
    agents: [vera, rook, sentry, weave, muse]
    permissions: [code_task:read, code_task:steer, repository:read, github:read, preview:read,
                  artifact:read, assurance:read, assurance:run, workflow_run:read, skill:read,
                  skill:invoke, memory:read, spend:reserve]
    external_ceiling: {github: {contents: read, pull_requests: write}}
  - key: planner
    name: Planner
    agents: [juno, atlas, keystone, rally, vector, cadence]
    permissions: [code_task:read, code_task:create, meeting:read, meeting:convene, discovery:read,
                  discovery:create, workflow:read, workflow:create, workflow_run:read, workflow_run:start,
                  work_item:read, work_item:manage, decision:read, memory:read, memory:manage, spend:reserve]
    external_ceiling: {github: {contents: read, issues: write}}
  - key: operator_agent
    name: Operator agent
    agents: [harbor, pilot, bedrock, relay, beacon]
    permissions: [deployment:read, deployment:create, host:read, infra:read, observability:read,
                  reliability:read, reliability:respond, preview:read, preview:manage, workflow_run:read,
                  workflow_run:control, spend:reserve, secret:lease]
    external_ceiling: {}
  - key: analyst
    name: Analyst
    agents: [ledger, meter, conduit, sweep]
    permissions: [budget:read, model_provider:read, infra:read, observability:read, activity:read,
                  spend:reserve]
    external_ceiling: {}
  - key: writer
    name: Writer and publisher
    agents: [quill, herald, splice]
    permissions: [artifact:read, artifact:rebuild, discovery:read, comms:read, comms:send, memory:read,
                  spend:reserve]
    external_ceiling: {}
  - key: guardian
    name: Guardian
    agents: [warden, vault, halo]
    permissions: [agent:read, agent_passport:read, activity:read, policy:read, secret:read_metadata]
    external_ceiling: {}

categories:

  # ---- Identity and access -----------------------------------------------------------------------
  - category: "Identity and access"
    permissions:
      - key: directory:read
        title: "View the directory"
        description: "See the names, avatars and kinds of people, groups and agents (no security detail)."
        roles: [owner, admin, operator, viewer, auditor]
        scope: org
        flags: [delegable]
      - key: user:read
        title: "View people"
        description: "List people and open a profile: roles, groups, MFA status, sessions, effective access."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: user:invite
        title: "Invite people"
        description: "Invite a person by email or create a local account."
        roles: [owner, admin]
        scope: org
        flags: [step_up]
      - key: user:update
        title: "Edit people"
        description: "Edit a person's name, email and profile fields."
        roles: [owner, admin]
        scope: org
        flags: [step_up]
      - key: user:disable
        title: "Disable people"
        description: "Disable or re-enable a person. Disabling revokes their sessions and suspends their grants."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: user:delete
        title: "Delete people"
        description: "Erase a disabled person. Their audit history stays, as a tombstone."
        roles: [owner]
        scope: org
        flags: [step_up, critical]
      - key: user:reset_mfa
        title: "Reset a person's MFA"
        description: "Remove a person's MFA factors and issue a one-time recovery link."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: user:revoke_sessions
        title: "Sign a person out everywhere"
        description: "Sign a person out of every device."
        roles: [owner, admin]
        scope: org
        flags: [step_up]
      - key: group:read
        title: "View groups"
        description: "List groups and their members."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: group:manage
        title: "Manage groups"
        description: "Create, rename and delete groups."
        roles: [owner, admin]
        scope: org
        flags: [step_up]
      - key: group:manage_members
        title: "Manage group members"
        description: "Add and remove group members (manual groups only; IdP groups are read-only)."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]   # a member gains the group's bindings: the effect of role_binding:assign
      - key: access_role:read
        title: "View access roles"
        description: "See access roles and their permissions."
        roles: [owner, admin, operator, viewer, auditor]
        scope: org
        flags: []
      - key: access_role:manage
        title: "Manage access roles"
        description: "Create, edit, clone and delete custom access roles. Never more than you hold."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: role_binding:read
        title: "View role bindings"
        description: "See who holds which access role, where."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: role_binding:assign
        title: "Assign access roles"
        description: "Grant or remove an access role for a person, group, service account or agent. Never more than you hold."
        roles: [owner, admin]
        scope: project
        flags: [step_up, critical]
      - key: owner:assign
        title: "Assign Owners"
        description: "Make someone an Owner, or remove an Owner. The last Owner can never be removed."
        roles: [owner]
        scope: org
        flags: [step_up, critical]
      - key: service_account:read
        title: "View service accounts"
        description: "List service accounts, their owners and their keys' metadata."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: service_account:manage
        title: "Manage service accounts"
        description: "Create, edit, disable and delete service accounts."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: service_account_key:manage
        title: "Manage service account keys"
        description: "Create, rotate and revoke a service account's API keys."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: api_key:manage_own
        title: "Manage your own API keys"
        description: "Create, rotate and revoke your own personal API keys, within your own access."
        roles: [owner, admin, operator, viewer, auditor]
        scope: org
        flags: [step_up]
      - key: api_key:read
        title: "View API keys"
        description: "See every API key's metadata: owner, scopes, last use, expiry. Never the key."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: api_key:revoke
        title: "Revoke API keys"
        description: "Revoke anyone's API key."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: session:read
        title: "View sessions"
        description: "See everyone's active sessions: device, place, sign-in method."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: session:revoke
        title: "Revoke sessions"
        description: "End anyone's session."
        roles: [owner, admin]
        scope: org
        flags: [step_up]
      - key: agent_passport:read
        title: "View agent Passports"
        description: "Open an agent's Passport: sponsor, ceiling, lineage, status."
        roles: [owner, admin, operator, viewer, auditor]
        scope: project
        flags: [delegable]
      - key: agent_passport:manage
        title: "Manage agent Passports"
        description: "Change an agent's ceiling, sponsor, spawn rules and depth limit."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: agent_passport:suspend
        title: "Suspend agents"
        description: "Suspend or resume an agent. Suspending stops its runs at their next call."
        roles: [owner, admin]
        scope: org
        flags: [step_up]
      - key: agent_passport:revoke
        title: "Revoke agents"
        description: "Revoke an agent for good. Cascades to its grants, tokens and descendants."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: delegation:grant
        title: "Let agents act for you"
        description: "Let an agent act for you, inside your own access and the agent's ceiling."
        roles: [owner, admin, operator]
        scope: project
        flags: [step_up]
      - key: delegation:read_all
        title: "View all delegations"
        description: "See every delegation grant in the org, and its lineage."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: delegation:revoke_any
        title: "Revoke any delegation"
        description: "Revoke anyone's delegation grant (cascades to runs and sub-agents)."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: connection:use_own
        title: "Connect your own accounts"
        description: "Link your own external accounts (GitHub, Google) into the vault for your agents to use."
        roles: [owner, admin, operator]
        scope: project
        flags: [step_up]
      - key: connection:read_all
        title: "View all external connections"
        description: "See every vaulted external connection's metadata."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: connection:revoke_any
        title: "Revoke any external connection"
        description: "Disconnect anyone's external connection, and revoke it at the provider."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: identity_provider:read
        title: "View identity providers"
        description: "See SSO providers (OIDC, SAML), SCIM and their status."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: identity_provider:manage
        title: "Manage identity providers"
        description: "Add, change and remove SSO providers and SCIM tokens; enforce SSO."
        roles: [owner]
        scope: org
        flags: [step_up, critical]
      - key: security_policy:read
        title: "View the security policy"
        description: "See the sign-in, MFA, session and delegation policy."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: security_policy:manage
        title: "Manage the security policy"
        description: "Change the sign-in, MFA, session and delegation policy."
        roles: [owner]
        scope: org
        flags: [step_up, critical]
      - key: audit:read
        title: "View the security audit log"
        description: "Read the security audit log."
        roles: [owner, admin, auditor]
        scope: org
        flags: []
      - key: audit:export
        title: "Export and verify the security audit log"
        description: "Export the security audit log and verify its hash chain."
        roles: [owner, admin, auditor]
        scope: org
        flags: [step_up]
      - key: scim:provision
        title: "Provision over SCIM"
        description: "Provision users and groups over SCIM 2.0."
        roles: [system_scim]
        scope: org
        flags: [system_only]
      - key: oidc:admin
        title: "Administer app sign-in"
        description: "Create and change OIDC user pools and every app client (BOSS as an identity provider for the apps it builds)."
        roles: [owner, admin]
        scope: org
        flags: [step_up, critical]
      - key: oidc_client:manage
        title: "Manage an app's sign-in client"
        description: "Register an app as an OIDC client, change its redirect URIs, scopes and roles, and rotate its secret."
        roles: [owner, admin, operator]
        scope: project
        flags: [step_up]
      - key: oidc_pool_user:manage
        title: "Manage app sign-in users"
        description: "Invite, disable and reset the MFA of the users of an app sign-in pool."
        roles: [owner, admin]
        scope: org
        flags: [step_up]
      - key: oidc_app:sign_in
        title: "Sign in to apps with BOSS"
        description: "Sign in to a project's apps through BOSS's workforce pool."
        roles: [owner, admin, operator, viewer]
        scope: project
        flags: []

