# Goldeneye module manifest — see docs/MODULE_CONTRACT.md
api_version: 1
id: layer1-runtime
name: Container runtime
version: "0.2.0"
layer: 1
kind: runtime
description: >
  Docker daemon pools, external networks (web/storage/ops), platform-dns
depends_on: [layer0-host]
optional: false
provides: [docker, networks]
min_kit_version: "0.2.0"
hooks:
  install: install.sh
  upgrade: install.sh
  check: check.sh
