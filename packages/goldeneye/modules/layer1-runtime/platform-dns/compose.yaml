# Minimal platform-dns — split-horizon helper for containers.
# Generated config is mounted from /opt/goldeneye/run/platform-dns.
services:
  platform-dns:
    image: andyshinn/dnsmasq:2.83
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN]
    volumes:
      - /opt/goldeneye/run/platform-dns/dnsmasq.conf:/etc/dnsmasq.conf:ro
    command: ["-k"]
