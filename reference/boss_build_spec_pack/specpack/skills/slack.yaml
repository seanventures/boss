skills:
  - id: slack.post_mock
    kind: comms
    risk_tier: 1
    mock_mode: true
    description: Write a mock Slack outbox message and receipt.
    input_schema:
      channel: string
      text: string
      thread_ts: string?
    output_schema:
      provider_ref: string
      receipt_id: string
    cost:
      estimator: zero
      category: comms
    policy:
      use_outbox_only: true
      requires_receipt: true
  - id: slack.post_real
    kind: comms
    risk_tier: 2
    mock_mode: false
    description: Send a real Slack message through outbox worker. Disabled in v0.
    policy:
      use_outbox_only: true
      requires_receipt: true
      rate_limit_per_channel_per_hour: 10
