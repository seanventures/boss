skills:
  - id: software_factory.run_mock
    kind: software_factory
    risk_tier: 1
    mock_mode: true
    description: Produce a mock implementation plan, diff artifact, test result, and PR proposal from a spec.
    input_schema:
      task_id: string
      spec_artifact_id: string
      repo_ref: string
    output_schema:
      implementation_plan_artifact_id: string
      diff_artifact_id: string
      test_report_artifact_id: string
      review_packet_artifact_id: string
      pr_decision_id: string
    cost:
      estimator: fixed
      fixed_usd_micros: 1000
      category: tool
    policy:
      requires_budget_reservation: true
      requires_receipts_for_effects: true
  - id: software_factory.openhands_run
    kind: software_factory
    risk_tier: 2
    mock_mode: false
    description: Later integration: run OpenHands-style coding worker in a sandbox to create PRs.
    input_schema:
      repo_url: string
      issue_or_spec: string
      branch_policy: string
      max_runtime_minutes: integer
    output_schema:
      pr_url: string
      logs_artifact_id: string
      review_packet_artifact_id: string
    cost:
      estimator: runtime_plus_model
      category: tool
    policy:
      requires_budget_reservation: true
      requires_sandbox: true
      requires_approval_for_real_pr: true
