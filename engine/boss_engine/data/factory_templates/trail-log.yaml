id: trail-log
title: Trail log
blurb: A hiker logs a walk with its distance and date and reads the log back later.
category: android
prompt: |
  Build a Jetpack Compose app named Trail Log with a list screen and an editor screen. A hike has
  a name, a date, a distance in kilometers stored as an integer number of meters, and a note of at
  most 280 characters. The list is ordered by date descending and shows the name and distance.
  Tapping a row opens the editor with the saved values. Saving writes through Room into a local
  database on the device. The app requests no network permission. The preview is an emulator
  launch of the list screen. A passing instrumented or local test inserts two hikes and asserts
  the newer date is first.
stack: Jetpack Compose
resources:
  - repo
  - preview
  - database
workflows:
  - name: build
    steps:
      - scaffold
      - test
      - preview
  - name: check
    steps:
      - lint
      - test
