id: pantry-list
title: Pantry list
blurb: A household tracks pantry items by quantity and sees which ones expire this week.
category: android
prompt: |
  Build a Jetpack Compose app named Pantry List. An item has a name, a whole-number quantity, and
  an expiry date. The main screen lists every item and a filter chip shows only items that expire
  within the next seven days, including today. Adding an item refuses an empty name or a quantity
  below one. Store the rows in Room on the device. Do not request a network permission and do not
  call a barcode service. The preview is the app open on an emulator at the list screen. A passing
  test inserts an item expiring tomorrow and an item expiring next month and checks that the week
  filter returns only the first.
stack: Jetpack Compose
resources:
  - repo
  - preview
  - database
workflows:
  - name: build
    steps:
      - scaffold
      - test
      - preview
  - name: check
    steps:
      - lint
      - test
