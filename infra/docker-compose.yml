services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: boss
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: boss
    ports:
      - "${BOSS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d boss"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - boss-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  account-connect:
    image: python:3.11-slim
    working_dir: /app
    command: >
      bash -c "pip install -q -r apps/account_connect/requirements.txt &&
      python -m uvicorn apps.account_connect.app.main:app --host 0.0.0.0 --port 8010"
    environment:
      AC_DATABASE_URL: postgresql+psycopg://boss:boss@db:5432/boss_account_connect
      AC_SERVICE_TOKEN: ${AC_SERVICE_TOKEN:-dev-account-connect-token}
      AC_PUBLIC_BASE_URL: http://localhost:8010
      AC_DEFAULT_ORG_ID: org_boss_cloud
      AC_DEFAULT_ORG_NAME: BOSS Cloud
    ports:
      - "${BOSS_ACCOUNT_CONNECT_PORT:-8010}:8010"
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  boss-postgres-data:
