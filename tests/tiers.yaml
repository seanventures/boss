# SECURITY GUARDS (BOSSAPP-1429, scripts/known_failures.py). A red one fails every gate outright,
# and none of them may ever be listed in tests/known-failures/: a red security guard is fixed,
# never baselined. Most of them also run in P0 above; the gate judges a failure by its file.
