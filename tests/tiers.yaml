# Test tiers (docs/operations/TEST_TIERS.md). Paths are relative to the repository root.
#
#   major release  = P0 + P1
#   minor release  = P0 + the tests of the changed areas  (scripts/test-tier.sh changed)
#   P2             = everything not listed here; on demand or nightly
#
# P0 is what a user hits first and must never break; it stays small (target <= 10 min).
# P1 is the main features plus a regression test for every operator-reported bug (<= 30 min).

P0:
  engine:
    # First run and install
    - engine/tests/test_first_run_setup.py
    - engine/tests/test_a_fresh_install_can_press_build.py
    # Secrets never leave
    - engine/tests/test_redaction_masks_every_credential.py
    - engine/tests/test_identity_audit_redaction.py
    # The public tree names no private host, network, project or home directory
    - engine/tests/test_the_public_tree_names_no_private_infrastructure.py
    # BOSS fixes itself (BOSSAPP-571): a self-fix never touches a protected path or symbol, never
    # weakens a test, and a recommendation never holds a host address
    - engine/tests/test_a_self_fix_never_touches_a_protected_path.py
    - engine/tests/test_protected_symbols_still_exist.py
    - engine/tests/test_a_self_fix_never_weakens_a_test.py
    - engine/tests/test_a_recommendation_never_holds_a_host_address.py
    # ... nothing private leaves with a self-fix, nothing leaves without a preview and a tick,
    # and the parked step always says what BOSS is doing
    - engine/tests/test_a_self_fix_upstream_send_carries_no_private_infrastructure.py
    - engine/tests/test_nothing_is_sent_without_preview_and_check.py
    - engine/tests/test_parked_step_says_what_boss_is_doing.py
    # Sandbox and network fence
    - engine/tests/test_identity_f1_sandbox_boundary.py
    - engine/tests/test_sandbox_network_fence.py
    - engine/tests/test_a_build_fans_out_inside_its_sandbox.py
    # Build pipeline happy path
    - engine/tests/test_code_task_service.py
    - engine/tests/test_a_build_proves_its_app_runs.py
    # Workflow runner core: gates, retry/skip, one approval per deploy
    - engine/tests/test_an_approved_gate_releases_the_work.py
    - engine/tests/test_one_approval_per_deploy.py
    # Every approval holds the run: a deploy waits for its PR's merge, shown on the step
    # (helpdesk-ai 2026-11-06: the deploy shipped the unmerged head, the merge sat outside the run)
    - engine/tests/test_a_deploy_waits_for_its_merge.py
    # A deploy that promises a person always asks one, whatever the environment policy (D2)
    - engine/tests/test_a_promised_approval_is_always_asked.py
    - engine/tests/test_a_workflow_follows_a_retry.py
    # Governed deploy + health
    - engine/tests/test_an_app_is_deployed_the_way_it_says.py
    - engine/tests/test_a_smoke_test_asks_the_deployment_not_a_url.py
    # The measuring stick (BOSSAPP-959): the harness benchmark's suite, numbers and verdicts,
    # the decision eval's floor, and the web quarantine that only shrinks
    - engine/tests/test_harness_bench_suite.py
    - engine/tests/test_harness_bench_metrics.py
    - engine/tests/test_harness_bench_compare.py
    - engine/tests/test_decision_eval_has_a_floor.py
    - engine/tests/test_web_quarantine_holds_only_real_failures.py
  api:
    - apps/api/tests/test_api_e2e_smoke.py
    # Sign-in, step-up, CSRF
    - apps/api/tests/test_identity_authn_signin.py
    - apps/api/tests/test_identity_fxd_step_up.py
    - apps/api/tests/test_identity_f3_authn_security.py
    # Authz core
    - apps/api/tests/test_identity_authz_matrix.py
    # Secrets
    - apps/api/tests/test_no_secret_leaves_the_log.py
    - apps/api/tests/test_a_host_deploy_passes_the_apps_deploy_secrets.py
    # Governed deploy
    - apps/api/tests/test_a_host_deploys_only_through_an_approved_changeset.py
    - apps/api/tests/test_a_stack_deploys_only_through_an_approved_changeset.py
    - apps/api/tests/test_a_deploy_asks_once_or_as_its_policy_says.py
  web:
    - apps/web/tests/console-routes-answer-what-the-console-asks.test.ts
    - apps/web/tests/sign-in-shows-every-option-and-says-why.test.tsx
    - apps/web/tests/sign-in-keeps-your-place-and-you-can-sign-out.test.ts
    - apps/web/tests/step-up-only-on-a-press.test.tsx
    - apps/web/tests/identity-mirroring.test.ts
    - apps/web/tests/a-press-is-sent-once.test.ts
    - apps/web/tests/a-workflow-is-started-once-per-press.test.ts
    - apps/web/tests/a-deploy-is-approved-once-and-opens-its-app.test.tsx
  # Release steps: commands, not test files (scripts/test-tier.sh does not run them). Before a
  # release: test-tier major + e2e-gate plumbing + e2e-gate engines + e2e-gate agent
  # (docs/operations/TEST_TIERS.md).
  release:
    - scripts/e2e-gate.sh plumbing
    - scripts/e2e-gate.sh engines

