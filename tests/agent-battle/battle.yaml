- id: repair-request-not-a-plan
  covers: [repair-request-drafted-as-multi-phase-plan, repair-swallowed-by-in-flight-attempt]
  surface: talk_to_boss
  seed:
    workflow_runs:
      - {id: wfr_bt_order_deploy, status: failed, input: {title: Order API},
         error: "step deploy failed at plan: order-api/boss.deploy.yaml has no `version: 1`"}
    workflow_step_runs:
      - {id: wsr_bt_od_build, workflow_run_id: wfr_bt_order_deploy, step_id: build, step_kind: code_task, status: succeeded,
         output: {build_run_id: crun_bt_order_07}}
      - {id: wsr_bt_od_deploy, workflow_run_id: wfr_bt_order_deploy, step_id: deploy, step_kind: deploy, status: failed,
         last_error: "the deploy could not be planned: order-api/boss.deploy.yaml is missing `version: 1`. Pilot chose fix_app, but the repair was not started: the More tests pass was running on the branch.",
         output: {build_run_id: crun_bt_order_07}}
    code_task_runs:
      - {id: crun_bt_order_07, status: completed, phase: done, title: Order API,
         state: {summary: "Order API with tests; More tests pass finished", tests_passed: true}}
  writes:
    retry_code_task: {ok: true, proposed: true}
  checks:
    never_execute: [propose_command, create_code_task, start_workflow]
    never_offer: [propose_command, start_workflow]
    any_of: [retry_code_task, retry_workflow_step, redeploy]
  expected: >-
    Reads the run: the deploy failed because order-api/boss.deploy.yaml lacks `version: 1`, and the
    earlier repair never started. Starts (or offers as a button) a repair attempt of the Order
    API's own build lineage (retry_code_task run_id=crun_bt_order_07 with a fix note to add
    `version: 1`), then the deploy step's retry; or asks ONE question if unsure.
  must_not:
    - draft a generic multi-phase plan from the word "then" without reading the run
    - start new work outside the app's build lineage
    - say the repair is running when nothing started it
  phrasings:
    - "Pilot found that order-api/boss.deploy.yaml is missing 'version: 1', but its repair never started because the More tests pass was running. That pass has finished. Please start a repair build of the Order API that adds 'version: 1' to its boss.deploy.yaml, then deploy it again."
    - "add version: 1 to the order api manifest and redeploy"
    - "first fix the boss.deploy.yaml of order api, then deploy again"
    - "the repair for order api never started, start it now pls"
    - "Order API deploy failed bcs manifest has no version. Do the fix and after that deploy, thanks"
    - "start the repair build for wfr_bt_order_deploy's deploy step"
    - "fix order api deploy"
    - "can you make the repair that Pilot wanted and then ship it"
  negatives:
    - input: "First research payment providers, then build a checkout for the Order API, then deploy it to staging."
      checks: {never_execute: [retry_code_task, retry_workflow_step, redeploy], allow_clarify: true}
      expected: "Genuinely new, multi-phase work: drafts a plan or offers to start new work (a button), or asks one question. It does not repair or redeploy the existing Order API run."

