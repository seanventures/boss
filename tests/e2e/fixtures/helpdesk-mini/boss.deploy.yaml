# Deployed by BOSS Infra -> stack target -> Deploy a repository (the HelpDesk AI shape: the app
# lives in a folder of a shared repository, and the manifest names it).
version: 1
name: helpdesk-mini
kind: commands
env:
  PORT: "3000"
  SESSION_SECRET: {generate: hex32}
# The app's Postgres, declared: BOSS provisions it and binds DATABASE_URL (plugins/official/postgres).
resources:
  db: {capability: database.relational, engine: postgres}
install:
  - "cd helpdesk && npm install --include=dev --no-audit --no-fund --loglevel=error"
  - "cd helpdesk && npm run build"
  - "cd helpdesk && npm run migrate"
  - "cd helpdesk && (nohup npx tsx src/server/index.ts > /tmp/helpdesk-mini.log 2>&1 & disown)"
health:
  - {url: "{target.public_url}/healthz", expect: 200}
open: {url: "{target.public_url}"}
