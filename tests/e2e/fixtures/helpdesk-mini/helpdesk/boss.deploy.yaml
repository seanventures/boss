# Deployed by BOSS Infra -> stack target -> Deploy a repository (the HelpDesk AI shape: the app
# lives in a folder of a shared repository, and its manifest sits beside it; its commands run
# from that folder).
version: 1
name: helpdesk-mini
kind: commands
env:
  PORT: "3000"
  SESSION_SECRET: {generate: hex32}
  DATABASE_URL: {secret: DATABASE_URL}
install:
  - "npm install --include=dev --no-audit --no-fund --loglevel=error"
  - "npm run build"
  - "npm run migrate"
  - "(nohup npx tsx src/server/index.ts > /tmp/helpdesk-mini.log 2>&1 & disown)"
health:
  - {url: "{target.public_url}/healthz", expect: 200}
open: {url: "{target.public_url}"}
