services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://helpdesk:helpdesk@db:5432/helpdesk}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_BOSS_ISSUER: ${OIDC_BOSS_ISSUER:-}
      OIDC_BOSS_CLIENT_ID: ${OIDC_BOSS_CLIENT_ID:-}
      OIDC_BOSS_CLIENT_SECRET: ${OIDC_BOSS_CLIENT_SECRET:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_AGENT_EMAILS: ${AUTH_AGENT_EMAILS:-}
      TICKET_TAGS_ENABLED: ${TICKET_TAGS_ENABLED:-true}
      ENABLE_THEME_V2: ${ENABLE_THEME_V2:-true}
      ENABLE_DASHBOARD: ${ENABLE_DASHBOARD:-true}
      INCIDENT_DETECTION_ENABLED: ${INCIDENT_DETECTION_ENABLED:-true}
      APP_ENV: ${APP_ENV:-staging}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      BOSS_SIGNALS_TOKEN: ${BOSS_SIGNALS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    volumes:
      - helpdesk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helpdesk-db:
