{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boss.fullname" . }}-control-plane-ingress
  labels:
    {{- include "boss.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boss.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "boss.selectorLabels" . | nindent 14 }}
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8000
{{- end }}
