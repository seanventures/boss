apiVersion: apps/v1
kind: Deployment
metadata:
  name: boss-worker
  namespace: boss
  labels:
    app.kubernetes.io/name: boss
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: boss
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boss
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: boss-control-plane
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/seanheiney/boss-worker:0.4.1
          imagePullPolicy: IfNotPresent
          env:
            - name: BOSS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: boss-secrets
                  key: BOSS_WORKER_API_KEY
          envFrom:
            - configMapRef:
                name: boss-config
            - secretRef:
                name: boss-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/boss/artifacts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: boss-artifacts
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: boss-worker
  namespace: boss
  labels:
    app.kubernetes.io/name: boss
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boss
      app.kubernetes.io/component: worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boss-worker
  namespace: boss
  labels:
    app.kubernetes.io/name: boss
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: boss-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
