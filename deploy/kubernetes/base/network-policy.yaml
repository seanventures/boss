apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: boss-control-plane-ingress
  namespace: boss
  labels:
    app.kubernetes.io/name: boss
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: boss
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: boss
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8000
