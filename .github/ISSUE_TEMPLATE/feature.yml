name: Feature request
description: Suggest a specific Community workflow improvement.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "Describe the outcome you need. A request creates no automatic work or approval."
  - type: textarea
    id: workflow
    attributes:
      label: Who needs this, and in which workflow?
      placeholder: "As a maintainer, when reviewing a run..."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What should change?
      description: Describe what someone should be able to do afterward.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would you know it works?
      description: Give one observable result or acceptance check.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Optional; helps maintainers judge impact.
    validations:
      required: false
