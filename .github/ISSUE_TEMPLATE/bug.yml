name: Bug report
description: Something in BOSS didn't do what you expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Tell us what you were doing and what you expected.

        Never paste `.env`, API keys, tokens, passwords, private keys, or customer data, and redact any hostnames you want kept private.

        **Security vulnerability?** Please don't file it here. Email boss@sean.net instead.
  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      description: The screen, command, or goal you were in the middle of.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: Include the exact error text if there is one, with secrets removed.
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: How did you install?
      options:
        - 'Local checkout (./install.sh --dir "$PWD")'
        - Release one-liner (pinned commit)
        - Upgrade of an existing install
        - Not sure
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Edition
      description: Community, or the value returned for your project by the edition endpoint. Say if the install never got that far.
      placeholder: Community
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BOSS version or commit
      placeholder: v1.0-rc6.1, or the full commit SHA from your checkout
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Paste only redacted logs. Do not paste secrets, tokens, passwords, or the contents of .env.
    validations:
      required: false
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed secrets, tokens, passwords, and private hostnames.
          required: true
