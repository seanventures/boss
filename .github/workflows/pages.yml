name: Docs site

# Build-only check. The site is served from https://boss.sean.network/ (landing)
# and https://boss.sean.network/docs/ (manual); this workflow never deploys.
on:
  pull_request:
    paths:
      - "docs/community/**"
      - "docs/landing/**"
      - "mkdocs.community.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/community/**"
      - "docs/landing/**"
      - "mkdocs.community.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The private source repository has its own manual; only the public repository checks this site.
    if: github.repository == 'seanventures/boss'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.6.15
      - name: Build the docs strictly
        run: mkdocs build -f mkdocs.community.yml --strict -d _site/docs
      - name: Add the landing page
        run: cp -R docs/landing/. _site/
      - name: Check the site layout
        run: test -f _site/index.html && test -f _site/docs/index.html
