name: Product docs

# Build-only check for the product manual. Marketing website source and deployment
# are maintained separately.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: product-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The private source repository has its own manual.
    if: github.repository == 'seanventures/boss'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check repository scope
        run: test -z "$(git ls-files -- docs/landing website boss-website site)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.6.15
      - name: Build the docs strictly
        run: mkdocs build -f mkdocs.community.yml --strict -d _site/docs
      - name: Check the manual
        run: test -f _site/docs/index.html
