# Keyword decision eval. Scores the in-repo keyword rules and does not call a model.
# `make eval-decisions` runs it with --check: a family below its floor in
# evals/task_rigor/thresholds.json (today's measured numbers) fails this workflow.
name: Keyword decision eval

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the imports the keyword eval needs
        run: >
          python -m pip install
          'sqlalchemy==2.0.41'
          'pydantic>=2.7,<3'
          'pydantic-settings==2.10.1'
          'PyYAML==6.0.2'
          'openai==1.93.0'
          'httpx==0.28.1'
          'reportlab==4.5.1'
      - name: Run the keyword decision eval
        run: make eval-decisions
