site_name: BOSS
site_description: Business Operating System Sentinel product and operator documentation
site_url: https://seanheiney.github.io/boss/
repo_url: https://github.com/seanheiney/boss
repo_name: seanheiney/boss
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan

nav:
  - Home: index.md
  - Features:
      - Catalog: features/index.md
      - Implemented: features/implemented.md
      - Partial: features/partial.md
      - Planned: features/planned.md
      - Blocked: features/blocked.md
  - Product:
      - Product requirements: product/PRD-v2.0.md
      - Technical specification: product/TECHNICAL_SPEC-v2.0.md
      - Roadmap: product/ROADMAP-v2.0.md
      - Assurance contracts: product/ASSURANCE_CONTRACTS.md
      - Traceability: product/TRACEABILITY.md
  - Architecture:
      - Governed autonomous improvement: architecture/AUTONOMOUS_IMPROVEMENT_LOOP.md
  - Operations:
      - Infrastructure runbook: operations/INFRA_RUNBOOK.md
      - Webhooks: operations/WEBHOOKS.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: BOSS documentation is generated from the repository's auditable product ledger.
