openapi: 3.1.0
info:
  title: BOSS Control Plane API
  version: 0.11.0
  description: OpenAPI document version aligned to product 0.11.0 (was 0.2.1).
security:
- BossBearerAuth: []
- BossApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/projects:
    get:
      summary: List projects available to the current control-plane client
      responses:
        '200':
          description: Project list
  /v1/auth/session:
    get:
      summary: Inspect transport authentication, OIDC state, and principal binding
      responses:
        '200':
          description: Auth session
          auth method: null
          OIDC state: null
          and principal binding state: null
  /saml/v2/{project_id}/metadata:
    get:
      security: []
      summary: Return BOSS SAML service-provider metadata for an enterprise project
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SAML service-provider metadata XML with ACS endpoint
  /saml/v2/{project_id}/acs:
    post:
      security: []
      summary: Exchange a signed enterprise SAMLResponse for a short-lived BOSS bearer session
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - SAMLResponse
              properties:
                SAMLResponse:
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - SAMLResponse
              properties:
                SAMLResponse:
                  type: string
      responses:
        '200':
          description: Signed assertion verified; hashed SAML session stored; bearer token returned
        '401':
          description: Assertion signature
          certificate: null
          audience: null
          time: null
          issuer: null
          or member mapping failed: null
        '403':
          description: No active non-blocked SAML provider is configured
        '503':
          description: BOSS_ENTERPRISE_SAML_ENABLED is not enabled
  /v1/edition:
    get:
      summary: Inspect effective BOSS edition, Account Connect requirement, and active commercial capabilities
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Edition status; Community works without hosted auth
          Cloud is blocked until Account Connect is linked: null
  /v1/entitlements:
    get:
      summary: List license entitlements and edition-pack capabilities for a project
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Edition status plus active or requested inactive license entitlements
  /v1/cloud/catalog:
    get:
      summary: BOSS Cloud/Enterprise feature catalog and Community independence contract
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Feature matrix with available_now flags and packaging copy
  /v1/cloud/status:
    get:
      summary: Cloud link status and Easy Connect readiness
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Independence flag, edition status, easy-connect readiness
  /v1/cloud/easy-connect:
    post:
      summary: Start Easy Connect from self-hosted Community to BOSS Cloud
      description: >
        Browser or device OAuth-style link. Community remains fully independent when
        BOSS_ACCOUNT_CONNECT_URL is unset (returns blocked with clear reason). Never
        accepts raw Cloud credentials in the control plane.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                method: { type: string, enum: [browser, device], default: browser }
                return_url: { type: string }
                actor: { type: string, default: ceo }
      responses:
        '201':
          description: Easy Connect session started or blocked with visible reason
        '422':
          description: Invalid method or project
  /v1/cloud/easy-connect/{session_id}:
    get:
      summary: Poll Easy Connect session (device flow)
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: actor
          in: query
          required: false
          schema: { type: string, default: ceo }
      responses:
        '200':
          description: Session status pending, completed, or blocked
        '404':
          description: Session not found
  /v1/account-connect/link:
    post:
      summary: Link a local project to a hosted BOSS Account Connect org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - hosted_org_id
              properties:
                project_id:
                  type: string
                hosted_org_id:
                  type: string
                connection_ref:
                  type: string
                marketplace_identity:
                  type: object
                billing_portal_ref:
                  type: string
                connector_authorization_refs:
                  type: array
                  items:
                    type: string
                optional_telemetry_enabled:
                  type: boolean
                  default: false
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '200':
          description: Account Connect link persisted
          entitlement state refreshed: null
          and audit event emitted: null
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
  /v1/account-connect/unlink:
    post:
      summary: Unlink the active hosted BOSS Account Connect org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                hosted_org_id:
                  type: string
                reason:
                  type: string
                actor:
                  type: string
                  default: ceo
      responses:
        '200':
          description: Account Connect link detached
          dependent entitlements marked detached: null
          and audit event emitted: null
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '404':
          description: No active Account Connect link matched the request
  /v1/account-connect/sync:
    post:
      summary: Sync hosted Account Connect license entitlements through the configured real HTTP adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                hosted_org_id:
                  type: string
                actor:
                  type: string
                  default: ceo
      responses:
        '200':
          description: Hosted entitlements synced into local license entitlement state and audit event
            emitted
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '404':
          description: No active Account Connect link matched the request
        '502':
          description: Configured Account Connect service returned an invalid or failing response
        '503':
          description: BOSS_ACCOUNT_CONNECT_URL is not configured
          so sync fails closed: null
  /v1/account-connect/health-checks:
    get:
      summary: List hosted Account Connect readiness checks and readiness packet evidence
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Account Connect health-check records with status
          latency: null
          hosted org: null
          response metadata: null
          errors: null
          and readiness_packet_artifact_id: null
    post:
      summary: Run a configured hosted Account Connect readiness check or record fail-closed configuration
        evidence with a readiness packet artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                hosted_org_id:
                  type: string
                check_kind:
                  type: string
                  default: hosted_service
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '201':
          description: Health check recorded as healthy
          degraded: null
          unhealthy: null
          blocked_configuration: null
          or failed with readiness_packet_artifact_id: null
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '409':
          description: Requested hosted org conflicts with the active Account Connect link
  /v1/account-connect/auth-sessions:
    get:
      summary: List hosted Account Connect auth sessions and visible blocked/failed states
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Auth session records with authorization URL
          state: null
          status: null
          receipt: null
          and completion metadata: null
    post:
      summary: Start a hosted Account Connect login session through a receipt-protected adapter call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                hosted_org_id:
                  type: string
                return_url:
                  type: string
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '201':
          description: Auth session record created; authorization_url is present only when hosted adapter
            succeeds
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '409':
          description: Requested hosted org conflicts with the active Account Connect link
  /v1/account-connect/auth-sessions/{session_id}/complete:
    post:
      summary: Complete a hosted Account Connect auth session and link the returned hosted org
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - code
              - state
              properties:
                project_id:
                  type: string
                code:
                  type: string
                state:
                  type: string
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '200':
          description: Hosted auth completion recorded
          Account Connect org linked when hosted adapter succeeds: null
          and receipt/audit trail emitted: null
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '404':
          description: Auth session was not found
        '409':
          description: Callback state did not match the stored session state
  /v1/account-connect/team-invites:
    get:
      summary: List Account Connect team invites and visible delivery/blocked states
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Team invite records
          including blocked hosted delivery attempts and receipt links: null
    post:
      summary: Create a hosted Account Connect team invite through a receipt-protected adapter call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - email
              properties:
                project_id:
                  type: string
                email:
                  type: string
                display_name:
                  type: string
                role_keys:
                  type: array
                  items:
                    type: string
                permissions:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '201':
          description: Team invite record created; hosted delivery may be sent
          failed: null
          or blocked visibly: null
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '404':
          description: No active Account Connect link matched the request
  /v1/account-connect/team-invites/{invite_id}/revoke:
    post:
      summary: Revoke an Account Connect team invite, using a receipt-protected hosted revoke when needed
      parameters:
      - name: invite_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                reason:
                  type: string
                actor:
                  type: string
                  default: ceo
      responses:
        '200':
          description: Team invite revoked locally and
          when hosted invite ref exists: null
          through the hosted adapter: null
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '404':
          description: Invite was not found
  /v1/account-connect/billing-portal-sessions:
    get:
      summary: List Account Connect billing portal session records
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Billing portal session records with ready
          failed: null
          or blocked status and receipt links: null
    post:
      summary: Create a hosted billing portal session through a receipt-protected Account Connect adapter
        call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                return_url:
                  type: string
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '201':
          description: Billing portal session record created; portal URL is present only when hosted adapter
            succeeds
        '403':
          description: Actor is not allowed to manage ProviderOps or commercial connection state
        '404':
          description: No active Account Connect link matched the request
  /scim/v2/{project_id}/Groups:
    get:
      summary: SCIM 2.0 list groups for an active Enterprise SCIM provider
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: Supports displayName eq "Group Name".
      responses:
        '200':
          description: SCIM ListResponse of mapped BOSS groups
        '401':
          description: Missing or invalid SCIM bearer token
        '403':
          description: No active non-blocked SCIM identity provider is configured
        '503':
          description: SCIM runtime token configuration is missing
    post:
      summary: SCIM 2.0 create or update a group mapping
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: SCIM Group resource with BOSS role/permission extension
        '400':
          description: Invalid SCIM group payload
        '401':
          description: Missing or invalid SCIM bearer token
        '403':
          description: No active non-blocked SCIM identity provider is configured
  /scim/v2/{project_id}/Groups/{group_id}:
    get:
      summary: SCIM 2.0 fetch a group by SCIM id, externalId, or displayName
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: group_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SCIM Group resource
        '404':
          description: Group not found
    put:
      summary: SCIM 2.0 replace a group mapping
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: group_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Replaced SCIM Group resource
        '400':
          description: Invalid SCIM group payload
    delete:
      summary: SCIM 2.0 deactivate a group mapping without deleting audit history
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: group_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Group marked inactive
        '404':
          description: Group not found
  /scim/v2/{project_id}/Users:
    get:
      summary: SCIM 2.0 list users for an active Enterprise SCIM provider
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: Supports userName eq "user@example.com".
      responses:
        '200':
          description: SCIM ListResponse of mapped BOSS users
        '401':
          description: Missing or invalid SCIM bearer token
        '403':
          description: No active non-blocked SCIM identity provider is configured
        '503':
          description: SCIM runtime token configuration is missing
    post:
      summary: SCIM 2.0 create or update a user and effective BOSS org member
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: SCIM User resource with BOSS member/permission extension
        '400':
          description: Invalid SCIM user payload
        '401':
          description: Missing or invalid SCIM bearer token
        '403':
          description: No active non-blocked SCIM identity provider is configured
  /scim/v2/{project_id}/Users/{user_id}:
    get:
      summary: SCIM 2.0 fetch a user by SCIM id, externalId, userName, or member id
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SCIM User resource
        '404':
          description: User not found
    put:
      summary: SCIM 2.0 replace a user and effective BOSS org member mapping
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Replaced SCIM User resource
        '400':
          description: Invalid SCIM user payload
    delete:
      summary: SCIM 2.0 deactivate a user and remove effective org-member access
      security:
      - scimBearerAuth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: User marked inactive and org-member access disabled
        '404':
          description: User not found
  /v1/enterprise/clusters:
    get:
      summary: List enterprise deployment, clustering, trust, support, and private-worker records
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Enterprise cluster/trust records with blocking gaps and normalized governance controls
    post:
      summary: Create or update an enterprise cluster/trust record without provisioning infrastructure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                deployment_mode:
                  type: string
                  enum:
                  - enterprise_cloud
                  - self_hosted
                  - private_cloud
                  - air_gapped
                  default: enterprise_cloud
                account_connect_mode:
                  type: string
                  enum:
                  - attached
                  - detached
                  default: attached
                worker_pool_strategy:
                  type: string
                  default: managed_workers
                ha_profile:
                  type: string
                  default: standard
                data_residency:
                  type: string
                  default: us
                identity_controls:
                  type: object
                governance_controls:
                  type: object
                audit_controls:
                  type: object
                private_worker_pools:
                  type: array
                  items:
                    type: object
                compliance_packs:
                  type: array
                  items:
                    type: string
                support_tier:
                  type: string
                  default: standard
                support_sla:
                  type: object
                status:
                  type: string
                  default: planned
                metadata:
                  type: object
                actor:
                  type: string
                  default: system
      responses:
        '201':
          description: Enterprise cluster record normalized
          policy gaps calculated: null
          and audit event emitted: null
        '403':
          description: Actor is not allowed to manage enterprise trust or clustering records
        '422':
          description: Unsupported enterprise deployment or Account Connect mode
  /v1/enterprise/cluster-validation-runs:
    get:
      summary: List auditable Enterprise cluster validation runs
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: enterprise_cluster_id
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Cluster validation run records with checks
          evidence references: null
          status: null
          and blocking gaps: null
    post:
      summary: Record Enterprise cluster validation evidence without claiming a live rollout occurred
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - enterprise_cluster_id
              - validation_kind
              - checks
              properties:
                project_id:
                  type: string
                enterprise_cluster_id:
                  type: string
                validation_kind:
                  type: string
                status:
                  type: string
                  default: passed
                checks:
                  type: array
                  items:
                    type: object
                evidence_refs:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '201':
          description: Validation run recorded and enterprise.cluster_validation_recorded event emitted
        '403':
          description: Actor is not allowed to manage enterprise trust or clustering records
        '422':
          description: Invalid cluster
          status: null
          or check payload: null
  /v1/enterprise/support-cases:
    get:
      summary: List enterprise support/SLA cases for a project
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Enterprise support cases with SLA due dates
          hosted escalation state: null
          receipts: null
          support_packet_artifact_id: null
          and metadata: null
    post:
      summary: Create a local enterprise support case and optionally request receipt-backed hosted escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - title
              - description
              properties:
                project_id:
                  type: string
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                  enum:
                  - critical
                  - high
                  - normal
                  - low
                  default: normal
                category:
                  type: string
                  default: support
                enterprise_cluster_id:
                  type: string
                escalate_to_hosted:
                  type: boolean
                  default: false
                metadata:
                  type: object
                actor:
                  type: string
                  default: system
      responses:
        '201':
          description: Support case created with support_packet_artifact_id; hosted escalation is submitted
          failed: null
          or blocked visibly: null
        '403':
          description: Actor is not allowed to manage enterprise support records
        '422':
          description: Unsupported severity
          unknown project: null
          or invalid support payload: null
  /v1/enterprise/support-cases/{case_id}:
    post:
      summary: Update local enterprise support case status, assignment, or metadata
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
