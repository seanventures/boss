openapi: 3.1.0
info:
  title: BOSS Control Plane API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /v1/status:
    get:
      summary: Executive status summary
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Status summary }
  /v1/commands/propose:
    post:
      summary: Submit a CEO command and create an intake task/job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, command]
              properties:
                project_id: { type: string }
                command: { type: string }
                constraints: { type: object }
      responses:
        '201': { description: Command accepted }
  /v1/tasks:
    get:
      summary: List tasks
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task list }
    post:
      summary: Create task
      responses:
        '201': { description: Created }
  /v1/jobs/{job_id}:
    get:
      summary: Get job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job }
        '404': { description: Job not found }
  /v1/tasks/{task_id}:
    get:
      summary: Get task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task }
  /v1/artifacts:
    get:
      summary: List artifacts
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        '200': { description: Artifact list }
  /v1/artifacts/{artifact_id}:
    get:
      summary: Get artifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Artifact detail }
        '404': { description: Artifact not found }
  /v1/roles:
    get:
      summary: List installed roles for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Role list }
  /v1/roles/{role_key}:
    get:
      summary: Get installed role detail
      parameters:
        - name: role_key
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Role detail }
        '404': { description: Role not found }
  /v1/packs:
    get:
      summary: List available packs with install status for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pack list }
  /v1/packs/{pack_id}:
    get:
      summary: Get pack detail for a project
      parameters:
        - name: pack_id
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pack detail }
        '404': { description: Pack not found }
  /v1/packs/install:
    post:
      summary: Install a spec-backed company pack into a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, pack_id]
              properties:
                project_id: { type: string }
                pack_id: { type: string }
                actor: { type: string, default: system }
      responses:
        '201': { description: Pack installed }
        '404': { description: Pack not found }
        '422': { description: Invalid pack or role spec }
  /v1/skills:
    get:
      summary: List registered control-plane skills from specpack
      responses:
        '200': { description: Skill list }
  /v1/entitlements/sources:
    get:
      summary: List configured entitlement sources for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Entitlement source list }
    post:
      summary: Register or update an entitlement source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, provider, source_id, source_kind, entitlement_kind, owner_type, owner_id]
      responses:
        '201': { description: Entitlement source upserted }
  /v1/router/preview:
    post:
      summary: Preview entitlement-based model routing and persist a routing log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, skill_id, task_kind, workload_class]
      responses:
        '200': { description: Routing decision }
        '404': { description: Skill not found }
  /v1/router/logs:
    get:
      summary: List recent routing logs for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        '200': { description: Routing log list }
  /v1/comms/outbox:
    get:
      summary: List outbound communication records for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Outbox list }
    post:
      summary: Create an outbox draft message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, channel, body, dedupe_key]
              properties:
                project_id: { type: string }
                channel: { type: string }
                subject: { type: string }
                body: { type: string }
                dedupe_key: { type: string }
                actor: { type: string, default: executive_console }
      responses:
        '201': { description: Outbox draft created }
  /v1/comms/outbox/{message_id}/queue:
    post:
      summary: Queue a receipt-gated outbound communication job
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, dedupe_key]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                actor: { type: string, default: executive_console }
                priority: { type: integer, default: 25 }
                max_attempts: { type: integer, default: 3 }
      responses:
        '201': { description: Communication job queued }
        '404': { description: Outbox message not found }
  /v1/comms/outbox/{message_id}/deliver:
    post:
      summary: Deliver a queued outbox message through the configured provider
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, dedupe_key]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                actor: { type: string, default: executive_console }
                created_by_job_id: { type: string }
      responses:
        '200': { description: Communication delivered, blocked, reused, or failed }
        '404': { description: Outbox message not found }
  /v1/comms/inbox:
    get:
      summary: List inbound communication records for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Inbox list }
  /v1/comms/inbox/ingest:
    post:
      summary: Record an inbound message in the inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, channel, body]
              properties:
                project_id: { type: string }
                channel: { type: string }
                subject: { type: string }
                body: { type: string }
                raw_ref: { type: string }
                actor: { type: string, default: system }
      responses:
        '201': { description: Inbox message recorded }
  /v1/decisions/inbox:
    get:
      summary: List decisions for inbox with pending items first
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Decision cards }
  /v1/decisions/{decision_id}/approve:
    post:
      summary: Approve decision
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, default: executive_console }
                note: { type: string }
      responses:
        '200': { description: Approved }
        '404': { description: Decision not found }
        '409': { description: Invalid transition }
  /v1/decisions/{decision_id}/reject:
    post:
      summary: Reject decision
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, default: executive_console }
                note: { type: string }
      responses:
        '200': { description: Rejected }
        '404': { description: Decision not found }
        '409': { description: Invalid transition }
  /v1/decisions/{decision_id}/revise:
    post:
      summary: Request a revision to a pending decision
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, default: executive_console }
                note: { type: string }
      responses:
        '200': { description: Revision requested }
        '404': { description: Decision not found }
        '409': { description: Invalid transition }
        '422': { description: Validation error }
  /v1/decisions/{decision_id}/delegate:
    post:
      summary: Delegate a pending decision to another role or owner
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, default: executive_console }
                note: { type: string }
                delegate_to: { type: string }
      responses:
        '200': { description: Delegated }
        '404': { description: Decision not found }
        '409': { description: Invalid transition }
        '422': { description: Validation error }
  /v1/decisions/{decision_id}/execute:
    post:
      summary: Mark an approved decision as manually executed with evidence
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, default: executive_console }
                note: { type: string }
                external_ref: { type: string }
      responses:
        '200': { description: Executed }
        '404': { description: Decision not found }
        '409': { description: Invalid transition }
        '422': { description: Validation error }
  /v1/jobs:
    post:
      summary: Create job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, kind]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                kind: { type: string }
                payload: { type: object }
                requires_reservation: { type: boolean, default: false }
                reservation_id: { type: string }
                priority: { type: integer, default: 100 }
                max_attempts: { type: integer, default: 3 }
                run_after_seconds: { type: integer, default: 0 }
      responses:
        '201': { description: Created }
  /v1/worker/poll:
    post:
      summary: Worker polls for leased job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, capabilities]
              properties:
                worker_id: { type: string }
                capabilities: { type: array, items: { type: string } }
                max_jobs: { type: integer, default: 1 }
                lease_ttl_seconds: { type: integer, default: 60 }
      responses:
        '200': { description: Job lease or empty response }
  /v1/worker/heartbeat:
    post:
      summary: Renew job lease heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, job_id, lease_token]
              properties:
                worker_id: { type: string }
                job_id: { type: string }
                lease_token: { type: string }
                lease_ttl_seconds: { type: integer, default: 60 }
      responses:
        '200': { description: Heartbeat accepted }
  /v1/worker/complete:
    post:
      summary: Complete leased job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, job_id, lease_token]
              properties:
                worker_id: { type: string }
                job_id: { type: string }
                lease_token: { type: string }
                result: { type: object }
      responses:
        '200': { description: Completion recorded }
  /v1/worker/fail:
    post:
      summary: Fail leased job and trigger retry or deadletter handling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, job_id, lease_token, error]
              properties:
                worker_id: { type: string }
                job_id: { type: string }
                lease_token: { type: string }
                error: { type: object }
                retryable: { type: boolean, default: true }
                retry_delay_seconds: { type: integer, default: 30 }
      responses:
        '200': { description: Completion recorded }
  /v1/budget/status:
    get:
      summary: Budget status for scope
      parameters:
        - name: scope_type
          in: query
          required: true
          schema: { type: string }
        - name: scope_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Budget status }
  /v1/budget/quote:
    post:
      summary: Quote a spend request against the active project budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, category, amount_usd_micros, reason]
              properties:
                project_id: { type: string }
                category: { type: string }
                amount_usd_micros: { type: integer }
                reason: { type: string }
      responses:
        '200': { description: Quote result }
  /v1/budget/reserve:
    post:
      summary: Internal budget reservation endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, category, amount_usd_micros, reason]
              properties:
                project_id: { type: string }
                category: { type: string }
                amount_usd_micros: { type: integer }
                reason: { type: string }
                job_id: { type: string }
                expires_in_minutes: { type: integer, default: 30 }
      responses:
        '201': { description: Reservation created or denied }
  /v1/budget/release:
    post:
      summary: Release an active reservation without consuming spend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, reason]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Reservation released or current status returned }
  /v1/openai/plans:
    post:
      summary: Create a real OpenAI-backed plan artifact behind a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, dedupe_key, prompt]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                prompt: { type: string }
                system_prompt: { type: string }
                created_by_job_id: { type: string }
      responses:
        '200': { description: Plan artifact created, reused, or blocked }
  /v1/software-factory/proposals:
    post:
      summary: Create a real sandbox pull request proposal behind a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [project_id, reservation_id, dedupe_key, title, branch_name, summary, files]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                title: { type: string }
                branch_name: { type: string }
                summary: { type: string }
                created_by_job_id: { type: string }
                files:
                  type: array
                  items:
                    type: object
                    required: [path, content]
                    properties:
                      path: { type: string }
                      content: { type: string }
      responses:
        '200': { description: Sandbox PR created, reused, or blocked }
  /v1/software-factory/merges:
    post:
      summary: Merge a sandbox pull request behind a receipt-backed control-plane gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [project_id, decision_id, dedupe_key, pull_request_number, pull_request_url, title]
              properties:
                project_id: { type: string }
                decision_id: { type: string }
                dedupe_key: { type: string }
                pull_request_number: { type: integer }
                pull_request_url: { type: string }
                title: { type: string }
                branch_name: { type: string }
                created_by_job_id: { type: string }
      responses:
        '200': { description: Sandbox PR merged, reused, blocked, or failed }
  /v1/software-factory/proposals/queue:
    post:
      summary: Queue a real sandbox PR proposal for leased worker execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [project_id, reservation_id, dedupe_key, title, branch_name, summary, files]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                title: { type: string }
                branch_name: { type: string }
                summary: { type: string }
                priority: { type: integer, default: 50 }
                max_attempts: { type: integer, default: 3 }
                files:
                  type: array
                  items:
                    type: object
                    required: [path, content]
                    properties:
                      path: { type: string }
                      content: { type: string }
      responses:
        '201': { description: Proposal job queued }
  /v1/software-factory/merges/queue:
    post:
      summary: Queue a sandbox PR merge for leased worker execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [project_id, decision_id, dedupe_key, pull_request_number, pull_request_url, title]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                decision_id: { type: string }
                dedupe_key: { type: string }
                pull_request_number: { type: integer }
                pull_request_url: { type: string }
                title: { type: string }
                branch_name: { type: string }
                priority: { type: integer, default: 30 }
                max_attempts: { type: integer, default: 3 }
      responses:
        '201': { description: Merge job queued }
  /v1/receipts/{dedupe_key}:
    get:
      summary: Get receipt by dedupe key
      parameters:
        - name: dedupe_key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Receipt }
  /v1/receipts:
    get:
      summary: List receipts for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Receipt list }
  /v1/audit/export:
    get:
      summary: Export a reconstructable audit chain
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: task_id
          in: query
          required: false
          schema: { type: string }
        - name: decision_id
          in: query
          required: false
          schema: { type: string }
        - name: job_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Audit export }
        '404': { description: Unknown project }
  /v1/audit/replay-bundles:
    post:
      summary: Create a replay-bundle artifact from the current audit chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                decision_id: { type: string }
                job_id: { type: string }
                actor: { type: string, default: system }
      responses:
        '201': { description: Replay bundle created }
        '404': { description: Unknown project }
  /v1/events:
    get:
      summary: Event feed
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Events }
  /v1/deadletters:
    get:
      summary: Deadletter feed
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Deadletters }
