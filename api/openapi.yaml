components:
  securitySchemes:
    BossBearerAuth:
      type: http
      scheme: bearer
      description: Set to a configured API key when `BOSS_REQUIRE_API_AUTH=true`, or to a verified OIDC JWT when `BOSS_OIDC_ENABLED=true`.
    BossApiKeyAuth:
      type: apiKey
      in: header
      name: X-BOSS-API-Key
      description: Alternate API key header accepted when `BOSS_REQUIRE_API_AUTH=true`.
    scimBearerAuth:
      type: http
      scheme: bearer
      description: Enterprise SCIM provisioning token configured through `BOSS_ENTERPRISE_SCIM_BEARER_TOKENS`; separate from normal BOSS API keys.
