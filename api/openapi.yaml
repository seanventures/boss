        '200': { description: Provider account list with capability and permission status }
    post:
      summary: Register a provider account without granting raw credentials to agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, provider, account_label]
              properties:
                project_id: { type: string }
                provider:
                  type: string
                  enum: [digitalocean, cloudflare, supabase, openai, anthropic]
                account_label: { type: string }
                credential_ref: { type: string }
                scopes:
                  type: array
                  items: { type: string }
                read_only: { type: boolean, default: true }
                deploy_capable: { type: boolean, default: false }
                billing_readable: { type: boolean, default: false }
                destructive_actions_disabled: { type: boolean, default: true }
                actor: { type: string, default: ceo }
