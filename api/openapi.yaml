          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, dedupe_key]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                actor: { type: string, default: executive_console }
                created_by_job_id: { type: string }
      responses:
        '200': { description: "Communication delivered, blocked, reused, or failed through a guarded Slack or SMTP adapter, including data_boundary when policy blocks an external effect" }
        '404': { description: Outbox message not found }
