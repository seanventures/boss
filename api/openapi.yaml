            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  securitySchemes:
    BossBearerAuth:
      type: http
      scheme: bearer
      description: Set to a configured API key when `BOSS_REQUIRE_API_AUTH=true`, or to a verified OIDC
        JWT when `BOSS_OIDC_ENABLED=true`.
    BossApiKeyAuth:
      type: apiKey
      in: header
      name: X-BOSS-API-Key
      description: Alternate API key header accepted when `BOSS_REQUIRE_API_AUTH=true`.
    scimBearerAuth:
      type: http
      scheme: bearer
      description: Enterprise SCIM provisioning token configured through `BOSS_ENTERPRISE_SCIM_BEARER_TOKENS`;
        separate from normal BOSS API keys.
  schemas:
    EventSubscription:
      type: object
      required:
      - id
      - project_id
      - event_type
      - sink_kind
      - sink_ref
      - data_boundary
      - enabled
      - config
      - created_at
      - updated_at
      properties:
        id:
          type: string
        project_id:
          type: string
        event_type:
          type: string
        sink_kind:
          type: string
          enum:
          - job
          - webhook_out
        sink_ref:
          type: string
        data_boundary:
          type: string
          enum:
          - public
          - internal
          - confidential
          - restricted
          - local-only
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
