          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        '200': { description: ChangeSets with policy result, quote, approval, and receipt expectations }
    post:
      summary: Create a quoted and policy-checked Resource Plane ChangeSet
      requestBody:
        required: true
