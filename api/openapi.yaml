openapi: 3.1.0
info:
  title: BOSS Control Plane API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
  /v1/status:
    get:
      summary: Executive status summary
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Status summary }
  /v1/commands/propose:
    post:
      summary: Submit a CEO command and create an intake task/job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, command]
              properties:
                project_id: { type: string }
                command: { type: string }
                constraints: { type: object }
      responses:
        '201': { description: Command accepted }
  /v1/tasks:
    get:
      summary: List tasks
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task list }
    post:
      summary: Create task
      responses:
        '201': { description: Created }
  /v1/jobs/{job_id}:
    get:
      summary: Get job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job }
        '404': { description: Job not found }
  /v1/tasks/{task_id}:
    get:
      summary: Get task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task }
  /v1/decisions/inbox:
    get:
      summary: List decisions for inbox with pending items first
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Decision cards }
  /v1/decisions/{decision_id}/approve:
    post:
      summary: Approve decision
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, default: executive_console }
                note: { type: string }
      responses:
        '200': { description: Approved }
        '404': { description: Decision not found }
        '409': { description: Invalid transition }
  /v1/decisions/{decision_id}/reject:
    post:
      summary: Reject decision
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, default: executive_console }
                note: { type: string }
      responses:
        '200': { description: Rejected }
        '404': { description: Decision not found }
        '409': { description: Invalid transition }
  /v1/jobs:
    post:
      summary: Create job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, kind]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                kind: { type: string }
                payload: { type: object }
                requires_reservation: { type: boolean, default: false }
                reservation_id: { type: string }
                priority: { type: integer, default: 100 }
                max_attempts: { type: integer, default: 3 }
                run_after_seconds: { type: integer, default: 0 }
      responses:
        '201': { description: Created }
  /v1/worker/poll:
    post:
      summary: Worker polls for leased job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, capabilities]
              properties:
                worker_id: { type: string }
                capabilities: { type: array, items: { type: string } }
                max_jobs: { type: integer, default: 1 }
                lease_ttl_seconds: { type: integer, default: 60 }
      responses:
        '200': { description: Job lease or empty response }
  /v1/worker/heartbeat:
    post:
      summary: Renew job lease heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, job_id, lease_token]
              properties:
                worker_id: { type: string }
                job_id: { type: string }
                lease_token: { type: string }
                lease_ttl_seconds: { type: integer, default: 60 }
      responses:
        '200': { description: Heartbeat accepted }
  /v1/worker/complete:
    post:
      summary: Complete leased job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, job_id, lease_token]
              properties:
                worker_id: { type: string }
                job_id: { type: string }
                lease_token: { type: string }
                result: { type: object }
      responses:
        '200': { description: Completion recorded }
  /v1/worker/fail:
    post:
      summary: Fail leased job and trigger retry or deadletter handling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, job_id, lease_token, error]
              properties:
                worker_id: { type: string }
                job_id: { type: string }
                lease_token: { type: string }
                error: { type: object }
                retryable: { type: boolean, default: true }
                retry_delay_seconds: { type: integer, default: 30 }
      responses:
        '200': { description: Completion recorded }
  /v1/budget/status:
    get:
      summary: Budget status for scope
      parameters:
        - name: scope_type
          in: query
          required: true
          schema: { type: string }
        - name: scope_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Budget status }
  /v1/budget/quote:
    post:
      summary: Quote a spend request against the active project budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, category, amount_usd_micros, reason]
              properties:
                project_id: { type: string }
                category: { type: string }
                amount_usd_micros: { type: integer }
                reason: { type: string }
      responses:
        '200': { description: Quote result }
  /v1/budget/reserve:
    post:
      summary: Internal budget reservation endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, category, amount_usd_micros, reason]
              properties:
                project_id: { type: string }
                category: { type: string }
                amount_usd_micros: { type: integer }
                reason: { type: string }
                job_id: { type: string }
                expires_in_minutes: { type: integer, default: 30 }
      responses:
        '201': { description: Reservation created or denied }
  /v1/budget/release:
    post:
      summary: Release an active reservation without consuming spend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, reason]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Reservation released or current status returned }
  /v1/openai/plans:
    post:
      summary: Create a real OpenAI-backed plan artifact behind a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, dedupe_key, prompt]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                prompt: { type: string }
                system_prompt: { type: string }
      responses:
        '200': { description: Plan artifact created, reused, or blocked }
  /v1/software-factory/proposals:
    post:
      summary: Create a real sandbox pull request proposal behind a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [project_id, reservation_id, dedupe_key, title, branch_name, summary, files]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                title: { type: string }
                branch_name: { type: string }
                summary: { type: string }
                files:
                  type: array
                  items:
                    type: object
                    required: [path, content]
                    properties:
                      path: { type: string }
                      content: { type: string }
      responses:
        '200': { description: Sandbox PR created, reused, or blocked }
  /v1/software-factory/proposals/queue:
    post:
      summary: Queue a real sandbox PR proposal for leased worker execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [project_id, reservation_id, dedupe_key, title, branch_name, summary, files]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                title: { type: string }
                branch_name: { type: string }
                summary: { type: string }
                priority: { type: integer, default: 50 }
                max_attempts: { type: integer, default: 3 }
                files:
                  type: array
                  items:
                    type: object
                    required: [path, content]
                    properties:
                      path: { type: string }
                      content: { type: string }
      responses:
        '201': { description: Proposal job queued }
  /v1/receipts/{dedupe_key}:
    get:
      summary: Get receipt by dedupe key
      parameters:
        - name: dedupe_key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Receipt }
  /v1/events:
    get:
      summary: Event feed
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Events }
