          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Outbox list including data_boundary classifications }
    post:
      summary: Create an outbox draft message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, channel, body, dedupe_key]
              properties:
                project_id: { type: string }
                channel:
                  type: string
                  description: "Provider-prefixed destination such as slack:#ops or email:founder@example.com"
                subject: { type: string }
                body: { type: string }
                data_boundary:
                  type: string
                  default: internal
                  enum: [public, internal, confidential, restricted, local-only]
                dedupe_key: { type: string }
                actor: { type: string, default: executive_console }
      responses:
        '201': { description: Outbox draft created with data_boundary classification }
  /v1/comms/outbox/{message_id}/queue:
    post:
      summary: Queue a receipt-gated outbound communication job
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, reservation_id, dedupe_key]
              properties:
                project_id: { type: string }
                reservation_id: { type: string }
                dedupe_key: { type: string }
                actor: { type: string, default: executive_console }
                priority: { type: integer, default: 25 }
                max_attempts: { type: integer, default: 3 }
                urgency:
                  type: string
                  default: normal
                  enum: [low, normal, urgent]
                  description: "Non-urgent deliveries can be deferred by quiet-hours or throttle policy; urgent deliveries bypass those scheduling deferrals."
      responses:
        '201': { description: Communication job queued with inherited data_boundary classification and optional quiet-hours/throttle deferral }
        '404': { description: Outbox message not found }
