  /v1/entitlements/sources:
    get:
      summary: List configured entitlement sources for a project
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Entitlement source list
    post:
      summary: Register or update an entitlement source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - provider
              - source_id
              - source_kind
              - entitlement_kind
              - owner_type
              - owner_id
              properties:
                project_id:
                  type: string
                provider:
                  type: string
                source_id:
                  type: string
                source_kind:
                  type: string
                  enum:
                  - official_cli
                  - official_coding_agent
                  - official_api
                  - approved_local_model
                entitlement_kind:
                  type: string
                  enum:
                  - subscription
                  - usage_based_api
                  - licensed_seat
                  - local_capacity
                owner_type:
                  type: string
                owner_id:
                  type: string
                workload_classes_allowed:
                  type: array
                  items:
                    type: string
                multi_tenant_allowed:
                  type: boolean
                  default: false
                credential_ref:
                  type: string
                credential_secret_ref_id:
                  type: string
                  description: Opaque SecretRef identifier; never credential material.
                cost_mode:
                  type: string
                limit_shape:
                  type: object
                supported_models:
                  type: array
                  items:
                    type: string
                task_strengths:
                  type: array
                  items:
                    type: string
                risk_tier_max:
                  type: integer
                  default: 1
                status:
                  type: string
                  default: declared
                auth_method:
                  type: string
                  default: api_key
                  enum:
                  - api_key
                  - official_cli_oauth
                  - official_device_oauth
                  - official_browser_oauth
                  - local_host
                connection_status:
                  type: string
                  default: not_connected
                  enum:
                  - not_connected
                  - connected
                  - expired
                  - revoked
                  - unsupported
                connection_ref:
                  type: string
                oauth_scopes:
                  type: array
                  items:
                    type: string
                connection_metadata:
                  type: object
                policy_notes:
                  type: array
                  items:
                    type: string
                observed_capacity:
                  type: object
                runtime_supported:
                  type: boolean
                  default: false
                actor:
                  type: string
                  default: system
      responses:
        '201':
          description: Entitlement source upserted with auth method and connection state
  /v1/entitlement-connection-sessions:
    get:
      summary: List durable official model-subscription connection sessions for a project
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: source_id
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Connection-session history with official login instructions and completion state
        '400':
          description: Invalid limit
  /v1/entitlements/sources/{source_id}/connection-sessions:
    post:
      summary: Start a durable official-session connection attempt for a public model subscription source
      description: Creates an audit record with official provider login instructions. BOSS does not scrape
        provider UIs or store raw OAuth tokens.
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                connection_mode:
                  type: string
                  description: One of the provider-declared official modes, such as browser_oauth or device_oauth.
                requested_scopes:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                  description: Non-secret operator/local-runner context for the connection attempt.
                actor:
                  type: string
                  default: system
      responses:
        '201':
          description: Connection session created with operator-action instructions
        '404':
          description: Entitlement source not found
        '422':
          description: Source is not an official OAuth-backed subscription source or has invalid connection
            mode
  /v1/entitlements/sources/{source_id}/connect:
    post:
      summary: Record a verified official OAuth/session connection for an entitlement source
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - connection_ref
              properties:
                project_id:
                  type: string
                connection_ref:
                  type: string
                  description: SecretRef or local official-session reference; never a raw OAuth token.
                auth_method:
                  type: string
                  enum:
                  - api_key
                  - official_cli_oauth
                  - official_device_oauth
                  - official_browser_oauth
                  - local_host
                oauth_scopes:
                  type: array
                  items:
                    type: string
                connection_metadata:
                  type: object
                  description: Non-secret metadata such as official login command or local runner id.
                observed_capacity:
                  type: object
                  description: Operator/provider observed capacity such as capacity_state, remaining_units,
                    reset_at, observed_at.
                actor:
                  type: string
                  default: system
      responses:
        '200':
          description: Entitlement source connected and event recorded
        '404':
          description: Entitlement source not found
        '422':
          description: Subscription source requires an official OAuth connection method
  /v1/entitlement-connection-sessions/{session_id}/complete:
    post:
      summary: Complete an official model-subscription connection session with a SecretRef or local session
        reference
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - connection_ref
              properties:
                project_id:
                  type: string
                connection_ref:
                  type: string
                  description: SecretRef or local official-session reference; never a raw OAuth token.
                oauth_scopes:
                  type: array
                  items:
                    type: string
                connection_metadata:
                  type: object
                  description: Non-secret verification metadata from the operator or local runner.
                observed_capacity:
                  type: object
                  description: Observed capacity state after the official login completed.
                actor:
                  type: string
                  default: system
      responses:
        '200':
          description: Connection session completed and entitlement source connected
        '404':
          description: Connection session not found
        '422':
          description: Session is expired
          already completed: null
          or otherwise not completable: null
  /v1/entitlements/sources/{source_id}/disconnect:
    post:
      summary: Revoke the local official-session reference for an entitlement source
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                reason:
                  type: string
                actor:
                  type: string
                  default: system
      responses:
        '200':
          description: Entitlement source disconnected and event recorded
        '404':
          description: Entitlement source not found
  /v1/router/preview:
    post:
      summary: Preview entitlement-based model routing and persist a routing log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - skill_id
              - task_kind
              - workload_class
              properties:
                project_id:
                  type: string
                skill_id:
                  type: string
                task_kind:
                  type: string
                workload_class:
                  type: string
                risk_tier:
                  type: integer
                  default: 1
                data_boundary:
                  type: string
                  default: internal
                  enum:
                  - public
                  - internal
                  - confidential
                  - restricted
                  - local-only
                preferred_capabilities:
                  type: array
                  items:
                    type: string
                budget_state:
                  type: string
                actor:
                  type: string
                  default: system
      responses:
        '200':
          description: Routing decision with persisted data-boundary, auth, connection, and capacity policy
            result
        '404':
          description: Skill not found
  /v1/router/logs:
    get:
      summary: List recent routing logs for a project
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: Routing log list including data_boundary classifications
  /v1/secret-refs:
    get:
      summary: List SecretRef metadata records for a project
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: provider
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: SecretRef list without secret material
    post:
      summary: Create a SecretRef metadata record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - ref_kind
              - ref_key
              properties:
                project_id:
                  type: string
                ref_kind:
                  type: string
                  enum:
                  - env
                  - vault
                  - local_runner
                  - platform_secret_store
                ref_key:
                  type: string
                provider:
                  type: string
                scope_type:
                  type: string
                  enum:
                  - org
                  - workspace
                  - project
                  default: project
                scope_id:
                  type: string
                secret_kind:
                  type: string
                  enum:
                  - api_token
                  - access_key
                  - client_secret
                  - consumer_key
                  - private_key
                  - service_account
                  - session
                  default: api_token
                storage_backend:
                  type: string
                  enum:
                  - environment
                  - vault
                  - local_runner
                  - platform_secret_store
                rotation_due_at:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum:
                  - active
                  - disabled
                  - rotating
                  - rotation_due
                  - revoked
                  default: active
                metadata:
                  type: object
                actor:
                  type: string
                  default: system
      responses:
        '201':
          description: SecretRef created
        '403':
          description: Actor lacks providerops_manage permission
        '422':
          description: Invalid SecretRef payload
  /v1/secret-refs/{secret_ref_id}:
    get:
      summary: Get a SecretRef metadata record
      parameters:
      - name: secret_ref_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SecretRef detail
        '404':
          description: SecretRef not found
    patch:
      summary: Update SecretRef metadata or status
      parameters:
      - name: secret_ref_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                provider:
                  type: string
                status:
                  type: string
                  enum:
                  - active
                  - disabled
                  - rotating
                  - rotation_due
                  - revoked
                metadata:
                  type: object
                rotation_due_at:
                  type: string
                  format: date-time
                actor:
                  type: string
                  default: system
      responses:
        '200':
          description: SecretRef updated
        '404':
          description: SecretRef not found
    delete:
      summary: Revoke a SecretRef metadata record
      parameters:
      - name: secret_ref_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: actor
        in: query
        required: false
        schema:
          type: string
          default: system
      responses:
        '204':
          description: SecretRef revoked
        '404':
          description: SecretRef not found
  /v1/github/easy-connect:
    post:
      summary: Easy project GitHub connect (env SecretRef + connection + optional repo link)
      description: 'One-shot setup for linking GitHub to a BOSS project. Creates an env SecretRef for
        the named credential environment variable (never raw tokens), registers a project GitHub connection
        (PAT or GitHub App), optionally binds owner/repo, and can run a receipted connection test. Use
        Mission Control "Connect GitHub" form or this API for self-managed / community BYOK dogfood.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              properties:
                project_id:
                  type: string
                connection_label:
                  type: string
                  default: Project GitHub
                auth_method:
                  type: string
                  enum:
                  - github_app
                  - personal_access_token
                  default: personal_access_token
                env_credential_key:
                  type: string
                  default: BOSS_GITHUB_TOKEN
                  description: Runtime environment variable name holding the PAT or App private key
                app_id:
                  type: string
                installation_id:
                  type: string
                api_base_url:
                  type: string
                  default: https://api.github.com
                required_permissions:
                  type: array
                  items:
                    type: string
                repository:
                  type: string
                  description: Optional owner/repo to bind to the project
                role:
                  type: string
                  enum:
                  - primary
                  - source
                  - upstream
                  - mirror
                  default: primary
                test_after_link:
                  type: boolean
                  default: true
                metadata:
                  type: object
                actor:
                  type: string
                  default: ceo
      responses:
        '201':
          description: Connection created; optional binding and test included
          content:
            application/json:
              schema:
                type: object
                required:
                - connection
                - credential_ref
                properties:
                  connection:
                    type: object
                  repository_binding:
                    type: object
                    nullable: true
                  test:
                    type: object
                    nullable: true
                  credential_ref:
                    type: string
        '403':
          description: Actor lacks github_manage permission
        '422':
          description: Invalid env key
          SecretRef: null
          auth method: null
          or repository: null
  /v1/github/connections:
    get:
      summary: List project-scoped GitHub connections
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: GitHub connections without SecretRef pointers or secret material
    post:
      summary: Register a project-scoped GitHub App or PAT connection
      description: Stores only a validated SecretRef pointer plus non-secret installation identity. Raw
        tokens and private keys are rejected from metadata and omitted from responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - connection_label
              - auth_method
              - credential_ref
              properties:
                project_id:
                  type: string
                connection_label:
                  type: string
                auth_method:
                  type: string
                  enum:
                  - github_app
                  - personal_access_token
                credential_ref:
                  type: string
                  description: Project-scoped SecretRef pointer; never raw credential material.
                app_id:
                  type: string
                installation_id:
                  type: string
                api_base_url:
                  type: string
                  format: uri
                  default: https://api.github.com
                required_permissions:
                  type: array
                  default:
                  - pull
                  items:
                    type: string
                    enum:
                    - pull
                    - triage
                    - push
                    - maintain
                    - admin
                metadata:
                  type: object
                  description: Non-secret connection metadata; secret-shaped fields are rejected.
                actor:
                  type: string
                  default: ceo
      responses:
        '201':
          description: GitHub connection configured
        '403':
          description: Actor lacks github_manage permission
        '422':
          description: Invalid auth method
          SecretRef: null
          permissions: null
          URL: null
          or secret-shaped metadata: null
  /v1/github/connections/{connection_id}:
    get:
      summary: Get a tenant-scoped GitHub connection
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: GitHub connection posture without credential pointer or secret material
        '404':
          description: GitHub connection not found in the project
  /v1/github/connections/{connection_id}/repositories:
    get:
      summary: List repositories visible to a project GitHub connection
      description: 'PAT-backed connections only. Returns owner/repo candidates for linking to the project
        without requiring operators to type names from memory. Does not return credential material.

        '
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Accessible repository list
        '404':
          description: Connection not found
        '409':
