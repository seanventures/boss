          schema: { type: integer, default: 20 }
      responses:
        '200': { description: Infrastructure resource list }
  /v1/infra/resources/{resource_id}/terminate:
    post:
      summary: Terminate a provisioned sandbox resource through a receipt-backed adapter
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, dedupe_key]
              properties:
                project_id: { type: string }
                dedupe_key: { type: string }
                actor: { type: string, default: release_manager }
                reason: { type: string }
                created_by_job_id: { type: string }
      responses:
        '200': { description: Infrastructure termination created, reused, blocked, or failed }
        '403': { description: Actor is not allowed to terminate infrastructure }
        '404': { description: Infrastructure resource not found }
        '422': { description: Invalid infrastructure termination request }
  /v1/infra/resources/{resource_id}/terminate/queue:
    post:
      summary: Queue infrastructure termination for leased worker execution
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, dedupe_key]
              properties:
                project_id: { type: string }
                dedupe_key: { type: string }
                actor: { type: string, default: release_manager }
                reason: { type: string }
                priority: { type: integer, default: 10 }
                max_attempts: { type: integer, default: 1 }
      responses:
        '201': { description: Infrastructure termination job queued }
        '403': { description: Actor is not allowed to queue infrastructure termination }
        '404': { description: Infrastructure resource not found }
        '422': { description: Invalid infrastructure termination job request }
  /v1/infra/janitor/run:
    post:
      summary: Queue termination jobs for expired TTL-managed infrastructure resources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                actor: { type: string, default: system }
                limit: { type: integer, default: 20 }
      responses:
        '200': { description: TTL janitor run queued or no-op }
        '403': { description: Actor is not allowed to run the infrastructure janitor }
  /v1/receipts/{dedupe_key}:
    get:
      summary: Get receipt by dedupe key
      parameters:
        - name: dedupe_key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Receipt including data_boundary classification }
  /v1/receipts:
    get:
      summary: List receipts for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Receipt list including data_boundary classifications }
  /v1/change-journal:
    get:
      summary: List change artifacts with normalized diff and rollback metadata
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        '200': { description: Change journal items backed by durable artifacts }
  /v1/change-journal/{artifact_id}:
    get:
      summary: Get change artifact detail and diff content
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Change journal detail with artifact content }
        '404': { description: Change artifact not found for project }
  /v1/audit/export:
    get:
      summary: Export a reconstructable audit chain
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: task_id
          in: query
          required: false
          schema: { type: string }
        - name: decision_id
          in: query
          required: false
          schema: { type: string }
        - name: job_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Audit export including data_boundary classifications for tasks, jobs, artifacts, and receipts }
        '404': { description: Unknown project }
  /v1/audit/replay-bundles:
    post:
      summary: Create a replay-bundle artifact from the current audit chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                task_id: { type: string }
                decision_id: { type: string }
                job_id: { type: string }
                actor: { type: string, default: system }
      responses:
        '201': { description: Replay bundle created }
        '404': { description: Unknown project }
  /v1/compliance/evidence-bundles:
    post:
      summary: Create a compliance evidence artifact for access, budget, effects, and policy controls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                actor: { type: string, default: ceo }
                period_start: { type: string, format: date-time }
                period_end: { type: string, format: date-time }
      responses:
        '201': { description: Compliance evidence bundle created }
        '403': { description: Actor is not allowed to create evidence bundles }
        '404': { description: Unknown project }
  /v1/events:
    get:
      summary: Event feed
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Events }
  /v1/deadletters:
    get:
      summary: Deadletter feed
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: Deadletters }
components:
  securitySchemes:
    BossBearerAuth:
      type: http
      scheme: bearer
      description: Set when `BOSS_REQUIRE_API_AUTH=true`.
    BossApiKeyAuth:
      type: apiKey
      in: header
      name: X-BOSS-API-Key
      description: Alternate API key header accepted when `BOSS_REQUIRE_API_AUTH=true`.
