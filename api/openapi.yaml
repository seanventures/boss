openapi: 3.1.0
info:
  title: BOSS Control Plane API
  version: 0.1.0
security:
  - BossBearerAuth: []
  - BossApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: OK }
  /v1/projects:
    get:
      summary: List projects available to the current control-plane client
      responses:
        '200': { description: Project list }
  /v1/auth/session:
    get:
      summary: Inspect transport authentication and API-key principal binding
      responses:
        '200': { description: Auth session and principal binding state }
  /v1/members:
    get:
      summary: List active project members and system actors
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Project member directory }
    post:
      summary: Create or update a project member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, member_id, display_name, role_keys, permissions]
              properties:
                project_id: { type: string }
                member_id: { type: string }
                display_name: { type: string }
                member_type: { type: string, default: human }
                role_keys:
                  type: array
                  items: { type: string }
                permissions:
                  type: array
                  items: { type: string }
                actor: { type: string, default: ceo }
      responses:
        '201': { description: Project member upserted }
        '403': { description: Actor is not allowed to manage members }
  /v1/members/{member_id}:
    get:
      summary: Get an active project member
      parameters:
        - name: member_id
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Project member }
        '404': { description: Member not found }
  /v1/break-glass/grants:
    get:
      summary: List break-glass access grants
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: include_expired
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200': { description: Break-glass grant list }
    post:
      summary: Grant temporary break-glass access with TTL and postmortem task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, target_member_id, reason, granted_permissions]
              properties:
                project_id: { type: string }
                target_member_id: { type: string }
                reason: { type: string }
                scope: { type: object }
                granted_permissions:
                  type: array
                  items: { type: string }
                ttl_minutes: { type: integer, default: 60 }
                actor: { type: string, default: ceo }
      responses:
        '201': { description: Break-glass grant created }
        '403': { description: Actor is not allowed to grant emergency access }
  /v1/break-glass/grants/{grant_id}/revoke:
    post:
      summary: Revoke an active break-glass grant
      parameters:
        - name: grant_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                actor: { type: string, default: ceo }
                reason: { type: string }
      responses:
        '200': { description: Break-glass grant revoked }
        '404': { description: Break-glass grant not found }
  /v1/status:
    get:
      summary: Executive status summary
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Status summary }
  /v1/metatron/query:
    post:
      summary: Ask Metatron for a scoped, freshness-stamped status answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, question]
              properties:
                project_id: { type: string }
                question: { type: string }
                task_id: { type: string }
                decision_id: { type: string }
                limit: { type: integer, default: 5 }
      responses:
        '200': { description: Metatron answer with references }
        '404': { description: Unknown project, task, or decision scope }
  /v1/health-snapshots:
    get:
      summary: List recent health snapshots for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        '200': { description: Health snapshot list }
  /v1/health-snapshots/refresh:
    post:
      summary: Persist a fresh health snapshot for the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                actor: { type: string, default: metatron }
      responses:
        '201': { description: Health snapshot created }
  /v1/commands/propose:
    post:
      summary: Submit a CEO command and create an intake task/job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, command]
              properties:
                project_id: { type: string }
                command: { type: string }
                constraints: { type: object }
                actor: { type: string, default: executive_console }
      responses:
        '201': { description: Command accepted }
        '403': { description: Actor is not allowed to submit commands }
  /v1/tasks:
    get:
      summary: List tasks
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task list }
    post:
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title, dedupe_key]
              properties:
                project_id: { type: string }
                title: { type: string }
                description: { type: string }
                owner_role_id:
                  type: string
                  description: Role id or role key responsible for the task.
                parent_task_id:
                  type: string
                  description: Parent task id in the initiative/task hierarchy.
                dependency_task_ids:
                  type: array
                  items: { type: string }
                  description: Same-project task ids that must be considered dependencies.
                due_at:
                  type: string
                  format: date-time
                priority: { type: string, default: p2 }
                risk_tier: { type: integer, default: 1 }
                data_boundary:
                  type: string
                  default: internal
                  enum: [public, internal, confidential, restricted, local-only]
                dedupe_key: { type: string }
                inputs: { type: object }
                required_artifacts:
                  type: array
                  items: { type: string }
                actor: { type: string, default: executive_console }
      responses:
        '201': { description: Created }
        '403': { description: Actor is not allowed to create tasks }
  /v1/departments:
    get:
      summary: List canonical departments for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Department list }
    post:
      summary: Create or update a canonical department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, department_key, name, mission]
              properties:
                project_id: { type: string }
                department_key: { type: string }
                name: { type: string }
                mission: { type: string }
                actor: { type: string, default: ceo }
      responses:
        '201': { description: Department created or updated }
  /v1/policies:
    get:
      summary: List canonical policy records for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Policy record list }
    post:
      summary: Create or update a canonical policy record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, policy_key, title, body]
              properties:
                project_id: { type: string }
                policy_key: { type: string }
                version: { type: integer, default: 1 }
                title: { type: string }
                body: { type: object }
                actor: { type: string, default: ceo }
      responses:
        '201': { description: Policy record created or updated }
  /v1/plans:
    get:
      summary: List canonical plans for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Plan list }
    post:
      summary: Create a canonical plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title, objective]
              properties:
                project_id: { type: string }
                title: { type: string }
                objective: { type: string }
                task_id: { type: string }
                phases: { type: array, items: {} }
                success_criteria: { type: array, items: {} }
                risks: { type: array, items: {} }
                artifact_id: { type: string }
                actor: { type: string, default: ceo }
      responses:
        '201': { description: Plan created }
  /v1/meetings:
    get:
      summary: List canonical meetings for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Meeting list }
    post:
      summary: Create a canonical meeting record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title, purpose]
              properties:
                project_id: { type: string }
                title: { type: string }
                purpose: { type: string }
                participants:
                  type: array
                  items: { type: string }
                agenda:
                  type: array
                  items: { type: string }
                actor: { type: string, default: ceo }
      responses:
        '201': { description: Meeting created }
  /v1/jobs/{job_id}:
    get:
      summary: Get job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job summary including data_boundary classification }
        '404': { description: Job not found }
  /v1/tasks/{task_id}:
    get:
      summary: Get task
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task summary including data_boundary classification }
  /v1/self-improvement/proposals:
    get:
      summary: List self-improvement proposals for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        '200': { description: Self-improvement proposal list }
    post:
      summary: Create a governed self-improvement proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [project_id, title, summary, change_ref, diff_summary, expected_impact, test_plan, canary_scope, rollback_plan, success_metrics]
              properties:
                project_id: { type: string }
                title: { type: string }
                summary: { type: string }
                change_ref: { type: string }
                diff_summary: { type: string }
                expected_impact:
                  type: array
                  items: { type: string }
                test_plan:
                  type: array
                  items: { type: string }
                canary_scope:
                  type: array
                  items: { type: string }
                rollback_plan:
                  type: array
                  items: { type: string }
                success_metrics:
                  type: array
                  items: { type: string }
                actor: { type: string, default: vp_agents }
                risk_tier: { type: integer, default: 2 }
      responses:
        '201': { description: Self-improvement proposal created }
        '422': { description: Missing required change-control evidence }
  /v1/self-improvement/proposals/{proposal_id}:
    get:
      summary: Get self-improvement proposal detail
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Self-improvement proposal detail }
        '404': { description: Proposal not found }
  /v1/self-improvement/proposals/{proposal_id}/canary:
    post:
      summary: Record the result of a self-improvement canary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, summary, metrics, evidence_refs]
              properties:
                actor: { type: string, default: release_manager }
                outcome: { type: string }
                summary: { type: string }
                metrics: { type: object }
                evidence_refs:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Canary result recorded }
        '404': { description: Proposal not found }
        '409': { description: Invalid proposal state }
        '422': { description: Missing required canary evidence }
  /v1/self-improvement/proposals/{proposal_id}/rollout:
    post:
      summary: Record rollout of an approved self-improvement change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary, metrics, evidence_refs]
              properties:
                actor: { type: string, default: release_manager }
                summary: { type: string }
                external_ref: { type: string }
                metrics: { type: object }
                evidence_refs:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Rollout recorded }
        '404': { description: Proposal not found }
        '409': { description: Invalid proposal state }
        '422': { description: Missing required rollout evidence }
  /v1/self-improvement/proposals/{proposal_id}/rollback:
    post:
      summary: Record rollback of a self-improvement rollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, metrics, evidence_refs]
              properties:
                actor: { type: string, default: release_manager }
                reason: { type: string }
                external_ref: { type: string }
                metrics: { type: object }
                evidence_refs:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Rollback recorded }
        '404': { description: Proposal not found }
        '409': { description: Invalid proposal state }
        '422': { description: Missing required rollback evidence }
  /v1/artifacts:
    get:
      summary: List artifacts
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        '200': { description: Artifact list including data_boundary classifications }
  /v1/artifacts/{artifact_id}:
    get:
      summary: Get artifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Artifact detail including data_boundary classification }
        '404': { description: Artifact not found }
  /v1/roles:
    get:
      summary: List installed roles for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Role list }
  /v1/roles/{role_key}:
    get:
      summary: Get installed role detail
      parameters:
        - name: role_key
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Role detail }
        '404': { description: Role not found }
  /v1/roles/{role_key}/governance:
    get:
      summary: Get governance state for an installed role
      parameters:
        - name: role_key
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Role governance detail }
        '404': { description: Role not found }
  /v1/roles/{role_key}/reviews:
    post:
      summary: Record a governance review for an installed role
      parameters:
        - name: role_key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, summary, metrics, evidence_refs]
              properties:
                project_id: { type: string }
                actor: { type: string, default: vp_agents }
                summary: { type: string }
                metrics:
                  type: object
                  additionalProperties: true
                evidence_refs:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Role governance detail after the review }
        '404': { description: Role not found }
        '422': { description: Review payload is invalid }
  /v1/roles/{role_key}/autonomy/check:
    post:
      summary: Check whether a role's autonomy level permits an action
      parameters:
        - name: role_key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, action]
              properties:
                project_id: { type: string }
                actor: { type: string, default: system }
                action: { type: string }
                risk_tier: { type: integer, minimum: 0, maximum: 3, default: 0 }
                sandboxed: { type: boolean, default: false }
                policy_approved: { type: boolean, default: false }
      responses:
        '200':
          description: Autonomy check result
          content:
            application/json:
              schema:
                type: object
                required:
                  - project_id
                  - role_key
                  - allowed
                  - reason
                  - action
                  - required_capability
                  - risk_tier
                  - sandboxed
                  - policy_approved
                  - current_level
                  - allowed_capabilities
                  - trust_score
                properties:
                  project_id: { type: string }
                  role_key: { type: string }
                  allowed: { type: boolean }
                  reason: { type: string }
                  action: { type: string }
                  required_capability: { type: string }
                  risk_tier: { type: integer }
                  sandboxed: { type: boolean }
                  policy_approved: { type: boolean }
                  current_level: { type: integer }
                  required_level:
                    type: integer
                    nullable: true
                  allowed_capabilities:
                    type: array
                    items: { type: string }
                  trust_score: { type: integer }
        '404': { description: Role not found }
        '422': { description: Autonomy check payload is invalid }
  /v1/roles/{role_key}/scope/check:
    post:
      summary: Check RoleSpec scope and record drift if an action is out of scope
      parameters:
        - name: role_key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, action]
              properties:
                project_id: { type: string }
                actor: { type: string, default: system }
                action: { type: string }
                skill_id: { type: string }
                evidence_ref: { type: string }
      responses:
        '200': { description: Role scope check result with trust/autonomy impact }
        '403': { description: Actor is not allowed to review roles }
        '404': { description: Role not found }
        '422': { description: Invalid role scope check request }
  /v1/packs:
    get:
      summary: List available packs with install status for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pack list }
  /v1/packs/{pack_id}:
    get:
      summary: Get pack detail for a project
      parameters:
        - name: pack_id
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Pack detail }
        '404': { description: Pack not found }
  /v1/packs/install:
    post:
      summary: Install a spec-backed company pack into a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, pack_id]
              properties:
                project_id: { type: string }
                pack_id: { type: string }
                actor: { type: string, default: system }
      responses:
        '201': { description: Pack installed }
        '404': { description: Pack not found }
        '422': { description: Invalid pack or role spec }
  /v1/agent-modules:
    get:
      summary: List packaged agent modules with install status for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Agent module list }
  /v1/agent-modules/{module_id}:
    get:
      summary: Get packaged agent-module detail for a project
      parameters:
        - name: module_id
          in: path
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Agent module detail }
        '404': { description: Agent module not found }
  /v1/agent-modules/install:
    post:
      summary: Install a packaged agent module into a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, module_id]
              properties:
                project_id: { type: string }
                module_id: { type: string }
                actor: { type: string, default: system }
                config:
                  type: object
                  additionalProperties: true
      responses:
        '201': { description: Agent module installed }
        '404': { description: Agent module not found }
  /v1/skills:
    get:
      summary: List registered control-plane skills from specpack
      responses:
        '200':
          description: Skill list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - kind
                        - risk_tier
                        - description
                        - mock_mode
                        - input_schema
                        - output_schema
                        - cost
                        - retry
                        - permissions
                        - data_boundary
                        - policy
                      properties:
                        id: { type: string }
                        kind: { type: string }
                        risk_tier: { type: integer }
                        description: { type: string }
                        mock_mode: { type: boolean }
                        input_schema: { type: object }
                        output_schema: { type: object }
                        cost: { type: object }
                        retry: { type: object }
                        permissions: { type: object }
                        data_boundary: { type: string }
                        policy: { type: object }
  /v1/entitlements/sources:
    get:
      summary: List configured entitlement sources for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Entitlement source list }
    post:
      summary: Register or update an entitlement source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, provider, source_id, source_kind, entitlement_kind, owner_type, owner_id]
      responses:
        '201': { description: Entitlement source upserted }
  /v1/router/preview:
    post:
      summary: Preview entitlement-based model routing and persist a routing log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, skill_id, task_kind, workload_class]
              properties:
                project_id: { type: string }
                skill_id: { type: string }
                task_kind: { type: string }
                workload_class: { type: string }
                risk_tier: { type: integer, default: 1 }
                data_boundary:
                  type: string
                  default: internal
                  enum: [public, internal, confidential, restricted, local-only]
                preferred_capabilities:
                  type: array
                  items: { type: string }
                budget_state: { type: string }
                actor: { type: string, default: system }
      responses:
        '200': { description: Routing decision with persisted data_boundary policy result }
        '404': { description: Skill not found }
  /v1/router/logs:
    get:
      summary: List recent routing logs for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 25 }
      responses:
        '200': { description: Routing log list including data_boundary classifications }
  /v1/comms/outbox:
    get:
      summary: List outbound communication records for a project
      parameters:
        - name: project_id
