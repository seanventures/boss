                  type: string
                worker_id:
                  type: string
                job_lease_token:
                  type: string
                  writeOnly: true
                agent_id:
                  type: string
                skill_id:
                  type: string
                preferred_capabilities:
                  type: array
                  items:
                    type: string
                risk_tier:
                  type: integer
                  minimum: 0
                  maximum: 3
                  default: 1
                consumer_owner_id:
                  type: string
                estimated_cost_usd_micros:
                  type: integer
                  minimum: 0
                  default: 0
                max_usage:
                  type: object
                dedupe_key:
                  type: string
                ttl_seconds:
                  type: integer
                  minimum: 30
                  maximum: 3600
                  default: 300
      responses:
        '201':
          description: Opaque model lease token plus non-secret route
          source: null
          fence: null
          budget: null
          and expiry data: null
        '409':
          description: Job lease invalid
