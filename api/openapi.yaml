              required: [project_id, action]
              properties:
                project_id: { type: string }
                actor: { type: string, default: system }
                action: { type: string }
                skill_id: { type: string }
                evidence_ref: { type: string }
      responses:
        '200': { description: Role scope check result with trust/autonomy impact }
        '403': { description: Actor is not allowed to review roles }
        '404': { description: Role not found }
        '422': { description: Invalid role scope check request }
  /v1/packs:
    get:
