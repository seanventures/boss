site_name: BOSS
site_description: The self-hosted control plane for AI software work
site_url: https://boss.sean.network/docs/
repo_url: https://github.com/seanventures/boss
repo_name: seanventures/boss
docs_dir: docs/community
strict: true
copyright: BOSS Community is licensed under the Apache License 2.0.

theme:
  name: material
  language: en
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light

extra:
  generator: false
  homepage: https://boss.sean.network/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Get started:
      - Getting started: GETTING_STARTED.md
      - Quickstart: QUICKSTART.md
      - Deploy: hostname.md
      - Deploy an app: DEPLOY_A_STACK.md
      - Sign in: CONSOLE_AUTH.md
      - Connect models: MODEL_CONNECTIONS.md
      - Use cases: use-cases.md
      - Walkthroughs: walkthroughs.md
  - Interfaces:
      - Overview: interfaces.md
      - Metatron terminal: terminal.md
      - Terminal and API reference: TERMINAL_API.md
      - MCP: MCP.md
      - CLI: cli.md
      - Remote API: remote-api.md
      - Grok CLI: GROK_CLI.md
  - Reference:
      - Features: FEATURES.md
      - Control surfaces: CONTROL_SURFACES.md
      - Terminal capability matrix: TERMINAL_CAPABILITY_MATRIX.md
  - Community:
      - Feedback: FEEDBACK_LOOP.md
      - Publishing the docs: publishing.md

plugins:
  - search
