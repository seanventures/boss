site_name: BOSS
site_description: A self-hosted control plane for AI software work. A person reviews the plan, the result, and the cost.
site_url: https://boss.sean.network/docs/
repo_url: https://github.com/seanventures/boss
repo_name: seanventures/boss
docs_dir: docs/community
strict: true
copyright: BOSS Community is licensed under the Apache License 2.0.

theme:
  name: material
  language: en
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light

extra:
  generator: false
  homepage: https://boss.sean.network/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Start:
      - The path: QUICKSTART.md
      - Your hostname: hostname.md
  - Do the work:
      - First change: FIRST_USEFUL_CHANGE.md
      - Review a result: RESULT_REVIEW.md
      - Return to it: RETURNING_TO_WORK.md
      - The work agreement: WORK_AGREEMENT.md
      - Reuse accepted checks: ACCEPTANCE_CHECKS.md
  - Govern:
      - People and access: PEOPLE_AND_ACCESS.md
      - Spend and approvals: ARCHITECTURE_GOVERNANCE.md
      - Sign-in setup: SIGN_IN_SETUP.md
      - Sign in: CONSOLE_AUTH.md
      - Upgrade to named accounts: IDENTITY_UPGRADE.md
      - Identity administration: IDENTITY_ADMIN.md
      - Agents and access: AGENTS_AND_ACCESS.md
      - Build sandbox: SANDBOX.md
      - Conversation costs and retries: CONVERSATION_STREAMS.md
      - Provider apply and recovery: PROVIDER_RECOVERY.md
      - Restored data and startup holds: RESTORED_STATE_HOLD.md
      - Historical financial exposure: LEGACY_FINANCIAL_HOLD.md
  - Connect:
      - Interfaces: interfaces.md
      - GitHub: CONNECT_GITHUB.md
      - Models: MODEL_CONNECTIONS.md
      - Terminal: terminal.md
      - Terminal and API: TERMINAL_API.md
      - MCP: MCP.md
      - CLI: cli.md
      - Grok CLI: GROK_CLI.md
      - Remote API: remote-api.md
      - Email: EMAIL.md
      - Workflow webhooks: WORKFLOW_WEBHOOKS.md
  - Reference:
