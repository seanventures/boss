site_name: BOSS
site_description: Delegate one useful software change with plans, decisions, cost evidence and a work history you can inspect
site_url: https://boss.sean.network/docs/
repo_url: https://github.com/seanventures/boss
repo_name: seanventures/boss
docs_dir: docs/community
strict: true
copyright: BOSS Community is licensed under the Apache License 2.0.

theme:
  name: material
  language: en
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light

extra:
  generator: false
  homepage: https://boss.sean.network/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Get started:
      - First useful change: FIRST_USEFUL_CHANGE.md
      - Review the work agreement: WORK_AGREEMENT.md
      - Review a result (RC9): RESULT_REVIEW.md
      - Return to work (RC9): RETURNING_TO_WORK.md
      - Reuse accepted checks (RC9): ACCEPTANCE_CHECKS.md
      - Getting started: GETTING_STARTED.md
      - Quickstart: QUICKSTART.md
      - Deploy: hostname.md
      - Deploy an app: DEPLOY_A_STACK.md
      - Sign in: CONSOLE_AUTH.md
      - Upgrade to named accounts: IDENTITY_UPGRADE.md
  - People and access:
      - People and access: PEOPLE_AND_ACCESS.md
      - Sign-in setup: SIGN_IN_SETUP.md
      - Agents and access: AGENTS_AND_ACCESS.md
      - Build sandbox: SANDBOX.md
      - Architecture approval and spending: ARCHITECTURE_GOVERNANCE.md
      - Build toolchains: TOOLCHAINS.md
      - Supported stacks: SUPPORTED_STACKS.md
      - Hearing an agent's voice: AGENT_VOICE_TESTS.md
      - Conversation costs and retries: CONVERSATION_STREAMS.md
      - Provider apply and recovery: PROVIDER_RECOVERY.md
      - Restored data and startup holds: RESTORED_STATE_HOLD.md
      - Historical financial exposure: LEGACY_FINANCIAL_HOLD.md
      - Identity administration: IDENTITY_ADMIN.md
      - Connect models: MODEL_CONNECTIONS.md
      - Use cases: use-cases.md
      - Walkthroughs: walkthroughs.md
      - Workflow retries, timeouts and error paths: WORKFLOW_STEP_ERRORS.md
      - Starting a workflow from a webhook: WORKFLOW_WEBHOOKS.md
      - Workflow test runs and running again from a step: WORKFLOW_TEST_RUNS.md
      - Workflow for each: WORKFLOW_FOR_EACH.md
  - Interfaces:
      - Overview: interfaces.md
      - Metatron terminal: terminal.md
      - Terminal and API reference: TERMINAL_API.md
      - MCP: MCP.md
      - CLI: cli.md
      - Remote API: remote-api.md
      - Grok CLI: GROK_CLI.md
  - Reference:
      - Features: FEATURES.md
      - Control surfaces: CONTROL_SURFACES.md
      - Terminal capability matrix: TERMINAL_CAPABILITY_MATRIX.md
      - Release notes (v1.0-rc10.9): RELEASE_NOTES_v1.0-rc10.9.md
      - RC9 candidate changes: RELEASE_NOTES_v1.0-rc9.md
      - RC9 validation in progress: RC9_VALIDATION.md
      - Release notes (v1.0-rc8): RELEASE_NOTES_v1.0-rc8.md
      - RC8 validation: RC8_VALIDATION.md
      - Release notes (v1.0-rc6.2): RELEASE_NOTES_v1.0-rc6.2.md
      - Release notes (v1.0-rc6.1): RELEASE_NOTES_v1.0-rc6.1.md
      - Release notes (v1.0-rc6): RELEASE_NOTES_v1.0-rc6.md
      - Release notes (v1.0-rc5): RELEASE_NOTES_v1.0-rc5.md
  - Community:
      - Feedback: FEEDBACK_LOOP.md
      - Publishing the docs: publishing.md

plugins:
  - search
