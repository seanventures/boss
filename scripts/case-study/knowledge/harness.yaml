# Knowledge Graph case studies: NorthPeak Retail on Saleor (docs/product/KNOWLEDGE_GRAPH_CASE_STUDY.md, T1..T12)
# and the banking set on Apache Fineract (docs/product/KNOWLEDGE_GRAPH_BANKING_CASE_STUDIES.md cases 1 and 3,
# B1..B4; Plane BOSSAPP-758). Pins, engines, arms, stages.
# Read by run.py and report.py. No secrets here: credentials come from the environment (README).
# Every repository a task works in is named per engine x arm ("forks"): `repo` is owner/name on GitHub (the harness
# sends BOSS the two parts as `owner` and `repo`), and `project` is the slug of the arm's own BOSS project, so one
# arm's knowledge never reaches another. `run.py setup` creates what is missing; `run.py run` resolves both.
saleor:
  upstream: https://github.com/saleor/saleor
  sha: 9ae360ae76b4777c7101215d8b3348022fcd3683   # main, 2026-10-20; one snapshot repository per arm x engine
  snapshot_message: "NorthPeak retail, based on Saleor 9ae360ae76b4"
  forks:
    E2:
      A: {repo: paramg/northpeak-saleor-a, project: northpeak-retail-a}
      B: {repo: paramg/northpeak-saleor-b, project: northpeak-retail-b}
    E1:
      A: {repo: paramg/northpeak-saleor-e1-a, project: northpeak-retail-e1-a}
      B: {repo: paramg/northpeak-saleor-e1-b, project: northpeak-retail-e1-b}
fulfilment:
  upstream: null                                 # created empty (a README commit, so main exists); BOSS builds it in T1
  snapshot_message: "NorthPeak fulfilment service"
  forks:
    E2:
      A: {repo: paramg/northpeak-fulfilment-a, project: northpeak-retail-a}
      B: {repo: paramg/northpeak-fulfilment-b, project: northpeak-retail-b}
    E1:
      A: {repo: paramg/northpeak-fulfilment-e1-a, project: northpeak-retail-e1-a}
      B: {repo: paramg/northpeak-fulfilment-e1-b, project: northpeak-retail-e1-b}
# The banking set's "legacy core". Pinned to 1.15.0, not 1.16.0: 1.16.0 needs JDK 25 and BOSS's build image
# ships Temurin JDK 21 (Dockerfile.community); 1.15.0's Gradle toolchain is Java 21. Validated 2026-10-22.
fineract:
  upstream: https://github.com/apache/fineract
  tag: "1.15.0"
  sha: d5636847ac556c30b437254c353f05526d172b97   # the commit tag 1.15.0 points to (the tag object is 9e76f088)
  jdk: 21                                        # build.gradle toolchain (JavaLanguageVersion.of(21)); the Gradle
                                                 # 8.14.5 wrapper runs on it. Point FINERACT_JAVA_HOME (or JAVA_HOME)
                                                 # at a JDK 21, e.g. Temurin 21
  gradle_wrapper: "8.14.5"
  # The demo repositories, per engine x arm: private, on the operator's personal account, each a single snapshot
  # commit of the 1.15.0 tree (only README.md differs: a demo-fork note; LICENSE_*/NOTICE_* intact). B3 and B4
  # push their fault.patch onto the arm's main. bank_smoke runs E2 only; the Sonnet pairs (E1) need their own set.
  snapshot_commit: 63dd10e4150b74932581181c6b3c18381ff15af0   # the three E2 repositories' first commit
  snapshot_message: "NorthPeak core banking, based on Apache Fineract 1.15.0"
  forks:
    E2:
      A:  {repo: paramg/northpeak-fineract-a,  url: https://github.com/paramg/northpeak-fineract-a,  project: northpeak-bank-a}
      AP: {repo: paramg/northpeak-fineract-ap, url: https://github.com/paramg/northpeak-fineract-ap, project: northpeak-bank-ap}
      B:  {repo: paramg/northpeak-fineract-b,  url: https://github.com/paramg/northpeak-fineract-b,  project: northpeak-bank-b}
  # The narrowest task that covers a hidden suite: one module's unit tests, filtered to the suite's classes.
  # Never the whole build (no database, no integration tests). {module} and {tests} come from the task.
  test_command: "./gradlew --no-daemon -q --console=plain :{module}:test --tests '{tests}' --rerun"
# Model spend per build (case study §4; BOSSAPP-600 lowers it), per engine. Used for each stage's
# estimate and budget ceiling. run.py refuses a stage the operator has not approved.
engines:
  E1: {engine: claude_code, model: claude-sonnet-5, build_estimate_usd: {low: 6.0, high: 10.0}, build_ceiling_usd: 15.0}
  E2: {engine: openai_compatible, model: qwen3-coder, pinned: "2026-10-01",           # pin the exact name/date before running
       build_estimate_usd: {low: 0.6, high: 1.9}, build_ceiling_usd: 3.0}
# Task sets, for `run.py setup --set NAME`: the repository kinds an arm works in.
sets:
  banking: {repos: [fineract], project_name: "NorthPeak Bank"}
  retail:  {repos: [saleor, fulfilment], project_name: "NorthPeak Retail"}
# Grading and merging (README "How a task is graded"): how long to wait for BOSS's own merge after the harness
# approves the pull request's merge decision, before the harness merges it with `gh` and records that it did.
merge:
  wait_minutes: 10
  method: merge                                  # gh pr merge --merge: the PR's commits land on main as they were graded
# Each arm's value for the knowledge_graph project setting (on | keyword | off). AP is A′ (case study §4): A plus
# plain full-text keyword search only (no graph traversal, vectors, learned facts or precedent). BOSS offers
# "keyword" from rel/rc10.10-kg f1f7fb6af; an older BOSS refuses the value and AP stops before any spend.
arms:
  A: {knowledge: "off"}
  AP: {knowledge: keyword, label: "A′ (keyword search)"}
  B: {knowledge: "on"}
# Operator decision 2026-10-21: no stage is approved yet. The smoke runs after Phases 1–3 (arm B
# needs the knowledge switch), on the open-model engine first; the Sonnet 5 smoke comes after.
stages:
  smoke:    {engines: [E2], arms: [A, B], tasks: [T1, T2, T3, T4], repeats: 1}
  smoke_e1: {engines: [E1], arms: [A, B], tasks: [T1, T2, T3, T4], repeats: 1}
  learning: {engines: [E1, E2], arms: [A, B], tasks: [T3, T7, T4, T9], repeats: 1, extra_repeats: {T7: 3, T9: 3}}
  full:     {engines: [E1, E2], arms: [A, B], tasks: [T1, T2, T3, T4, T5, T6, T7, T8, T9, T10, T11, T12], repeats: 1,
             extra_repeats: {T7: 3, T9: 3, T10: 3}}
  # Banking (Fineract). Learning pairs B1->B2 and B3->B4, run in that order so B2 and B4 can reuse what B1 and B3
  # taught. No stage is approved yet: the open-model smoke first, then (if it shows a signal) the Sonnet pairs.
  bank_smoke:       {engines: [E2], arms: [A, AP, B], tasks: [B1, B2, B3, B4], repeats: 1}
  bank_learning_e1: {engines: [E1], arms: [A, B], tasks: [B1, B2, B3, B4], repeats: 1}
