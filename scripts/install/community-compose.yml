# BOSS Community — self-contained local stack for the one-line installer.
# Postgres + API + worker + Mission Control. No Cloud / Account Connect required.
#
# Used by: install.sh  (or: docker compose -f scripts/install/community-compose.yml --env-file .env up -d)

name: boss-community

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boss
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: ${BOSS_DB_PASSWORD:-boss}
    ports:
      - "${BOSS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - boss_community_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d boss"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    image: boss-community-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:-boss}@db:5432/boss
      BOSS_EDITION: community
      BOSS_REQUIRE_API_AUTH: ${BOSS_REQUIRE_API_AUTH:-true}
      BOSS_API_KEY: ${BOSS_API_KEY}
      BOSS_API_KEYS: ${BOSS_API_KEY}
      BOSS_API_KEY_PRINCIPALS: ${BOSS_API_KEY}:ceo
      BOSS_DEFAULT_ORG_ID: ${BOSS_DEFAULT_ORG_ID:-org_boss}
      BOSS_DEFAULT_WORKSPACE_ID: ${BOSS_DEFAULT_WORKSPACE_ID:-ws_boss}
      BOSS_DEFAULT_PROJECT_ID: ${BOSS_DEFAULT_PROJECT_ID:-boss-dogfood}
      BOSS_ARTIFACTS_DIR: /var/lib/boss/artifacts
      BOSS_CONTROL_PLANE_URL: http://api:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BOSS_GITHUB_TOKEN: ${BOSS_GITHUB_TOKEN:-}
      BOSS_BOOTSTRAP_SEED_API_ENABLED: "false"
      # Community: no Account Connect required
      BOSS_ACCOUNT_CONNECT_URL: ""
    ports:
      - "${BOSS_API_PORT:-8000}:8000"
    volumes:
      - boss_community_artifacts:/var/lib/boss/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    image: boss-community-worker:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:-boss}@db:5432/boss
      BOSS_EDITION: community
      BOSS_API_KEY: ${BOSS_API_KEY}
      BOSS_CONTROL_PLANE_URL: http://api:8000
      BOSS_WORKER_ID: community-worker-1
      BOSS_ARTIFACTS_DIR: /var/lib/boss/artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BOSS_GITHUB_TOKEN: ${BOSS_GITHUB_TOKEN:-}
    volumes:
      - boss_community_artifacts:/var/lib/boss/artifacts

  web:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_BOSS_API_URL: ${NEXT_PUBLIC_BOSS_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_BOSS_PROJECT_ID: ${BOSS_DEFAULT_PROJECT_ID:-boss-dogfood}
    image: boss-community-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BOSS_API_URL: http://api:8000
      BOSS_API_KEY: ${BOSS_API_KEY}
      NEXT_PUBLIC_BOSS_API_URL: ${NEXT_PUBLIC_BOSS_API_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_BOSS_PROJECT_ID: ${BOSS_DEFAULT_PROJECT_ID:-boss-dogfood}
    ports:
      - "${BOSS_WEB_PORT:-3000}:3000"

volumes:
  boss_community_pg:
  boss_community_artifacts:
