# BOSS Community — self-contained local stack for the one-line installer.
# Postgres + API + worker + Mission Control. No Cloud / Account Connect required.
#
# Used by: packages/create-boss  (node packages/create-boss/index.js), or by hand —
# see SETUP.md. `install.sh` was referenced here and never existed.

name: boss-community

services:
  db:
    # PostgreSQL 16 on Alpine with pgvector and Apache AGE compiled in (db-image/Dockerfile;
    # BOSSAPP-622). The same base and libc as the postgres:16-alpine installs ran before, so an
    # existing volume opens unchanged: the upgrade is this image swap plus the schema step that
    # creates the extensions. Pinned by tag; a recovery start pins the reviewed image id instead.
    build:
      context: .
      dockerfile: db-image/Dockerfile
    image: ${BOSS_RECOVERY_DB_IMAGE_ID:-boss-community-db:pg16.12-vector0.8.1-age1.6.0}
    pull_policy: ${BOSS_RECOVERY_PULL_POLICY:-missing}
    # AGE is preloaded even when the data directory's postgresql.conf predates this image.
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    # Parallel hash joins use /dev/shm; Docker's 64 MB default refused the knowledge graph's
    # schema counts ("could not resize shared memory segment … No space left on device").
    shm_size: 512m
    restart: unless-stopped
    # THE DATABASE IS THE LAST THING THE KERNEL MAY KILL (stability spec §4b.1). Builds run at
    # +500, the API at -500, Postgres at -900: under memory pressure a build dies first,
    # never the data every other service stands on. The reservation keeps its working set
    # in memory when the host is short.
    mem_reservation: 256m
    oom_score_adj: -900
    environment:
      POSTGRES_DB: boss
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: ${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD (install.sh generates it; never the old default)}
    ports:
      # Loopback, not 0.0.0.0: nothing outside this machine needs the database, and api and
      # worker reach it as `db:5432` on the compose network regardless. Override the port when
      # 5432 is already taken — on a developer machine it usually is.
      - "127.0.0.1:${BOSS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - boss_community_pg:/var/lib/postgresql/data
      # Creates the `infisical` database on first init, so the optional secret store shares
      # this server instead of shipping a Postgres of its own.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d boss"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  # --- build services: a throwaway Postgres per build run ---------------------
  #
  # NOT the BOSS database. A build whose repo declares `services: [postgres]` in boss.verify.yaml
  # (or whose project sets Build services = postgres) gets its own role + database here, created
  # at run start and dropped at run end (engine/boss_engine/services/build_services.py). Data on
  # tmpfs: nothing survives a restart, by design. Port 5433, never 5432, so the sandbox fence can
  # open this server and still reject the BOSS database. pg_hba `sameuser`: a run's role can log
  # in only to the database named like itself. The superuser password is generated by the api's
  # entrypoint into a volume only root and the api's `boss` uid can read (never a sandbox uid).
  build-services:
    # The same image as `db` (one database image); its extensions are simply not created here.
    build:
      context: .
      dockerfile: db-image/Dockerfile
    image: boss-community-db:pg16.12-vector0.8.1-age1.6.0
    pull_policy: ${BOSS_RECOVERY_PULL_POLICY:-missing}
    restart: unless-stopped
    mem_limit: ${BOSS_BUILD_SERVICES_MEM_LIMIT:-1g}
    oom_score_adj: 300
    depends_on:
      api:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/boss-build-services/password
    command:
      - sh
      - -c
      - >-
        printf 'local all postgres trust\nhost sameuser all all scram-sha-256\nhost all postgres all scram-sha-256\n'
        > /tmp/boss_pg_hba.conf && exec docker-entrypoint.sh postgres -p 5433
        -c hba_file=/tmp/boss_pg_hba.conf -c password_encryption=scram-sha-256
        -c max_connections=300 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data:size=${BOSS_BUILD_SERVICES_TMPFS_SIZE:-2g}
    volumes:
      - boss_community_build_services_secret:/run/boss-build-services:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # --- optional secret store -------------------------------------------------
  #
  # `docker compose up` gives you BOSS alone and secrets fall back to the database, which is
  # honest but not where a token belongs. `docker compose --profile secrets up` adds Infisical
  # and BOSS keeps them there instead. Opt-in, because an evaluator should not have to pull a
  # secret store to try the product, and a production install should not have to do without.
  infisical-redis:
    image: redis:7-alpine
    profiles: ["secrets"]
    restart: unless-stopped
    volumes:
      - boss_community_infisical_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  infisical:
    image: infisical/infisical:latest-postgres
    profiles: ["secrets"]
    restart: unless-stopped
    # Bounded so a leak here cannot starve builds or the API (measured ~640 MiB in use).
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    environment:
      # Its own database on BOSS's Postgres server — see initdb/10-infisical.sql.
      DB_CONNECTION_URI: postgres://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD (install.sh generates it; never the old default)}@db:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      # No defaults on purpose. A shipped default encryption key is the same key on every
      # installation that forgot to change it, which is worse than refusing to start.
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?generate with scripts/install/gen_infisical_keys.sh}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?generate with scripts/install/gen_infisical_keys.sh}
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8080}
    ports:
      # Loopback for the same reason. The operator needs the UI; the internet does not.
      - "127.0.0.1:${INFISICAL_PORT:-8080}:8080"

  # THE BUNDLED PROMETHEUS AND GRAFANA (BOSSAPP-598, decision D1, topology T2). They come up
  # with Mission Control (the `web` profile; `monitoring` alone brings them without the
  # console). BOSS forwards every app's scrapes, health probes and open alerts here by remote
  # write, and what apps send it by OTLP or remote write; rules are evaluated over them,
  # scoped to each project. install.sh sets BOSS_MONITORING_* in .env when the web profile is
  # on; without them BOSS's Postgres floor (T0) holds and evaluates everything.
  # Prometheus is not published on the host. Official images, pinned.
  prometheus:
    image: prom/prometheus:v3.10.0
    profiles: ["web", "monitoring"]
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/boss.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Bounded on disk too: a laptop is not a metrics warehouse.
      - --storage.tsdb.retention.size=2GB
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - boss_community_prometheus:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/boss.yml:ro

  # Read-only for whoever reaches it: anonymous Viewer, no login form, no admin user at all.
  # Published on the loopback only, like the console; its dashboards are files BOSS writes.
  grafana:
    image: grafana/grafana:12.4.0
    profiles: ["web", "monitoring"]
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      - prometheus
    environment:
      GF_SERVER_ROOT_URL: ${BOSS_MONITORING_GRAFANA_PUBLIC_URL:-http://localhost:3300}/
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Explore (an alert's "Explore ↗") is open to viewers; nothing a viewer edits is saved.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - boss_community_grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - boss_community_grafana_dashboards:/var/lib/boss/grafana-dashboards:ro
    ports:
      - "127.0.0.1:${BOSS_GRAFANA_PORT:-3300}:3000"

  # THE LOCAL TEST INBOX (docs/community/EMAIL.md). OFF BY DEFAULT: only the `mail` profile
  # starts it, which install.sh adds with --with-mailpit (or BOSS_EMAIL_DEV_INBOX=1). The Email
  # (SMTP) connector can then choose it, and nothing sent to it leaves the machine. The UI is on
  # the loopback only; SMTP is reachable inside the compose network only. Official image, pinned.
  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: ["mail"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${BOSS_MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.community
      target: api
      args:
        BOSS_SOURCE_SHA: ${BOSS_SOURCE_SHA:-unknown}
        BOSS_BUILT_AT: ${BOSS_BUILT_AT:-unknown}
        # Opt-in build toolchains (docs/community/TOOLCHAINS.md): none, or java. Every image
        # built from python-runtime takes the same value, so that stage is built once.
        BOSS_TOOLCHAINS: ${BOSS_TOOLCHAINS:-none}
    image: ${BOSS_RECOVERY_API_IMAGE_ID:-boss-community-api:${BOSS_COMMUNITY_IMAGE_TAG:-boss-community}}
    pull_policy: ${BOSS_RECOVERY_PULL_POLICY:-missing}
    command: ["python", "-m", "apps.api.serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    # THE SANDBOX BOUNDARY (IDENTITY.md §7.6). Builds run in this container, each as its own
    # unprivileged uid. The entrypoint starts as root with NET_ADMIN only to fence those uids'
    # network (API + egress only), then becomes `boss` for good with no way back
    # (scripts/sandbox/entrypoint.sh). `docker compose exec api` is therefore root by default:
    # pass `-u boss` for anything that writes files.
    user: "0:0"
    cap_add:
      - NET_ADMIN
    # AN INIT AS PID 1 (stability spec §4a.4). Agents, builds and previews are this
    # container's children; without an init, uvicorn is PID 1 and never reaps the orphans they
    # leave, so each one becomes a zombie holding a pid until the container restarts. `init`
    # runs Docker's tini, which reaps them and forwards SIGTERM.
    init: true
    # THE CONTROL PLANE KEEPS ITS MEMORY (stability spec §4b.1). Builds, agents and previews
    # run as this container's children, at oom_score_adj +500 (owned_process), so when the
    # machine is short the kernel kills a build, not uvicorn (-500) or Postgres (-900).
    # BOSS_API_MEM_LIMIT caps the whole envelope (control plane + the builds it runs) when the
    # host also serves other things; unset (0) leaves it to admission and the system doctor.
    mem_reservation: 512m
    mem_limit: ${BOSS_API_MEM_LIMIT:-0}
    oom_score_adj: -500
    # A fork bomb or a zombie pile-up stops here, not at the host's pid table.
    pids_limit: ${BOSS_API_PIDS_LIMIT:-4096}
    # A DEPLOY DRAINS, IT DOES NOT KILL (spec §4a.5). The default 10 s ended with SIGKILL
    # (exit 137) mid-turn, and the build restarted from clone: one code task went through 3
    # hand-backs and 4 reclaims in 52 minutes. On SIGTERM the API stops admitting, ends every
    # owned process tree and marks in-flight builds interrupted_by_deploy before this runs out.
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD (install.sh generates it; never the old default)}@db:5432/boss
      # Self-fix runs apps/api tests against its OWN disposable database on the same server
      # (created on first use by self_fix_build._api_suite); never the live one.
      BOSS_SELF_FIX_TEST_DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD}@db:5432/boss_selffix_test
      BOSS_EDITION: community
      # BOSS FIXES ITSELF (docs/product/BOSS_FIXES_ITSELF.md §6): the head of the local stack of
      # installed self-fixes over the release (written by the host self-installer; empty = the
      # release as it is), and BOSS's own source, mirrored read-only for its fix builds.
      BOSS_STACK_HEAD: ${BOSS_STACK_HEAD:-}
      BOSS_SELF_FIX_SOURCE: /var/lib/boss/selfsrc/boss.git
      # KG P6b: the external_agent step refuses to run without this — the Knowledge-Graph MCP
      # endpoint handed to a bank's connected agent, served by this install's own kg-mcp service.
      BOSS_KG_MCP_URL: http://kg-mcp:8790/mcp
      # Improve BOSS / daily heartbeat (docs/product/RUN_SCORECARDS.md). BOSS_TELEMETRY=off or
      # DO_NOT_TRACK=1 in .env turns every send off, the heartbeat included.
      BOSS_TELEMETRY: ${BOSS_TELEMETRY:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
      # No default collector: empty means nothing is sent (set one here or in Govern › Sharing).
      BOSS_TELEMETRY_URL: ${BOSS_TELEMETRY_URL:-}
      # The collector's rate limits read a client address: believe X-Forwarded-For only from the
      # console's own container (`web`, resolved by name), never from the published port.
      BOSS_TRUSTED_PROXIES: ${BOSS_TRUSTED_PROXIES:-127.0.0.0/8,::1/128,web}
      BOSS_INSTALL_METHOD: ${BOSS_INSTALL_METHOD:-compose}
      # BUILD SERVICES (build-services above; build_services.py). The superuser's password is in
      # the file, never in this environment; the sandbox fence opens only this port.
      BOSS_BUILD_SERVICES_PG_URL: ${BOSS_BUILD_SERVICES_PG_URL:-postgresql://postgres@build-services:5433/postgres}
      BOSS_BUILD_SERVICES_PG_PASSWORD_FILE: /run/boss-build-services/password
      BOSS_BUILD_SERVICES_SANDBOX_PORT: "5433"
      # IDENTITY (docs/product/IDENTITY.md §4.11, §4.3). The shared console password is the claim
      # credential of an existing install, then usr_legacy_shared for 30 days (D25): the API must
      # be able to check it. The public origin binds cookies, passkeys and every emailed link.
      BOSS_CONSOLE_PASSWORD: ${BOSS_CONSOLE_PASSWORD:-}
      BOSS_PUBLIC_URL: ${BOSS_PUBLIC_URL:-${BOSS_CONSOLE_PUBLIC_ORIGIN:-}}
      BOSS_MONITORING_PROMETHEUS_URL: ${BOSS_MONITORING_PROMETHEUS_URL:-}
      BOSS_MONITORING_GRAFANA_URL: ${BOSS_MONITORING_GRAFANA_URL:-}
      BOSS_MONITORING_GRAFANA_PUBLIC_URL: ${BOSS_MONITORING_GRAFANA_PUBLIC_URL:-}
      BOSS_MONITORING_DASHBOARDS_DIR: /var/lib/boss/grafana-dashboards
      # Email (docs/community/EMAIL.md): the local test inbox, set only when the operator opted
      # in (install.sh --with-mailpit); mail otherwise goes through the Email (SMTP) connector.
      BOSS_EMAIL_DEV_INBOX: ${BOSS_EMAIL_DEV_INBOX:-}
      BOSS_EMAIL_DEV_INBOX_URL: ${BOSS_EMAIL_DEV_INBOX_URL:-}
      # The console's real port, for links printed before any public origin is bound (the claim
      # link of a laptop install): identity/authn_support.local_console_origin.
      BOSS_WEB_PORT: ${BOSS_WEB_PORT:-3000}
      BOSS_REQUIRE_API_AUTH: ${BOSS_REQUIRE_API_AUTH:-true}
      BOSS_API_KEY: ${BOSS_API_KEY}
      # The installer preserves operator-added keys and binds the dedicated
      # worker key to the seeded system member before Compose starts.
      BOSS_API_KEYS: ${BOSS_API_KEYS:-${BOSS_API_KEY},${BOSS_WORKER_API_KEY:?generated by install.sh}}
      BOSS_API_KEY_PRINCIPALS: ${BOSS_API_KEY_PRINCIPALS:-${BOSS_API_KEY}:ceo,${BOSS_WORKER_API_KEY:?generated by install.sh}:system}
      BOSS_WORKER_PRINCIPAL: system
      BOSS_DEFAULT_ORG_ID: ${BOSS_DEFAULT_ORG_ID:-org_boss}
      BOSS_DEFAULT_WORKSPACE_ID: ${BOSS_DEFAULT_WORKSPACE_ID:-ws_boss}
      BOSS_DEFAULT_PROJECT_ID: ${BOSS_DEFAULT_PROJECT_ID:-boss-dogfood}
      # THE PRODUCT'S OWN LOOP, ON. Both default to false in config.py, which is right for a
      # library and wrong for an install whose entire purpose is to build software: pressing
      # Build convened a panel, wrote a PRD, took an approval, and then answered
      # "Code tasks are disabled (BOSS_ENABLE_CODE_TASK=false)" at step four of ten. A
      # customer cannot be expected to find a flag they were never told about, in a file they
      # did not write, after the product has already spent their model budget.
      BOSS_ENABLE_CODE_TASK: ${BOSS_ENABLE_CODE_TASK:-true}
      BOSS_GOVERNED_CODING_PIPELINE: ${BOSS_GOVERNED_CODING_PIPELINE:-true}
      BOSS_ARTIFACTS_DIR: /var/lib/boss/artifacts
      # One database pool per process (stability spec §4a.10), sized per service.
      BOSS_DB_POOL_SIZE: ${BOSS_API_DB_POOL_SIZE:-10}
      BOSS_DB_MAX_OVERFLOW: ${BOSS_API_DB_MAX_OVERFLOW:-10}
      BOSS_PREVIEW_IDLE_MINUTES: ${BOSS_PREVIEW_IDLE_MINUTES:-20}
      # PREVIEWS ON THEIR OWN ORIGIN (apps/api/app/preview_origin.py): a preview-only listener on
      # this port, never the console's origin. BOSS_PREVIEW_ORIGIN is the address a browser opens
      # it at; empty means the console's own host on BOSS_PREVIEW_PORT. Set it behind TLS.
      BOSS_PREVIEW_PORT: ${BOSS_PREVIEW_PORT:-3001}
      BOSS_PREVIEW_ORIGIN: ${BOSS_PREVIEW_ORIGIN:-}
      BOSS_DEDICATED_HOST: ${BOSS_DEDICATED_HOST:-}
      BOSS_CONTROL_PLANE_URL: http://api:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      # Ollama on THIS machine, as the container sees it (the container's own 127.0.0.1 is not
      # the host's): detection, the console's Local › Ollama default and Connect with the URL
      # left empty all look here. host.docker.internal is mapped below (extra_hosts).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Subscription credentials, so an operator who puts one in .env actually gets it.
      # Without these the value sits in .env, compose never passes it in, and the container
      # reports "not signed in" while the operator is looking at the credential they just set.
      CODEX_AUTH_JSON: ${CODEX_AUTH_JSON:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Claude Code owns its browser/device login in this private, shared directory.
      # CLAUDE_CONFIG_DIR keeps both CLI state and .claude.json inside the volume.
      CLAUDE_CONFIG_DIR: /home/boss/.claude
      # Where BOSS keeps secrets. Without these forwarded, bootstrap writes them into .env and
      # the container never sees them — the store is configured and unreachable at once.
      BOSS_INFISICAL_URL: ${BOSS_INFISICAL_URL:-}
      BOSS_INFISICAL_TOKEN: ${BOSS_INFISICAL_TOKEN:-}
      BOSS_INFISICAL_PROJECT_ID: ${BOSS_INFISICAL_PROJECT_ID:-}
      BOSS_INFISICAL_CLIENT_ID: ${BOSS_INFISICAL_CLIENT_ID:-}
      BOSS_INFISICAL_CLIENT_SECRET: ${BOSS_INFISICAL_CLIENT_SECRET:-}
      BOSS_INFISICAL_ENVIRONMENT: ${BOSS_INFISICAL_ENVIRONMENT:-prod}
      # The operator's store choice and the database store's key, both from .env. Without the
      # key the database store keeps its key inside Postgres; without the choice, BOSS ignored
      # the installer's "database or infisical" answer.
      BOSS_COMMUNITY_SECRET_STORE: ${BOSS_COMMUNITY_SECRET_STORE:-}
      BOSS_KMS_MASTER_KEY: ${BOSS_KMS_MASTER_KEY:-}
      # BOSS IDENTITY (docs/product/IDENTITY.md). The vault's key-encryption key lives in a file
      # on its own volume (never in Postgres, so a database dump is not a key compromise). The API
      # creates it ONCE, at the first boot of an EMPTY vault (a fresh install, or an upgrade from
      # a release without identity), and never again: a vault that has data and no matching key
      # refuses to start. api, worker and egress share it. BOSS_IDENTITY_SERVER_KEY (CSRF, hashed
      # identifiers, rate limits) is derived from it unless you set one; identity never runs on a
      # per-process key. Back this volume up with the database: without it, stored TOTP secrets
      # and connections cannot be decrypted. To bring your own key, create the file (32 random
      # bytes, base64) before the first start, or set BOSS_MASTER_KEY_AUTOCREATE=0 to require it.
      BOSS_MASTER_KEY_FILE: ${BOSS_MASTER_KEY_FILE:-/var/lib/boss/identity/master.key}
      BOSS_IDENTITY_SERVER_KEY: ${BOSS_IDENTITY_SERVER_KEY:-}
      BOSS_AUTHZ_MODE: ${BOSS_AUTHZ_MODE:-enforce}
      BOSS_AUTHZ_ROUTER_MODES: ${BOSS_AUTHZ_ROUTER_MODES:-}
      BOSS_AUTHZ_COVERAGE: ${BOSS_AUTHZ_COVERAGE:-}
      # The sandbox: required (a build never runs as the API's uid), network fenced, and every
      # GitHub call through boss-egress, which holds the only GitHub credentials. A host that
      # cannot fence (no iptables owner match) still starts; builds are held until it is fixed
      # (BOSS_SANDBOX_NETWORK=required refuses to start; off skips the fence). SANDBOX.md.
      BOSS_SANDBOX_ISOLATION: ${BOSS_SANDBOX_ISOLATION:-required}
      BOSS_SANDBOX_NETWORK: ${BOSS_SANDBOX_NETWORK:-enforce}
      BOSS_SANDBOX_ROOT_PATH: /var/lib/boss/sandboxes
      BOSS_EGRESS_URL: ${BOSS_EGRESS_URL:-http://egress:8090}
      BOSS_EGRESS_CONNECT_PROXY: ${BOSS_EGRESS_CONNECT_PROXY:-http://egress:8091}
      BOSS_EGRESS_SERVICE_KEY_FILE: /var/lib/boss/identity/egress-service.key
      BOSS_GITHUB_TOKEN: ${BOSS_GITHUB_TOKEN:-}
      BOSS_GITHUB_OWNER: ${BOSS_GITHUB_OWNER:-}
      BOSS_GITHUB_REPO: ${BOSS_GITHUB_REPO:-}
      # PIPELINE KNOBS AN OPERATOR CAN ACTUALLY TURN.
      #
      # This file passes a NAMED LIST into the container, so anything not listed here sits in
      # .env having no effect at all. An operator sets BOSS_CODE_AGENT_MAX_CONCURRENCY, sees
      # the same behaviour, and concludes BOSS ignores its own configuration -- while the
      # long-lived install, whose .env is applied differently, honours the very same key. That
      # asymmetry is where "it works there but not here" comes from.
      #
      # Only HOST-INDEPENDENT settings belong here. BOSS_CLAUDE_CLI_PATH, for instance, must
      # NOT be forwarded: its value on a laptop is /Users/<someone>/.local/bin/claude, which
      # does not exist in the container, so passing it would break the CLI it configures.
      #
      # Defaults match config.py, so an unset key behaves exactly as a stock install.
      BOSS_CODE_AGENT_MAX_CONCURRENCY: ${BOSS_CODE_AGENT_MAX_CONCURRENCY:-1}
      BOSS_CODE_AGENT_MAX_TURNS: ${BOSS_CODE_AGENT_MAX_TURNS:-90}
      BOSS_CODE_AGENT_REVIEW_MAX_TURNS: ${BOSS_CODE_AGENT_REVIEW_MAX_TURNS:-48}
      BOSS_CODE_AGENT_TIMEOUT_SECONDS: ${BOSS_CODE_AGENT_TIMEOUT_SECONDS:-2700}
      BOSS_CODE_AGENT_MAX_THINKING_TOKENS: ${BOSS_CODE_AGENT_MAX_THINKING_TOKENS:-12000}
      BOSS_CODE_AGENT_REVIEW_TIMEOUT_SECONDS: ${BOSS_CODE_AGENT_REVIEW_TIMEOUT_SECONDS:-900}
      BOSS_CODE_AGENT_DESIGN_TIMEOUT_SECONDS: ${BOSS_CODE_AGENT_DESIGN_TIMEOUT_SECONDS:-1200}
      BOSS_CODE_REPAIR_MAX_RETRIES: ${BOSS_CODE_REPAIR_MAX_RETRIES:-0}
      BOSS_SANDBOX_CI_TIMEOUT_SECONDS: ${BOSS_SANDBOX_CI_TIMEOUT_SECONDS:-120}
      BOSS_SANDBOX_CI_POLL_INTERVAL_SECONDS: ${BOSS_SANDBOX_CI_POLL_INTERVAL_SECONDS:-5}
      BOSS_CI_WAIT_TIMEOUT_SECONDS: ${BOSS_CI_WAIT_TIMEOUT_SECONDS:-1800}
      # Mirror config.py's default, never empty: an unset compose variable still SETS the
      # variable to "", which would override the real default with nothing.
      BOSS_CODE_AGENT_ENGINE: ${BOSS_CODE_AGENT_ENGINE:-claude_code}
      BOSS_LLM_ENGINE: ${BOSS_LLM_ENGINE:-auto}
      BOSS_CHAT_LLM_ENGINE: ${BOSS_CHAT_LLM_ENGINE:-}
      BOSS_CLAUDE_CLI_MODEL: ${BOSS_CLAUDE_CLI_MODEL:-}
      BOSS_AGENT_SDK_MODEL: ${BOSS_AGENT_SDK_MODEL:-}
      BOSS_CODE_AGENT_LOW_COST_MODEL: ${BOSS_CODE_AGENT_LOW_COST_MODEL:-}
      BOSS_CODE_AGENT_STRONG_MODEL: ${BOSS_CODE_AGENT_STRONG_MODEL:-}
      # Token prices per model, e.g. a local model at zero. Empty uses BOSS's built-in table.
      BOSS_MODEL_PRICES_JSON: ${BOSS_MODEL_PRICES_JSON:-}
      BOSS_BOOTSTRAP_SEED_API_ENABLED: "false"
      # Community: no Account Connect required
      BOSS_ACCOUNT_CONNECT_URL: ""
    ports:
      # Default loopback. Widen only BOSS_API_BIND. Web, Postgres, and Infisical stay on 127.0.0.1.
      # Auth stays required; this file has no switch that turns BOSS_REQUIRE_API_AUTH off.
      - "${BOSS_API_BIND:-127.0.0.1}:${BOSS_API_PORT:-8000}:8000"
      # The preview origin: preview capability paths only, every cookie and credential stripped.
      - "${BOSS_PREVIEW_BIND:-127.0.0.1}:${BOSS_PREVIEW_PORT:-3001}:${BOSS_PREVIEW_PORT:-3001}"
    volumes:
      - boss_community_recovery:/var/lib/boss/recovery:ro
      - boss_community_artifacts:/var/lib/boss/artifacts
      - boss_community_identity:/var/lib/boss/identity
      # The bundled Grafana's per-app dashboards (bundled_monitoring.write_dashboards).
      - boss_community_grafana_dashboards:/var/lib/boss/grafana-dashboards
      # Per-project Maven/Gradle downloads the build sandbox keeps between runs (toolchains).
      - boss_community_toolchain_cache:/var/lib/boss/toolchain-cache
      # BOSS's own source for self-fix builds, read-only (`boss self-fix seed` fills it on the
      # host; install.sh creates the directory so Docker never makes it as root).
      - ../../.boss/selfsrc:/var/lib/boss/selfsrc:ro
      - boss_community_build_services_secret:/run/boss-build-services
      # ONE Codex session shared by api and worker. A subscription CLI holds a rotating
      # credential: every refresh revokes the previous one, so two containers each holding
      # their own copy revoke each other — api detects, worker builds, and whichever runs
      # second finds a dead token. Sharing the directory gives them one credential and one
      # refresh chain. It also survives `up --build`, which a container-local file does not.
      - boss_community_cli_home:/home/boss/.codex
      - boss_community_claude_home:/home/boss/.claude
      # Device login is local to the Unix user. Share the owner-only Grok home with the
      # worker so API setup and governed jobs see the same renewable session.
      - boss_community_grok_home:/home/boss/.grok
    # A model server on this machine (Ollama) is reachable as host.docker.internal. Docker
    # Desktop resolves the name already; on Linux this maps it to the host's bridge address.
    # Nothing is published: this only lets the container dial out to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.community
      target: worker
      args:
        BOSS_SOURCE_SHA: ${BOSS_SOURCE_SHA:-unknown}
        BOSS_BUILT_AT: ${BOSS_BUILT_AT:-unknown}
        # Opt-in build toolchains (docs/community/TOOLCHAINS.md): none, or java. Every image
        # built from python-runtime takes the same value, so that stage is built once.
        BOSS_TOOLCHAINS: ${BOSS_TOOLCHAINS:-none}
    image: ${BOSS_RECOVERY_API_IMAGE_ID:-boss-community-worker:${BOSS_COMMUNITY_IMAGE_TAG:-boss-community}}
    pull_policy: ${BOSS_RECOVERY_PULL_POLICY:-missing}
    command: ["python", "-m", "apps.worker.boss_worker.main"]
    entrypoint: ["python3", "/usr/local/libexec/boss/recovery_guard.py"]
    restart: unless-stopped
    # AN INIT AS PID 1 (stability spec §4a.4). Agents, builds and previews are this
    # container's children; without an init, uvicorn is PID 1 and never reaps the orphans they
    # leave, so each one becomes a zombie holding a pid until the container restarts. `init`
    # runs Docker's tini, which reaps them and forwards SIGTERM.
    init: true
    # The worker leases jobs and waits on HTTP; it runs no builds itself.
    mem_limit: 512m
    oom_score_adj: -200
    # The worker hands a leased job back on SIGTERM (job.handed_back); give it time to.
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD (install.sh generates it; never the old default)}@db:5432/boss
      # Self-fix runs apps/api tests against its OWN disposable database on the same server
      # (created on first use by self_fix_build._api_suite); never the live one.
      BOSS_SELF_FIX_TEST_DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD}@db:5432/boss_selffix_test
      BOSS_EDITION: community
      # BOSS FIXES ITSELF (docs/product/BOSS_FIXES_ITSELF.md §6): the head of the local stack of
      # installed self-fixes over the release (written by the host self-installer; empty = the
      # release as it is), and BOSS's own source, mirrored read-only for its fix builds.
      BOSS_STACK_HEAD: ${BOSS_STACK_HEAD:-}
      BOSS_SELF_FIX_SOURCE: /var/lib/boss/selfsrc/boss.git
      BOSS_WORKER_API_KEY: ${BOSS_WORKER_API_KEY:?generated by install.sh}
      BOSS_CONTROL_PLANE_URL: http://api:8000
      BOSS_WORKER_ID: community-worker-1
      # KG P6b: same reasoning as the api service above — the external_agent step refuses to
      # run without a configured Knowledge-Graph MCP endpoint.
      BOSS_KG_MCP_URL: http://kg-mcp:8790/mcp
      # The worker runs no builds (it leases jobs and asks the API to run them), but BOSS code in
      # it is never allowed to run one unisolated either: fail closed, like the api.
      BOSS_SANDBOX_ISOLATION: ${BOSS_SANDBOX_ISOLATION:-required}
      BOSS_DB_POOL_SIZE: ${BOSS_WORKER_DB_POOL_SIZE:-5}
      # Lease slots: `auto` = the API's measured "Builds at once"; a number pins it.
      BOSS_WORKER_SLOTS: ${BOSS_WORKER_SLOTS:-auto}
      BOSS_DB_MAX_OVERFLOW: ${BOSS_WORKER_DB_MAX_OVERFLOW:-5}
      # THE PRODUCT'S OWN LOOP, ON. Both default to false in config.py, which is right for a
      # library and wrong for an install whose entire purpose is to build software: pressing
      # Build convened a panel, wrote a PRD, took an approval, and then answered
      # "Code tasks are disabled (BOSS_ENABLE_CODE_TASK=false)" at step four of ten. A
      # customer cannot be expected to find a flag they were never told about, in a file they
      # did not write, after the product has already spent their model budget.
      BOSS_ENABLE_CODE_TASK: ${BOSS_ENABLE_CODE_TASK:-true}
      BOSS_GOVERNED_CODING_PIPELINE: ${BOSS_GOVERNED_CODING_PIPELINE:-true}
      BOSS_ARTIFACTS_DIR: /var/lib/boss/artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      # Ollama on THIS machine, as the container sees it (the container's own 127.0.0.1 is not
      # the host's): detection, the console's Local › Ollama default and Connect with the URL
      # left empty all look here. host.docker.internal is mapped below (extra_hosts).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Subscription credentials, so an operator who puts one in .env actually gets it.
      # Without these the value sits in .env, compose never passes it in, and the container
      # reports "not signed in" while the operator is looking at the credential they just set.
      CODEX_AUTH_JSON: ${CODEX_AUTH_JSON:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CONFIG_DIR: /home/boss/.claude
      # Where BOSS keeps secrets. Without these forwarded, bootstrap writes them into .env and
      # the container never sees them — the store is configured and unreachable at once.
      BOSS_INFISICAL_URL: ${BOSS_INFISICAL_URL:-}
      BOSS_INFISICAL_TOKEN: ${BOSS_INFISICAL_TOKEN:-}
      BOSS_INFISICAL_PROJECT_ID: ${BOSS_INFISICAL_PROJECT_ID:-}
      BOSS_INFISICAL_CLIENT_ID: ${BOSS_INFISICAL_CLIENT_ID:-}
      BOSS_INFISICAL_CLIENT_SECRET: ${BOSS_INFISICAL_CLIENT_SECRET:-}
      BOSS_INFISICAL_ENVIRONMENT: ${BOSS_INFISICAL_ENVIRONMENT:-prod}
      # The operator's store choice and the database store's key, both from .env. Without the
      # key the database store keeps its key inside Postgres; without the choice, BOSS ignored
      # the installer's "database or infisical" answer.
      BOSS_COMMUNITY_SECRET_STORE: ${BOSS_COMMUNITY_SECRET_STORE:-}
      BOSS_KMS_MASTER_KEY: ${BOSS_KMS_MASTER_KEY:-}
      # BOSS IDENTITY (docs/product/IDENTITY.md). The vault's key-encryption key lives in a file
      # on its own volume (never in Postgres, so a database dump is not a key compromise). The API
      # creates it ONCE, at the first boot of an EMPTY vault (a fresh install, or an upgrade from
      # a release without identity), and never again: a vault that has data and no matching key
      # refuses to start. api, worker and egress share it. BOSS_IDENTITY_SERVER_KEY (CSRF, hashed
      # identifiers, rate limits) is derived from it unless you set one; identity never runs on a
      # per-process key. Back this volume up with the database: without it, stored TOTP secrets
      # and connections cannot be decrypted. To bring your own key, create the file (32 random
      # bytes, base64) before the first start, or set BOSS_MASTER_KEY_AUTOCREATE=0 to require it.
      BOSS_MASTER_KEY_FILE: ${BOSS_MASTER_KEY_FILE:-/var/lib/boss/identity/master.key}
      BOSS_IDENTITY_SERVER_KEY: ${BOSS_IDENTITY_SERVER_KEY:-}
      BOSS_PUBLIC_URL: ${BOSS_PUBLIC_URL:-${BOSS_CONSOLE_PUBLIC_ORIGIN:-}}
      BOSS_MONITORING_PROMETHEUS_URL: ${BOSS_MONITORING_PROMETHEUS_URL:-}
      BOSS_MONITORING_GRAFANA_URL: ${BOSS_MONITORING_GRAFANA_URL:-}
      BOSS_MONITORING_GRAFANA_PUBLIC_URL: ${BOSS_MONITORING_GRAFANA_PUBLIC_URL:-}
      BOSS_MONITORING_DASHBOARDS_DIR: /var/lib/boss/grafana-dashboards
      BOSS_EMAIL_DEV_INBOX: ${BOSS_EMAIL_DEV_INBOX:-}
      BOSS_EMAIL_DEV_INBOX_URL: ${BOSS_EMAIL_DEV_INBOX_URL:-}
      # The console's real port, for links printed before any public origin is bound (the claim
      # link of a laptop install): identity/authn_support.local_console_origin.
      BOSS_WEB_PORT: ${BOSS_WEB_PORT:-3000}
      BOSS_AUTHZ_MODE: ${BOSS_AUTHZ_MODE:-enforce}
      BOSS_AUTHZ_ROUTER_MODES: ${BOSS_AUTHZ_ROUTER_MODES:-}
      BOSS_AUTHZ_COVERAGE: ${BOSS_AUTHZ_COVERAGE:-}
      BOSS_GITHUB_TOKEN: ${BOSS_GITHUB_TOKEN:-}
      BOSS_GITHUB_OWNER: ${BOSS_GITHUB_OWNER:-}
      BOSS_GITHUB_REPO: ${BOSS_GITHUB_REPO:-}
      # PIPELINE KNOBS AN OPERATOR CAN ACTUALLY TURN.
      #
      # This file passes a NAMED LIST into the container, so anything not listed here sits in
      # .env having no effect at all. An operator sets BOSS_CODE_AGENT_MAX_CONCURRENCY, sees
      # the same behaviour, and concludes BOSS ignores its own configuration -- while the
      # long-lived install, whose .env is applied differently, honours the very same key. That
      # asymmetry is where "it works there but not here" comes from.
      #
      # Only HOST-INDEPENDENT settings belong here. BOSS_CLAUDE_CLI_PATH, for instance, must
      # NOT be forwarded: its value on a laptop is /Users/<someone>/.local/bin/claude, which
      # does not exist in the container, so passing it would break the CLI it configures.
      #
      # Defaults match config.py, so an unset key behaves exactly as a stock install.
      BOSS_CODE_AGENT_MAX_CONCURRENCY: ${BOSS_CODE_AGENT_MAX_CONCURRENCY:-1}
      BOSS_CODE_AGENT_MAX_TURNS: ${BOSS_CODE_AGENT_MAX_TURNS:-90}
      BOSS_CODE_AGENT_REVIEW_MAX_TURNS: ${BOSS_CODE_AGENT_REVIEW_MAX_TURNS:-48}
      BOSS_CODE_AGENT_TIMEOUT_SECONDS: ${BOSS_CODE_AGENT_TIMEOUT_SECONDS:-2700}
      BOSS_CODE_AGENT_MAX_THINKING_TOKENS: ${BOSS_CODE_AGENT_MAX_THINKING_TOKENS:-12000}
      BOSS_CODE_AGENT_REVIEW_TIMEOUT_SECONDS: ${BOSS_CODE_AGENT_REVIEW_TIMEOUT_SECONDS:-900}
      BOSS_CODE_AGENT_DESIGN_TIMEOUT_SECONDS: ${BOSS_CODE_AGENT_DESIGN_TIMEOUT_SECONDS:-1200}
      BOSS_CODE_REPAIR_MAX_RETRIES: ${BOSS_CODE_REPAIR_MAX_RETRIES:-0}
      BOSS_SANDBOX_CI_TIMEOUT_SECONDS: ${BOSS_SANDBOX_CI_TIMEOUT_SECONDS:-120}
      BOSS_SANDBOX_CI_POLL_INTERVAL_SECONDS: ${BOSS_SANDBOX_CI_POLL_INTERVAL_SECONDS:-5}
      BOSS_CI_WAIT_TIMEOUT_SECONDS: ${BOSS_CI_WAIT_TIMEOUT_SECONDS:-1800}
      # Mirror config.py's default, never empty: an unset compose variable still SETS the
      # variable to "", which would override the real default with nothing.
      BOSS_CODE_AGENT_ENGINE: ${BOSS_CODE_AGENT_ENGINE:-claude_code}
      BOSS_LLM_ENGINE: ${BOSS_LLM_ENGINE:-auto}
      BOSS_CHAT_LLM_ENGINE: ${BOSS_CHAT_LLM_ENGINE:-}
      BOSS_CLAUDE_CLI_MODEL: ${BOSS_CLAUDE_CLI_MODEL:-}
      BOSS_AGENT_SDK_MODEL: ${BOSS_AGENT_SDK_MODEL:-}
      BOSS_CODE_AGENT_LOW_COST_MODEL: ${BOSS_CODE_AGENT_LOW_COST_MODEL:-}
      BOSS_CODE_AGENT_STRONG_MODEL: ${BOSS_CODE_AGENT_STRONG_MODEL:-}
      # Token prices per model, e.g. a local model at zero. Empty uses BOSS's built-in table.
      BOSS_MODEL_PRICES_JSON: ${BOSS_MODEL_PRICES_JSON:-}
    volumes:
      - boss_community_recovery:/var/lib/boss/recovery:ro
      - boss_community_artifacts:/var/lib/boss/artifacts
      - boss_community_identity:/var/lib/boss/identity
      # The bundled Grafana's per-app dashboards (bundled_monitoring.write_dashboards).
      - boss_community_grafana_dashboards:/var/lib/boss/grafana-dashboards
      # Per-project Maven/Gradle downloads the build sandbox keeps between runs (toolchains).
      - boss_community_toolchain_cache:/var/lib/boss/toolchain-cache
      # BOSS's own source for self-fix builds, read-only (`boss self-fix seed` fills it on the
      # host; install.sh creates the directory so Docker never makes it as root).
      - ../../.boss/selfsrc:/var/lib/boss/selfsrc:ro
      # ONE Codex session shared by api and worker. A subscription CLI holds a rotating
      # credential: every refresh revokes the previous one, so two containers each holding
      # their own copy revoke each other — api detects, worker builds, and whichever runs
      # second finds a dead token. Sharing the directory gives them one credential and one
      # refresh chain. It also survives `up --build`, which a container-local file does not.
      - boss_community_cli_home:/home/boss/.codex
      - boss_community_claude_home:/home/boss/.claude
      - boss_community_grok_home:/home/boss/.grok
    # Same as api: a model server on this machine (Ollama) is reachable as host.docker.internal. Docker
    # Desktop resolves the name already; on Linux this maps it to the host's bridge address.
    # Nothing is published: this only lets the container dial out to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # THE MCP SERVERS BOSS SEEDS — web-intel (Web research, Web search), doc-render (Render docs)
  # and devops-reference (Watch health) — served from the API's image. Every project's seeded
  # servers point here (http://mcp-tools:877x/mcp); before this service existed they pointed at
  # 127.0.0.1 ports nothing listened on, so the Kit's research abilities were dead on arrival.
  mcp-tools:
    build:
      context: ../..
      dockerfile: Dockerfile.community
      target: mcp-tools
      args:
        BOSS_SOURCE_SHA: ${BOSS_SOURCE_SHA:-unknown}
        BOSS_BUILT_AT: ${BOSS_BUILT_AT:-unknown}
        # Opt-in build toolchains (docs/community/TOOLCHAINS.md): none, or java. Every image
        # built from python-runtime takes the same value, so that stage is built once.
        BOSS_TOOLCHAINS: ${BOSS_TOOLCHAINS:-none}
    image: ${BOSS_RECOVERY_API_IMAGE_ID:-boss-community-mcp-tools:${BOSS_COMMUNITY_IMAGE_TAG:-boss-community}}
    pull_policy: ${BOSS_RECOVERY_PULL_POLICY:-missing}
    command: ["python", "-m", "tools.mcp_tools_mux"]
    entrypoint: ["python3", "/usr/local/libexec/boss/recovery_guard.py"]
    restart: unless-stopped
    # AN INIT AS PID 1 (stability spec §4a.4). Agents, builds and previews are this
    # container's children; without an init, uvicorn is PID 1 and never reaps the orphans they
    # leave, so each one becomes a zombie holding a pid until the container restarts. `init`
    # runs Docker's tini, which reaps them and forwards SIGTERM.
    init: true
    mem_limit: 512m
    oom_score_adj: -100
    environment:
      BOSS_EDITION: community
      BOSS_DOC_RENDER_DIR: /var/lib/boss/artifacts/rendered
      BOSS_ARTIFACTS_DIR: /var/lib/boss/artifacts
    volumes:
      - boss_community_recovery:/var/lib/boss/recovery:ro
      - boss_community_artifacts:/var/lib/boss/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; [urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=5).read() for p in (8765, 8770, 8771)]"
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s

  # KG P6b: the Knowledge-Graph MCP endpoint a connected outside agent calls back into
  # (engine/boss_engine/mcp/server.py, `python -m boss_engine serve-mcp --http`). The
  # external_agent step refuses to run without BOSS_KG_MCP_URL (api/worker, above) pointing
  # somewhere real; this is that somewhere for a community install. Read-only transport (no
  # --allow-writes): a `boss_ext_...` token's calls go through handle_external_agent_call, a
  # separate path this flag never gates, so a bank's agent still reads/writes the graph within
  # its own contract.
  kg-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile.community
      target: worker
      args:
        BOSS_SOURCE_SHA: ${BOSS_SOURCE_SHA:-unknown}
        BOSS_BUILT_AT: ${BOSS_BUILT_AT:-unknown}
        BOSS_TOOLCHAINS: ${BOSS_TOOLCHAINS:-none}
    image: ${BOSS_RECOVERY_API_IMAGE_ID:-boss-community-worker:${BOSS_COMMUNITY_IMAGE_TAG:-boss-community}}
    pull_policy: ${BOSS_RECOVERY_PULL_POLICY:-missing}
    command: ["python", "-m", "boss_engine", "serve-mcp", "--http", "--host", "0.0.0.0", "--port", "8790"]
    restart: unless-stopped
    init: true
    mem_limit: 256m
    oom_score_adj: -100
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD (install.sh generates it; never the old default)}@db:5432/boss
      BOSS_EDITION: community
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=5).read()"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s

  # boss-egress (IDENTITY.md §7.10): the only holder of GitHub credentials. Sandboxed builds clone,
  # push and call the GitHub API through it with a per-run boss_egr_ credential bound to their
  # network identity; it injects a per-run, down-scoped installation token and enforces the rule
  # table. Port 8091 is the sandbox's allowlisted CONNECT proxy (model providers, registries).
  # No ports are published: only the compose network reaches it.
  egress:
    build:
      context: ../..
      dockerfile: Dockerfile.community
      target: egress
      args:
        BOSS_SOURCE_SHA: ${BOSS_SOURCE_SHA:-unknown}
        BOSS_BUILT_AT: ${BOSS_BUILT_AT:-unknown}
        # Opt-in build toolchains (docs/community/TOOLCHAINS.md): none, or java. Every image
        # built from python-runtime takes the same value, so that stage is built once.
        BOSS_TOOLCHAINS: ${BOSS_TOOLCHAINS:-none}
    image: ${BOSS_RECOVERY_API_IMAGE_ID:-boss-community-egress:${BOSS_COMMUNITY_IMAGE_TAG:-boss-community}}
    pull_policy: ${BOSS_RECOVERY_PULL_POLICY:-missing}
    command: ["python", "-m", "apps.egress.boss_egress"]
    entrypoint: ["python3", "/usr/local/libexec/boss/recovery_guard.py"]
    restart: unless-stopped
    init: true
    mem_limit: 384m
    oom_score_adj: -300
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD (install.sh generates it; never the old default)}@db:5432/boss
      # Self-fix runs apps/api tests against its OWN disposable database on the same server
      # (created on first use by self_fix_build._api_suite); never the live one.
      BOSS_SELF_FIX_TEST_DATABASE_URL: postgresql+psycopg://boss:${BOSS_DB_PASSWORD:?set BOSS_DB_PASSWORD}@db:5432/boss_selffix_test
      BOSS_EDITION: community
      BOSS_PUBLIC_URL: ${BOSS_PUBLIC_URL:-${BOSS_CONSOLE_PUBLIC_ORIGIN:-}}
      # The console's real port, for links printed before any public origin is bound (the claim
      # link of a laptop install): identity/authn_support.local_console_origin.
      BOSS_WEB_PORT: ${BOSS_WEB_PORT:-3000}
      BOSS_MASTER_KEY_FILE: ${BOSS_MASTER_KEY_FILE:-/var/lib/boss/identity/master.key}
      BOSS_EGRESS_SERVICE_KEY_FILE: /var/lib/boss/identity/egress-service.key
      BOSS_EGRESS_PORT: "8090"
      BOSS_EGRESS_CONNECT_PORT: "8091"
      BOSS_EGRESS_CONNECT_ALLOW: ${BOSS_EGRESS_CONNECT_ALLOW:-}
      BOSS_GITHUB_APP_ID: ${BOSS_GITHUB_APP_ID:-}
      BOSS_GITHUB_APP_INSTALLATION_ID: ${BOSS_GITHUB_APP_INSTALLATION_ID:-}
    volumes:
      - boss_community_recovery:/var/lib/boss/recovery:ro
      - boss_community_identity:/var/lib/boss/identity:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/_boss/healthz', timeout=5).read()"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  web:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: Dockerfile.community
      target: web
      args:
        # THE PORT IS DECLARED ONCE, ABOVE, AND EVERYTHING DERIVES FROM IT.
        #
        # This defaulted to a literal :8000 while the api publishes on ${BOSS_API_PORT}. An
        # install that moved the port — which the installer does routinely, to avoid a clash —
        # baked 127.0.0.1:8000 into the console at BUILD time, so every preview link it handed
        # the operator pointed at a port with nothing behind it. The preview was running and
        # correct, and the only way in was unreachable.
        NEXT_PUBLIC_BOSS_API_URL: ${NEXT_PUBLIC_BOSS_API_URL:-http://127.0.0.1:${BOSS_API_PORT:-8000}}
        NEXT_PUBLIC_BOSS_PROJECT_ID: ${BOSS_DEFAULT_PROJECT_ID:-boss-dogfood}
    image: boss-community-web:${BOSS_COMMUNITY_IMAGE_TAG:-boss-community}
    restart: unless-stopped
    # The console server (measured ~240 MiB). Bounded so it cannot crowd the API.
    mem_limit: 768m
    oom_score_adj: -100
    depends_on:
      api:
        condition: service_healthy
    environment:
      BOSS_API_URL: http://api:8000
      BOSS_API_KEY: ${BOSS_API_KEY}
      # Where the console sends a browser that asks it for a preview (app/v1/[...path]/route.ts).
      BOSS_PREVIEW_PORT: ${BOSS_PREVIEW_PORT:-3001}
      BOSS_PREVIEW_ORIGIN: ${BOSS_PREVIEW_ORIGIN:-}
      BOSS_CONSOLE_PASSWORD: ${BOSS_CONSOLE_PASSWORD:?generated by install.sh}
      BOSS_CONSOLE_SESSION_SECRET: ${BOSS_CONSOLE_SESSION_SECRET:?generated by install.sh}
      BOSS_CONSOLE_PUBLIC_ORIGIN: ${BOSS_CONSOLE_PUBLIC_ORIGIN:-}
      # Proxies in front of the console that append the client to X-Forwarded-For. None ships with
      # BOSS, so 0: the console forwards no client claim at all. Behind your own TLS proxy, set 1
      # in .env and the console forwards the one hop that proxy appended (.env.example).
      BOSS_CONSOLE_PROXY_HOPS: ${BOSS_CONSOLE_PROXY_HOPS:-0}
      NEXT_PUBLIC_BOSS_API_URL: ${NEXT_PUBLIC_BOSS_API_URL:-http://127.0.0.1:${BOSS_API_PORT:-8000}}
      NEXT_PUBLIC_BOSS_PROJECT_ID: ${BOSS_DEFAULT_PROJECT_ID:-boss-dogfood}
    ports:
      - "127.0.0.1:${BOSS_WEB_PORT:-3000}:3000"

volumes:
  boss_community_cli_home:
  boss_community_build_services_secret:
  boss_community_claude_home:
  boss_community_grok_home:
  boss_community_infisical_redis:
  boss_community_pg:
  boss_community_prometheus:
  boss_community_grafana:
  boss_community_grafana_dashboards:
  boss_community_artifacts:
  boss_community_identity:
  boss_community_toolchain_cache:
  # Independent of restored database and identity/key archives.
  boss_community_recovery:
