# TLS in front of the lane's private registries, on a private address (10.77.0.20:443), with a
# certificate issued by the lane's own CA: what an internal Artifactory/Nexus looks like.
worker_processes 2;
events { worker_connections 1024; }
http {
  client_max_body_size 200m;
  proxy_read_timeout 300s;
  proxy_buffering off;
  access_log /dev/stdout;
  ssl_certificate     /etc/entlane/registry.crt;
  ssl_certificate_key /etc/entlane/registry.key;
  server {
    listen 10.77.0.20:443 ssl;
    server_name npm.entlane.internal;
    location / {
      proxy_pass http://127.0.0.1:47873;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
  server {
    listen 10.77.0.20:443 ssl;
    server_name pypi.entlane.internal;
    location / {
      proxy_pass http://127.0.0.1:45000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
