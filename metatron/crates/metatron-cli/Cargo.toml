metatron-policy.workspace = true
metatron-protocol.workspace = true
metatron-remote.workspace = true
metatron-sandbox.workspace = true
metatron-secrets.workspace = true
metatron-session.workspace = true
metatron-tools.workspace = true
metatron-tui.workspace = true
serde_json.workspace = true
